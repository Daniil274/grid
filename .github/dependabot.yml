# Weekly update PRs for what CI/CD and the images are built from; each still
# goes through CI. Python dependencies are left to deliberate upgrades.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directories:
      - /
      - /docker/agent
    schedule:
      interval: weekly
