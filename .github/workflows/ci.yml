name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - "feature/**"
      - "fix/**"
      - "refactor/**"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Compile project
        run: |
          python -m compileall core tests tools web_chat timeline agent_chat.py grid.py

      - name: Run tests
        run: |
          python -m pytest
