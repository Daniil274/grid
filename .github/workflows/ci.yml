name: CI

# The checks every change passes. CD calls this workflow first (workflow_call),
# so main and tags are not tested twice and nothing is published untested.
on:
  pull_request:
  push:
    branches:
      - "feature/**"
      - "fix/**"
      - "refactor/**"
  workflow_dispatch:
  workflow_call:

# Read-only token: nothing here pushes, comments or releases.
permissions:
  contents: read

# A newer push to the same ref makes the older run pointless. Called from CD,
# github.workflow is the caller's, so the group never collides with CD's own.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ruff
        run: python -m pip install "ruff>=0.5"

      # Errors that break at run time: syntax, undefined names, invalid
      # comparisons. Style is not gated here.
      - name: Ruff (errors only)
        run: ruff check . --select E9,F63,F7,F82 --output-format github

  test:
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        # pytest.ini stops at the first failure (-x) for local runs; CI reports all.
        run: python -m pytest -o addopts="" -ra --strict-markers --timeout=300

  js:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run web chat UI tests
        run: node --test tests/*.test.mjs tests/*.test.cjs

  images:
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: grid-agent-system
            context: .
            file: ./Dockerfile
          - image: grid-agent
            context: docker/agent
            file: docker/agent/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ matrix.image }}:ci
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      # The container manager runs and execs as "agent", without capabilities;
      # the agents' tools must be there.
      - name: Check the sandbox tools
        if: matrix.image == 'grid-agent'
        run: |
          docker run --rm --cap-drop ALL --security-opt no-new-privileges=true grid-agent:ci sh -euc '
            test "$(id -un)" = agent
            test "$(pwd)" = /workspace
            codegraph --version
            bd --version
            dolt version
            rg --version
            git --version
          '
