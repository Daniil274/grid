repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  - repo: https://github.com/psf/black
    rev: 24.3.0
    hooks:
      - id: black
        language_version: python3.12  # adjust if needed

  - repo: https://github.com/pycqa/isort
    rev: v5.13.2
    hooks:
      - id: isort
        name: isort (pyproject.toml)

  - repo: https://github.com/pycqa/flake8
    rev: 7.1.0
    hooks:
      - id: flake8
        additional_dependencies: [pyproject-flake8]

  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.9
    hooks:
      - id: bandit
        args: [--quiet, --skip=B101,B201]  # Skip test files and assert_used

  - repo: local
    hooks:
      - id: pytest-quick
        name: pytest (quick tests)
        entry: pytest
        args: [tests/, -q, --maxfail=1, --durations=10, -m "not slow and not integration"]
        pass_filenames: false
        language: system
        always_run: true
        stages: [commit]
