settings:
  default_agent: chat_agent
  max_history: 50
  max_turns: 100
  agent_timeout: 600
  debug: false
  max_tool_output_tokens: 20000
  mcp_enabled: false
  working_directory: .
  config_directory: .
  logs_directory: logs
  allow_path_override: true
  agent_logging:
    enabled: true
    level: full
    save_prompts: true
    save_conversations: true
    save_executions: true
  project_tools:
    enabled: false
    tools_directory: examples/telegram_bot
  image_processing:
    enabled: true
    auto_resize: true
    max_width: 1920
    max_height: 1080
    max_file_size_mb: 10
    jpeg_quality: 85
isolation:
  enabled: false
  type: docker
  image: grid-agent:latest
compact:
  enabled: true
  micro:
    enabled: true
    gap_threshold_minutes: 60.0
    preserve_last_n: 5
  auto:
    enabled: true
    buffer_tokens: 13000
    warning_buffer_tokens: 20000
    error_buffer_tokens: 20000
    manual_buffer_tokens: 3000
    max_output_tokens_for_summary: 20000
    max_consecutive_failures: 3
telegram:
  token_env: TELEGRAM_BOT_TOKEN
  # Proxy for Telegram API requests (e.g. Xray: http or socks5 on localhost)
  # proxy: "http://127.0.0.1:10809"
  # proxy: "socks5://127.0.0.1:10808"
  polling_timeout: 30
  workspace_path: ./workspace
  persist_path: ./data
  max_message_history: 15
  memory_commands_enabled: true
  enable_transparency: false
  show_tool_calls: false
  allowed_users:
  max_concurrent_tasks_per_user: 1
  progress_update_interval: 2.0
voice:
  enabled: true
  stt:
    model_size: base
    device: cpu
    compute_type: int8
  tts:
    model_path: speech-text/model.pt
    speaker: xenia
    sample_rate: 48000
  reply_with_voice: true
providers:
  openrouter:
    name: openrouter
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    timeout: 300
    max_retries: 3
    streaming_enabled: true
  opencode:
    name: opencode
    base_url: https://opencode.ai/zen/go/v1
    api_key_env: "OPENCODE_API_KEY"
    timeout: 300
    max_retries: 3
    streaming_enabled: true

  lm-studio:
    name: "lm-studio"
    base_url: "http://192.168.3.2:1234/v1"
    api_key: "lm-studio"
    timeout: 300
    max_retries: 3
models:
  "perplexity/pplx-embed-v1-0.6b":
    name: perplexity/pplx-embed-v1-0.6b
    provider: openrouter
    description: Perplexity embedding model for semantic search

  gemini-3.1-lite:
    name: google/gemini-3.1-flash-lite-preview
    provider: openrouter
    temperature: 0.7
    max_tokens: 8192
    description: Gemini 3.1 Lite model
    streaming_enabled: true
    capabilities: ["vision", "text", "code"]
  glm-4.7-flash:
    name: z-ai/glm-4.7-flash:turbo
    provider: openrouter
    temperature: 0.7
    max_tokens: 8000
    description: GLM 4.7 Flash model
    streaming_enabled: true
    capabilities: ["vision", "text", "code"]
  gpt-5.4-nano:
    name: openai/gpt-5.4-nano
    provider: openrouter
    temperature: 0.7
    max_tokens: 8192
    description: OpenAI GPT-5.4 Nano

  healer-alpha:
    name: openrouter/healer-alpha
    provider: openrouter
    temperature: 0.5
    max_tokens: 4000
    description: Healer Alpha model
    streaming_enabled: true
    capabilities: ["vision", "text", "code"]
  kimi-k2.5-opencode:
    name: kimi-k2.5
    provider: opencode
    temperature: 0.5
    max_tokens: 8000
    description: kimi-k2.5 model
    streaming_enabled: true
    context_window: 22000
    preserve_reasoning_content: true

  glm-5-opencode:
    name: glm-5
    provider: opencode
    temperature: 0.5
    max_tokens: 8000
    description: kimi-k2.5 model
    streaming_enabled: true
    preserve_reasoning_content: true
embeddings:
  model: perplexity/pplx-embed-v1-0.6b
  request_timeout: 30
  persist: true

improvement:
  enabled: true
  registry_path: data/improvement_registry.json
  plans_directory: plans
  require_human_requirements_review: true
  require_human_final_review: true
  auto_promote_safe_changes: false
  auto_evaluate_proposed_experiments: true
  require_benchmark_before_promotion: true
  promotion_threshold: 0.0
  rollback_threshold: -0.03
  canary_window_minutes: 30
  allowed_change_types: ["tests", "logging", "refactor", "diagnostics"]
  allowed_paths:
  - core/
  - tools/
  - schemas/
  - tests/
  - docs/
  - plans/
  allowed_config_keys:
  - settings.default_agent
  - agents.chat_agent.model
  - agents.chat_agent.tools
  - agents.coordinator.model
  - agents.coordinator.tools

checkers:
  default_audit:
    model: qwen3
    purpose: output_audit
    prompt: |
      You are a checking agent. You are given the agent's task context, agent output, and a list of used tools.
      Check that the agent uses the optimal tool for the task and its actions align with the context and goal of the task.
      Input: a JSON string with fields task_text, tools_used, agent_output.
      Return strictly JSON: {"status":"ok|failed","reason":"...", "details":"..."}.
    tool_prompt: |
      You are a tool-call checking agent. Evaluate whether the tool call is correct given the task goal.
      Do not block access-checking tool calls.
      Input: JSON {task_text, tools_used, tool_name, tool_arguments}.
      Return strictly JSON: {"status":"ok|failed","reason":"...","details":"..."}.
tools:
  file_read:
    type: function
    description: Reads the contents of a file.
  file_write:
    type: function
    description: Writes content to a file.
  file_edit_patch:
    type: function
    description: Edits a file using a patch in unified diff format.
  file_list:
    type: function
    description: List files in a directory (without tree).
  get_file_info:
    type: function
    description: File information.
  list_files:
    type: function
    description: Tool for listing files in a directory.
  pdf:
    type: function
    description: Renders PDF pages to PNG, saves them to pdf_output and
      returns as images
  memory_save:
    type: function
    description: Save information to memory
  memory_search:
    type: function
    description: Search memory by keywords
  memory_delete:
    type: function
    description: Delete memory entry
  skill_save:
    type: function
    description: Save or update a skill in the database (upsert by name)
  skill_read:
    type: function
    description: Read skill content by name
  skill_search:
    type: function
    description: Search skills by text and/or tags (FTS)
  skill_update:
    type: function
    description: Update name, content, or tags of an existing skill
  skill_delete:
    type: function
    description: Delete skill by name
  search_tools:
    type: function
    description: Find available tools by name/description considering
      model modalities
  search_skills:
    type: function
    description: Search skills in the database by text and tags (cross-agent)
  semantic_search:
    type: function
    description: Semantic search over the codebase (by meaning, not by keywords)
    prompt_addition: |
      Use semantic_search_code(query, directory) to search code by meaning of the query.
      If the index is empty — first call index_codebase(directory).
      After indexing, re-indexing is not needed until significant code changes.
  index_codebase:
    type: function
    description: Indexes codebase files into a vector store for
      semantic_search
    prompt_addition: |
      Use index_codebase(directory, file_extensions) before the first semantic_search.
      file_extensions by default covers .py, .js, .ts and other languages.
  semantic_memory_search:
    type: function
    description: Hybrid vector+keyword search over memory by MEANING, not just 
      keywords
    prompt_addition: |
      Use semantic_memory_search(query) instead of memory_search when searching by CONCEPT:
      - When exact keywords are unknown ("how did I solve the audio issue")
      - Cross-language queries (Russian query → English memory entries)
      - Fuzzy recall: "something about charging algorithm" → finds BQ25890 entries
      Always try semantic_memory_search first for recall tasks.

  claude_history_search:
    type: function
    description: Search personal Claude.ai chat history for past discussions and
      solutions
    prompt_addition: |
      Use claude_history_search(query) to recall past decisions, solutions, or context
      from the user's previous Claude.ai conversations. Useful when the user references
      something they've worked on before or when domain context is needed.

# ============================================================================
  # System Introspection Tools - meta-information about the system
  # ============================================================================

  system_list_agents:
    type: "function"
    description: "List all system agents with their descriptions and capabilities"

  system_get_agent_info:
    type: "function"
    description: "Detailed information about an agent: model, tools, prompt"

  system_list_tools:
    type: "function"
    description: "List all system tools by category"

  system_get_tool_info:
    type: "function"
    description: "Detailed information about a tool: parameters, description"

  system_help:
    type: "function"
    description: "System help: architecture, agents, tools, memory"

  system_get_context:
    type: "function"
    description: "Information about the current execution context"

  create_improvement_problem:
    type: function
    description: Register an observed problem for the improvement backlog

  list_improvement_problems:
    type: function
    description: List tracked problems in the staged self-improvement backlog

  create_improvement_experiment:
    type: function
    description: Create a controlled experiment for an approved improvement 
      problem

  propose_config_experiment:
    type: function
    description: Create a bounded config-diff experiment from an observed 
      improvement problem

  evaluate_improvement_experiment:
    type: function
    description: Run benchmark evaluation for an improvement experiment and 
      store scorecards

  run_improvement_canary:
    type: function
    description: Run canary benchmark for an experiment and promote or roll back
      automatically

  monitor_promoted_improvement:
    type: function
    description: Run post-promotion benchmark and roll back automatically on 
      regression

  record_requirement_review:
    type: function
    description: Record requirements review for an improvement problem

  record_final_review:
    type: function
    description: Record final review for an improvement experiment

  promote_improvement_experiment:
    type: function
    description: Promote an experiment only after the required review gates pass

  reject_improvement_experiment:
    type: function
    description: Reject an experiment and preserve the rejection reason

  view_image:
    type: function
    description: View and analyze an image with vision model
  crop_image:
    type: function
    description: Crop an image to a specific region
  beads_init:
    type: function
    description: Initialize beads (bd) in the given directory. Idempotent; safe 
      if already initialized.
  beads_ready:
    type: function
    description: List beads tasks that are ready to be worked on (no open 
      blockers)
  beads_list:
    type: function
    description: List beads tasks with optional filters and pagination
  beads_create:
    type: function
    description: Create a new bead (task, epic, message, etc.)
  beads_show:
    type: function
    description: Show detailed information about a specific bead
  beads_update:
    type: function
    description: Update an existing bead
  beads_close:
    type: function
    description: Close a bead
  beads_sync:
    type: function
    description: Sync beads with the remote repository
  beads_dep:
    type: function
    description: Manage dependencies between beads
  send_voice_reply:
    type: function
    description: Synthesizes speech from text and sends a voice message
      to the user in Telegram
    prompt_addition: |
      Use send_voice_reply(text, speaker) to reply to the user with voice.
      By default, reply in the same format the user wrote to you:
      - If the user sent a voice message — reply with voice via send_voice_reply().
      - If the user wrote text — reply with text.
      Exception: if the user's memory specifies a different preferred reply format.
      Voices: xenia (female, default), aidar, kseniya, baya, eugene.
  send_voice_ssml:
    type: function
    description: Synthesizes speech from SSML markup and sends a voice
      message to Telegram
    prompt_addition: |
      Use send_voice_ssml(ssml_text, speaker) for expressive voice replies with SSML.
      SSML allows controlling tempo, tone, and pauses:
        <speak><p><prosody rate="slow">slowly</prosody></p><break time="500ms"/>text</speak>
      Tags: <speak>, <p>, <s>, <break time="Xms"/>, <prosody rate="slow|fast">, <prosody pitch="high|low">
      Voices: xenia (default), aidar, kseniya, baya, eugene.
  code_agent:
    type: agent
    name: call_code_agent
    description: Calls the code agent for working with code and
      programming.
    prompt_addition: Always use call_code_agent(task) for code-related tasks
      or code files. task is the task the code agent should solve,
      including the file path, directory, or repository and a detailed task description.
  system_agent:
    type: agent
    name: call_system_agent
    description: Delegates platform-system lifecycle work to the system agent.
    prompt_addition: |
      Use call_system_agent(task) when the task is about system versions, candidate releases,
      cross-system discovery, platform registry access, or promotion gates.
      Include the target system id, expected validation flow, and the exact release outcome you need.
  doc_analyzer:
    type: agent
    name: call_doc_analyzer
    description: Calls the document and image analyzer.
    prompt_addition: |
      Use call_doc_analyzer(task) for analyzing images, PDFs, and markdown documents.
      task is the task specifying the file path and what to find/analyze.
  memory_agent:
    type: agent
    name: call_memory_agent
    description: Calls the memory agent for working with long-term memory
    prompt_addition: 'Use call_memory_agent(task) for working with memory: saving
      important information, searching memory, working with daily notes. task is the task
      for the memory agent.'
    context_strategy: conversation
    context_depth: 544

  system_create_version:
    type: function
    description: Registers a new system version from a full SystemDefinition JSON definition.
    prompt_addition: |
      Use system_create_version(definition_json, status?, actor_role?, created_by?) to:
      - register a new system or a new version of an existing one;
      - definition_json — full JSON SystemDefinition object:
          {
            "system_id": "my-system",
            "version": "1.0.0",
            "entrypoint": "node_name",
            "interface": {"input_schema": "...", "output_schema": "..."},
            "nodes": {
              "node1": {"type": "agent_node", "agent_ref": "agents.chat_agent", "title": "..."},
              "node2": {"type": "tool_node", "tool_ref": "tools.beads_init", "title": "..."}
            },
            "edges": [{"from": "node1", "to": "node2"}]
          }
      - status defaults to "candidate"; after validation call system_promote_version.
      Do not delegate definition creation to another agent — compose definition_json yourself based on
      read files (file_read, file_list) and the user's task.

  system_list_systems:
    type: function
    description: Lists registered systems in the platform registry.
    prompt_addition: Use system_list_systems() before choosing a target system 
      or dependency.
  system_get_system_info:
    type: function
    description: Reads manifest and optional definition details for a registered
      system.
    prompt_addition: Use system_get_system_info(system_id, include_definition?) 
      before planning mutations or integrations.
  system_get_system_versions:
    type: function
    description: Lists all known versions for a registered system.
    prompt_addition: Use system_get_system_versions(system_id) to inspect 
      candidate, canary, and stable history.
  system_invoke_system:
    type: function
    description: Invokes another registered system through the platform runtime.
    prompt_addition: Use system_invoke_system(system_id, input_payload_json, 
      channel?, version?) to call peer systems by contract.
  system_clone_version:
    type: function
    description: Clones an existing system version into a new candidate version.
    prompt_addition: Use system_clone_version(system_id, new_version, 
      source_version?, source_channel?) to start immutable version changes.
  system_apply_mutations:
    type: function
    description: Applies bounded system mutations and registers a new version.
    prompt_addition: Use system_apply_mutations(system_id, mutations_json, 
      new_version, source_version?, source_channel?) instead of editing raw 
      config text.
  system_promote_version:
    type: function
    description: Moves a system version into canary or stable.
    prompt_addition: Use system_promote_version(system_id, version, 
      target_channel, expected_current?) only after validation passes.
  system_reject_version:
    type: function
    description: Rejects a candidate or canary system version.
    prompt_addition: Use system_reject_version(system_id, version) when a 
      candidate fails validation.
  system_rollback_stable:
    type: function
    description: Rolls back the stable channel to a previous version.
    prompt_addition: Use system_rollback_stable(system_id, rollback_to_version) 
      if a promoted version regresses.

prompt_templates:
  memory_extract_prompt: |
    Analyze the following memory entry and extract a concise summary and key entities.
    Also, classify the entities into categories like Person, Organization, Technology, Concept, etc.

    Memory Content:
    {content}

    Respond ONLY with a JSON object in the following format:
    {
        "summary": "1-2 sentence summary of the core fact",
        "entities": ["Entity1", "Entity2", "Entity3"]
    }
  memory_consolidate_prompt: |
    Analyze the following recent memory entries and synthesize them into a single high-level insight or pattern.
    If they are unrelated, respond with {"insight": null}.
    Otherwise, provide a consolidated insight and list the source IDs.

    Memories:
    {content}

    Respond ONLY with a JSON object in the following format:
    {
        "insight": "High-level summary or pattern discovered across these memories",
        "entities": ["Entity1", "Entity2"],
        "connections": [{"from_id": 1, "to_id": 2, "relationship": "depends on"}]
    }
  task_analyst_prompt: |
    You are a task analyst. Your task is to analyze tasks and create an action plan.
    Always use the full task context, including files and repositories.
    Do not start executing the task until calling the code agent or file agent.
    Do not use specific commands or try to execute them.
  with_files: |
    You are an agent with file manipulation tools. You can read, edit, and analyze files.
    NEVER PROVIDE CONTENT ANALYSIS, EVEN IF SPECIFIED IN THE TASK.
  with_web: |
    You are an assistant with internet access. You can search for current information and news.
    Always cite information sources.
  code_agent_prompt: |
    You are a senior software engineer. You write reliable, readable, well-structured code.
    Not used directly — the agent prompt is set in agents.code_agent.custom_prompt.
  debugger_prompt: |
    You are a debugger. Your task is to debug code and perform tasks related to running programs.
    Before each step and tool call, use sequential thinking for analysis and planning.
agents:
  code_agent:
    name: Code Agent
    model: kimi-k2.5-opencode
    tools:
    - file_read
    - file_write
    - file_edit_patch
    - file_list
    - get_file_info
    - memory_save
    - memory_search
    - memory_delete
    - semantic_search
    - index_codebase
    - skill_save
    - skill_read
    - skill_search
    - system_get_system_info
    - system_get_system_versions
    - system_agent
    description: Specialist in programming, code analysis, and refactoring
    mcp_enabled: false
    verifier: default_audit
    custom_prompt: |
      You are a senior software engineer. You write reliable, readable, and well-structured code.
      You work autonomously from task definition to result verification.

      # Task Start Protocol
      Before any code work, perform three steps:
      1. memory_search — find past solutions, patterns, agreements, and environment constraints related to the task.
      2. skill_search — find a skill if the task is routine (refactoring, tests, migration, etc.).
      3. Study the code structure: first list files, then read only what is necessary.
         Do not read entire files without reason.

      # Semantic Search
      - Use semantic_search_code(query, directory) to navigate an unfamiliar codebase
        or when you don't know where exactly to look for the implementation.
      - Before the first search, ensure the index is created: index_codebase(directory).
      - Write queries in the language of concepts, not keywords: "processing incoming events" is better than "event handler".

      # Work Cycle (Read → Understand → Plan → Implement → Verify)
      1. Read: read only the directly affected files and their dependencies.
      2. Understand: formulate for yourself what the current code does and why the task requires changes.
      3. Plan: decide which files to change and how. For non-trivial tasks, state the plan explicitly.
      4. Implement: make minimal necessary changes. Do not refactor code outside the task scope.
      5. Verify: after changes, run tests or verification commands, ensure nothing is broken.

      # Working with Memory
      - After completing a task, save to memory: key architectural decisions, non-trivial findings,
        patterns that will be useful for the next similar task.
      - Save concrete facts, not a retelling — one entry = one clear thought.
      - Tags: language/framework, pattern type, module (e.g.: python, async, auth_module).
      - Do not duplicate existing entries — first memory_search, then memory_save.

      # Working with Skills
      - If you solved a non-trivial task in a repeatable way — save it as skill_save.
      - Skill = step-by-step instruction or template, applicable in the future without extra context.

      # Code Rules
      - Do not change behavior of existing functions beyond the task.
      - Do not add dependencies unnecessarily.
      - Do not leave commented-out code and debug output.
      - If the task is ambiguous — clarify before starting implementation, not in the middle.

      # Response Format
      - Briefly describe what was done and why that solution was chosen.
      - Specify which files were changed.
      - If tests were run — provide the result.
      - Reply in the language of the task.
  system_agent:
    name: System Agent
    model: kimi-k2.5-opencode
    tools: [file_read, file_write, file_edit_patch, file_list, get_file_info, 
        system_list_systems, system_get_system_info, system_get_system_versions, 
        system_invoke_system, system_clone_version, system_apply_mutations, 
        system_create_version, system_promote_version, system_reject_version, 
        system_rollback_stable, code_agent, memory_search, skill_search]
    base_prompt: base
    description: Platform self-improvement agent, working only through
      system and agent tools.
    custom_prompt: |
      You are the platform system-agent.
      Your role:
      - analyze the user's request and independently gather context via file_read and file_list;
      - design SystemDefinition (node graph) and register it via system_create_version;
      - find existing systems via system_list_systems, system_get_system_info;
      - call code_agent only for code/test changes in implementation;
      - call other systems only through system_invoke_system.

      Hard rules:
      1. Do NOT delegate SystemDefinition creation to tools or nested agents — compose
         definition_json YOURSELF based on read files and the user's task.
      2. To create a new system:
         a) Read the necessary example files (file_read, file_list);
            Be sure to read: root config.yaml (sections agents/tools/providers/models), schemas/system_platform.py.
         b) Compose definition_json yourself;
         c) Write the artifact bundle BEFORE registration to the directory
            workspace/generated_systems_from_agent/<system_id>/<version>/:

            BUNDLE STRUCTURE (single config + tools as python files):
            ├── config.yaml          ← SINGLE system config (like root config.yaml):
            │                            sections: settings, providers, models, agents, tools
            │                            agents.<key>.tools reference names from the tools section
            │                            tools.<name>.type: function — for local python tools
            └── tools/
                └── <tool_name>.py   ← Python file with @function_tool function (one function = one file)
                                         Decorator: from agents import function_tool; @function_tool

            Do NOT create separate agents.yaml, tools.yaml, prompts.yaml — only config.yaml + tools/*.py.

         d) Call system_create_version(definition_json, status="candidate");
         e) After verification call system_promote_version(system_id, version, "stable").
      3. For modifying an existing system, use the immutable flow:
         system_clone_version → system_apply_mutations → system_create_version → promote/reject.
      4. Do not assume you have access to another system's internals without explicit reading.
      5. Do not invent hidden channels — only system_invoke_system for calling other systems.
      6. system_invoke_system sends the request to the real agent of the target system (agent_ref → agent_key in config).
         The system entrypoint must be an agent_node with agent_ref of the form "agents.<key>", where <key> is a key from config.yaml agents.

      SystemDefinition structure (nodes — graph, edges — flow):
      - agent_node: {"type": "agent_node", "agent_ref": "agents.<key>", "title": "..."}
        agent_ref points to an agent from the root config.yaml (agents.<key>), e.g. "agents.code_agent".
      - tool_node:  {"type": "tool_node",  "tool_ref": "<tool_name>",  "title": "..."}
        tool_ref — function name from tools/*.py in the bundle (without system prefix).
      entrypoint must be one of the node keys.

      Expected result:
      - brief change plan;
      - list of created bundle files;
      - which candidate version was released;
      - what to check before stable promotion.

  doc_analyzer:
    name: Document Analyzer
    model: kimi-k2.5-opencode
    tools: [pdf, list_files, file_read, view_image, crop_image, get_file_info]
    base_prompt: base
    description: Agent for analyzing, converting, and creating reports from documents
    custom_prompt: |
      You are a document specialist.
      ⚠️ CRITICALLY IMPORTANT - NEVER READ DOCUMENTS IN FULL!
      Mandatory PDF working strategy:
      1. ALWAYS start with the first pages: pdf(path, pages="1:1") or pages="1:2"
      2. NEVER read more than 3 pages at a time: pages="1:3" maximum
      3. First use pdf(...) to get pages as images
      4. If more is needed - make several requests of 2-5 pages each

      Hard rules:
      1. list_files BEFORE any work with files
      2. PDF: ONLY pages="1:1" or "1:2" to start
      3. NEVER use large ranges like "1:20" or "1:50"

  memory_optimizer:
    name: Memory Optimizer
    model: gemini-3.1-lite
    description: Background agent for memory optimization and consolidation
    base_prompt: base

  memory_agent:
    name: Memory Agent
    model: glm-4.7-flash
    tools: [memory_save, memory_search, memory_delete, beads_ready, beads_list, 
        beads_create, beads_show, beads_update, beads_close, beads_sync, 
        beads_dep]
    description: System memory management specialist
    custom_prompt: |
      You are a memory agent. Your mission is to maintain a living, up-to-date, and well-structured system knowledge base.
      ## Memory types and importance
      - long_term (0.7–1.0): stable knowledge, preferences, key decisions
      - short_term (0.3–0.6): temporary notes, intermediate data
      - insight (0.7–1.0): consolidated conclusions from multiple entries
      - skill: procedures and action algorithms
      - task / task_plan: current tasks and plans
      ## Save strategy
      1. Always first memory_search — never duplicate existing entries.
      2. If a similar entry exists — update or merge, do not create a new one.
      3. Tags: precise, specific (python, api, bug, user_preference, deadline, etc.).
      4. Formulate concisely and succinctly — one entry = one clear thought.
      ## Active optimization (on every request)
      With any memory operation, in parallel look for opportunities:
      - Merge closely related short_term entries into one insight.
      - Promote important short_term to long_term if the information turned out to be long-lasting.
      - Delete outdated or redundant entries (first query to search, then entry_id to delete).
      - Structure scattered facts into a coherent summary entry of type insight.
      ## Tasks (Beads)
      Tasks, plans, and long-term work — through beads. Close completed ones, update status of active ones.
      Reply in Russian.
  chat_agent:
    name: Chat Agent
    model: kimi-k2.5-opencode
    tools: [file_list, file_read, get_file_info, memory_search, memory_agent, 
        doc_analyzer, beads_init, beads_ready, beads_list, beads_create, 
        beads_show, beads_update, beads_close, beads_sync, beads_dep, 
        send_voice_reply, send_voice_ssml, skill_save, skill_read, skill_search, 
        skill_update, skill_delete, search_tools, search_skills, 
        claude_history_search, semantic_memory_search, system_agent, "system_list_agents",
        "system_get_agent_info", "system_list_tools", "system_get_tool_info", "system_help",
        "system_get_context", "create_improvement_problem", "list_improvement_problems",
        "create_improvement_experiment", "propose_config_experiment", "evaluate_improvement_experiment",
        "run_improvement_canary", "monitor_promoted_improvement", "record_requirement_review",
        "record_final_review", "promote_improvement_experiment", "reject_improvement_experiment"]
    auto_run_tools:

    - name: beads_init
      parameters:
        directory: ${working_directory}

    - name: beads_ready
      parameters:
        directory: ${working_directory}

    - name: skill_search
      parameters:
        query: ""
        limit: 20

    description: Main agent for user communication
    custom_prompt: |-
      You are the main chat agent of the system - the first point of contact with the user.
      # Your task: understand user requests and effectively solve them using memory, tools, or agents.
      ## Skills
      Skills are your knowledge of special tasks and procedures.
      After a user request, read a skill that can be used to solve the task from the list of available skills.
      ## Response Format
      Reply in the same format in which the user wrote to you:
      - If the request is marked [VOICE MESSAGE] — ALWAYS call send_voice_reply() or send_voice_ssml()
        and then add a short text message if necessary.
      - If the user wrote text — reply with text.
      Exception: if a different preferred reply format is saved in the user's memory.
      Work strategy:
      1. Analyze the user's request
      2. For planning and complex tasks use beads (beads_ready, beads_show, etc.)
      3. For image and document analysis - delegate to doc_analyzer
      4. Save all received information to memory.
      Memory rules:
      1. Use memory_search as the primary way to recall user preferences, past solutions, constraints, and relevant context.
      2. First search memory, then act. Do not delegate to memory_agent if memory_search is sufficient.
      3. For writing, updating, deleting, and clearing memory delegate to memory_agent.
      4. Do not call memory_optimizer directly. Memory optimization runs automatically after saving.
      5. Save only knowledge useful in future sessions:
        - user preferences
        - project agreements
        - recurring environment constraints
        - important conclusions and task outcomes
      6. Do not save one-time noise, long intermediate reasoning, and what is already reliably reflected in beads.
      7. If memory contradicts the current user message, trust the current user message and if necessary initiate a memory update via memory_agent.
      8. For complex tasks, first retrieve memory, then briefly pass relevant facts to coordinator or another agent.
      9. If the user's request is clearly related to their past behavior, preferences, or previously done work, memory_search is mandatory.
      10. If the user asks to "remember", "forget", "what do you remember about me" or "update this in memory", immediately use memory_agent.
      Always:
      - Reply in Russian
      - Before passing a task to an agent, make a record in the tracker.
      - It is permissible to use multiple tools and/or agents in one response. When called simultaneously, they will execute sequentially.
      - Do not rely on intermediate thinking between already launched steps; pass dependencies through beads and other external artifacts.
      - If the request context is unclear - clarify with the user
      - When making requests to agents, pass them the full task context.
      Prohibited:
      - Using tables, md markup, and other tags, codes, etc. in the final response.
