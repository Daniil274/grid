# Полная конфигурация AI системы
# Провайдеры -> Модели -> Инструменты -> Агенты

# Глобальные настройки
settings:
  default_agent: "chat_agent"  # Изменено на chat_agent как главную точку входа
  max_history: 50
  max_turns: 100  # лимит ходов для агентов
  agent_timeout: 300  # Таймаут выполнения агента в секундах (5 минут)
  debug: false
  mcp_enabled: true
  # Настройки путей
  working_directory: "D:/Work/repo/agents_portable/workspace/default_user"  # Рабочая директория по умолчанию
  config_directory: "."   # Директория конфигурации
  logs_directory: "D:/Work/repo/agents_portable/logs"
  allow_path_override: true  # Разрешить переопределение пути при запуске
  # Настройки логирования
  agent_logging:
    enabled: true
    level: "full"  # basic, detailed, full
    save_prompts: true
    save_conversations: true
    save_executions: true
    # Общие правила использования инструментов (добавляются к каждому агенту один раз)
    tools_common_rules: |
      Всегда выполняй операции с файлами через инструменты и возвращай их результаты.
      Запрещено утверждать создание/изменение файла без вызова инструмента.
  # Настройки обработки изображений
  image_processing:
    enabled: true
    auto_resize: true  # Автоматически уменьшать большие изображения
    max_width: 1920  # Максимальная ширина в пикселях
    max_height: 1080  # Максимальная высота в пикселях
    max_file_size_mb: 10  # Максимальный размер файла в MB
    jpeg_quality: 85  # Качество JPEG (1-100). 85 дает ~8k токенов, хорошо для текста


# Настройки Telegram бота
telegram:
  # Токен бота (загружается из переменной окружения TELEGRAM_BOT_TOKEN)
  token_env: "TELEGRAM_BOT_TOKEN"

  # Базовые настройки
  polling_timeout: 30  # Таймаут polling в секундах

  # Пути для данных
  workspace_path: "./workspace"  # Рабочая директория для временных данных
  persist_path: "./data"  # Директория для постоянных данных

  # Настройки памяти
  max_message_history: 15  # Количество сообщений в истории
  memory_commands_enabled: true  # Команды /recall, /daily и т.д.

  # Возможности
  enable_transparency: false  # Отключено: live-обновления вызывают flood control в Telegram
  show_tool_calls: false  # Отключено: live-обновления вызывают flood control в Telegram

  # Доступ (null = все пользователи разрешены)
  allowed_users: null  # Список разрешенных user_id или null для всех

  # Настройки производительности
  max_concurrent_tasks_per_user: 1  # Максимум одновременных задач на пользователя
  progress_update_interval: 2.0  # Интервал обновления прогресса (секунды) - увеличен для избежания флуд-контроля
 
# Провайдеры API
providers:
  lm-studio:
    name: "lm-studio"
    base_url: "http://192.168.3.2:1234/v1"
    api_key: "lm-studio"
    timeout: 300
    max_retries: 3
  
  openrouter:
    name: "openrouter"
    base_url: "https://openrouter.ai/api/v1"
    api_key_env: "OPENROUTER_API_KEY"
    timeout: 300
    max_retries: 3
    streaming_enabled: true



# Модели
models:
  black-pony:
    name: "openrouter/pony-alpha"
    provider: "openrouter"
    temperature: 0.7
    max_tokens: 8192
    description: "Темная лошадка."
    streaming_enabled: true

  deepseek-v3.2:
    name: "deepseek/deepseek-v3.2:nitro"
    provider: "openrouter"
    temperature: 0.7
    max_tokens: 8192
    description: "DeepSeek V3.2 Speciale модель"
    streaming_enabled: true

  grok-4.1-fast:
    name: "x-ai/grok-4.1-fast"
    provider: "openrouter"
    temperature: 0.7
    max_tokens: 8000
    description: "Grok 4.1 Fast модель"
    streaming_enabled: true

  glm-4.7-flash:
    name: "z-ai/glm-4.7-flash:turbo"
    provider: "openrouter"
    temperature: 0.7
    max_tokens: 8000
    description: "GLM 4.7 Flash модель"
    streaming_enabled: true

  openai-oss-120b:
    name: "openai/gpt-oss-120b"
    provider: "openrouter"
    temperature: 0.7
    max_tokens: 8192
    description: "OpenAI OSS 120b модель"


  qwen3-vl-235b-a22b:
    name: "qwen/qwen3-vl-235b-a22b-instruct"
    provider: "openrouter"
    temperature: 0.7
    max_tokens: 8000
    description: "Qwen 3 8b модель"

  aurora:
    name: "openrouter/aurora-alpha"
    provider: "openrouter"
    temperature: 0.5
    max_tokens: 8000
    description: "speedy pony"

# Минимальная секция проверяющих (для аудита в Output guardrail)
checkers:
  default_audit:
    model: "qwen3"   # опционально для будущего расширения; сейчас не вызывается
    purpose: "output_audit"
    prompt: |
      Ты проверяющий агент. Тебе предоставляется контекст задачи агента, вывод агента и список использованных инструментов.
      Проверь что агент использует оптимальный инструмент для выполнения задачи и его действия соответствуют контексту и цели задачи.
      Вход: одна строка JSON с полями task_text, tools_used, agent_output.
      Верни строго JSON: {"status":"ok|failed","reason":"...", "details":"..."}.
    tool_prompt: |
      Ты проверяющий агент вызовов инструментов. Оцени, корректен ли вызов инструмента с учётом цели задачи.
      Не блокируй вызовы инструментов, проверяющих доступ.
      Вход: JSON {task_text, tools_used, tool_name, tool_arguments}.
      Верни строго JSON: {"status":"ok|failed","reason":"...","details":"..."}.

# Инструменты
tools:
  list_files:
    type: "function"
    description: "Инструмент для получения списка файлов в директории."
    prompt_addition: "Используй list_files(directory) для получения списка файлов в директории. directory - директория (по умолчанию '.')."

  # ============================================================================
  # Document Processing Tools - OCR и работа с документами
  # ============================================================================

  pdf:
    type: "function"
    description: "Конвертирует PDF в Markdown через OCR с кэшированием результатов"
    prompt_addition: "pdf(pdf_path, pages): OCR обработка PDF. ⚠️ ВСЕГДА начинай с pages='1:1' или '1:2'. Максимум '1:5'. Результаты кэшируются."

  get_screenshot_ocr:
    type: "function"
    description: "Извлекает текст из скриншота монитора"
    prompt_addition: "get_screenshot_ocr(monitor_index): OCR скриншота. monitor_index - номер монитора (0 по умолчанию)."

  read_markdown:
    type: "function"
    description: "Читает Markdown файлы с изображениями"
    prompt_addition: "read_markdown(file_path): Читает .md файл и извлекает изображения."

  # ============================================================================
  # Document Conversion & Export Tools - конвертация и экспорт
  # ============================================================================

  markdown_to_html:
    type: "function"
    description: "Конвертирует Markdown в HTML файл"
    prompt_addition: "markdown_to_html(markdown_content, output_filename, title): Создает HTML из Markdown."

  markdown_to_pdf:
    type: "function"
    description: "Конвертирует Markdown в PDF файл"
    prompt_addition: "markdown_to_pdf(markdown_content, output_filename, title): Создает PDF из Markdown."

  save_report:
    type: "function"
    description: "Сохраняет отчет в указанном формате"
    prompt_addition: "save_report(content, filename, format): Сохраняет отчет. format=md|txt|html|json."

  merge_reports:
    type: "function"
    description: "Объединяет несколько отчетов в один"
    prompt_addition: "merge_reports(report_paths, output_filename, section_headers): Объединяет отчеты с заголовками."

  # Memory Tools - инструменты для работы с памятью
  # ============================================================================
  # Memory Tools V2  - 3 simplified tools
  # ============================================================================

  memory_save:
    type: "function"
    description: "Save information to memory"
    prompt_addition: "memory_save(text, type, tags, importance): Save to memory. type=long_term|short_term|task|task_plan. tags for search. importance 0-1."

  memory_search:
    type: "function"
    description: "Search memory by keywords"
    prompt_addition: "memory_search(query, type, limit): Full-text search. query=keywords or empty for recent. type to filter. limit=max results."

  memory_delete:
    type: "function"
    description: "Delete memory entry"
    prompt_addition: "memory_delete(query, entry_id): Delete memory. query to find entries, entry_id to delete specific. Returns list or confirmation."

  task_update:
    type: "function"
    description: "Update task state"
    prompt_addition: "task_update(content, action, entry_id, importance): action=add|plan|complete|update|delete. Track task progress."

  # Skill Tools - инструменты для работы со скиллами (базой знаний)
  # ============================================================================

  skill_create:
    type: "function"
    description: "Create a new skill (knowledge base entry)"
    prompt_addition: "skill_create(name, file_path, tags): Register a skill from a file. First write content to file_path, then call this to index it."

  skill_update:
    type: "function"
    description: "Update an existing skill"
    prompt_addition: "skill_update(name, content): Update skill file and DB entry."

  skill_delete:
    type: "function"
    description: "Delete a skill"
    prompt_addition: "skill_delete(name): Remove skill file and DB entry."

  skill_read:
    type: "function"
    description: "Read the content of a skill"
    prompt_addition: "skill_read(name): Read skill markdown content from user directory."

  skill_search:
    type: "function"
    description: "Search for skills by keywords"
    prompt_addition: "skill_search(query): FTS search in skill database. Returns matching skill names and snippets."
  # ============================================================================
  # Vision Tools - инструменты для просмотра и анализа изображений
  # ============================================================================

  view_image:
    type: "function"
    description: "View and analyze an image with vision model"
    prompt_addition: "view_image(image_path, question): Load image and ask vision model to analyze it. Use for screenshots, photos, diagrams."

  analyze_screenshot:
    type: "function"
    description: "Analyze UI screenshot"
    prompt_addition: "analyze_screenshot(screenshot_path): Specialized tool for analyzing UI/interface screenshots."

  # MCP серверы
  terminal:
    type: "mcp"
    server_command: ["npx", "@dillip285/mcp-terminal"]
    add_working_directory: true
    description: "MCP сервер для выполнения команд терминала"
    prompt_addition: "Используй execute_command для выполнения команд в терминале."
  
  # Файловая система
  filesystem:
    type: "mcp"
    server_command: ["npx", "@modelcontextprotocol/server-filesystem"]
    add_working_directory: true
    description: "MCP сервер для работы с файловой системой (ограничен рабочей директорией)"
    prompt_addition: "Используй filesystem для доступа к файловой системе."

  sequentialthinking:
    type: "mcp"
    server_command: ["npx", "@modelcontextprotocol/server-sequential-thinking"]
    description: "MCP сервер для последовательного мышления"
    prompt_addition: "ВАЖНО!!! ВСЕГДА Используй sequential thinking для анализа, планирования задачи. Вызывай его перед выполнением любой задачи."
  
  
  # Агенты как инструменты
  file_agent:
    type: "agent"
    name: "call_file_agent"
    description: "Вызывает файлового агента для работы с файлами"
    prompt_addition: "Используй call_file_agent(task) для задач по работе с файлами, где task - это задача, которую должен выполнить файловый агент.  Используй unified diff для редактирования файлов."
    # Context sharing configuration for agent tools
    context_strategy: "conversation"
    context_depth: 5
    include_tool_history: true
   
  task_analyst:
    type: "agent"
    name: "call_task_analyst"
    description: "Вызывает аналитика задач для анализа задач и составления плана действий."
    prompt_addition: "ВСЕГДА ВЫЗЫВАЙ call_code_agent(task) для помощи в составлении плана действий. task - это задача, которую нужно решить с полным контекстом и списком досткупных тебе инструментов. БЕЗ ПРЕДОСТАВЛЕНИЯ ПОЛНОГО КОНТЕКСТА И СПИСКА ДОСТУПНЫХ ИНСТРУМЕНТОВ АНАЛИТИК НЕ ПОМОЖЕТ!!! НЕ вызывай другие инструменты до вызова аналитика."
    # Context sharing configuration for agent tools
    context_strategy: "full"
  
  code_agent:
    type: "agent"
    name: "call_code_agent"
    description: "Вызывает кодового агента для работы с кодом и программированием"
    prompt_addition: "Всегда call_code_agent(task) для задач, связанных с кодом или с файлами кода. task - это задача, которую должен решить кодовый агент с путем к файлу, директории или репозиторию и подробным описанием задачи."
    # Context sharing configuration for agent tools

  
  coordinator:
    type: "agent"
    name: "call_coordinator"
    description: "Вызывает координатора для планирования и решения задачи"
    prompt_addition: |
      Вызывай call_coordinator(task) для планирования и решения задачи. 
      task - это задача, которую нужно решить.
    # Context sharing configuration for agent tools

  doc_analyzer:
    type: "agent"
    name: "call_doc_analyzer"
    description: "Вызывает анализатора документов и изображений."
    prompt_addition: |
      Используй call_doc_analyzer(task) для анализа изображений, PDF и markdown документов.
      task - это задача с указанием пути файла и что нужно найти/проанализировать.

  context_wrapper:
    type: "agent"
    name: "call_context_wrapper"
    description: "Вызывает сборщика контекста для управления контекстом и взаимодействия с агентами"
    prompt_addition: "Используй call_context_wrapper(task) для получения контекста по кодовой базе. task - это задача для которой требуется контекст."


  debugger:
    type: "agent"
    name: "call_debugger"
    description: "Вызывает отладчика для отладки кода"
    prompt_addition: "Используй call_debugger(task) для запуска программ и отладки кода."


  orchestrator:
    type: "agent"
    name: "orchestrator"
    description: "Запускает динамический пайплайн."
    # Модель для динамического агента по умолчанию
    prompt_addition: |
      Используй orchestrator(task) когда нужно создать агента на лету для решения задачи.

  orchestrate:
    type: "function"
    name: "orchestrate"
    description: "Запускает динамический пайплайн (создает агента на лету)"
    env_vars:
      DEFAULT_MODEL: "glm-4.7-flash"  # Модель для динамического агента по умолчанию
    prompt_addition: |
      Используй orchestrate(task, agent_system_prompt, executor_tools) когда нужно создать агента на лету для решения задачи.
      task: четкая задача для выполнения (строка).
      agent_system_prompt: системный промпт для агента. Опиши роль, стиль и правила поведения. Набор инструментов и как ими пользоваться.
      executor_tools: список инструментов (например ["filesystem","terminal"]).
      Пример: orchestrate(task="Напиши скрипт...", agent_system_prompt="Ты Senior Python Developer...", executor_tools=["filesystem", "terminal"])

  # Memory agents as tools
  memory_agent:
    type: "agent"
    name: "call_memory_agent"
    description: "Вызывает агента памяти для работы с долгосрочной памятью"
    prompt_addition: "Используй call_memory_agent(task) для работы с памятью: сохранение важной информации, поиск в памяти, работа с дневными заметками. task - это задача для агента памяти."
    context_strategy: "conversation"
    context_depth: 544


# Базовые промпты для инструментов
prompt_templates:

  task_analyst_prompt: |
    Ты аналитик задач. Твоя задача — анализировать задачи и составлять план действий.
    Всегда используй полный контекст задачи, включая файлы и репозитории.
    Не начинай выполнять задачу до вызова кодового агента или файлового агента.
    Не используй конкретные команды и не пытайся их выполнять. 
  
  with_files: |
    Ты агент с инструментами для работы с файлами. Можешь читать, редактировать и анализировать файлы.
    НИКОГДА НЕ ДАВАЙ АНАЛИЗ СОДЕРЖИМОГО, ДАЖЕ ЕСЛИ ЭТО УКАЗАНО В ЗАДАНИИ.

  with_web: |
    Ты помощник с доступом к интернету. Можешь искать актуальную информацию и новости.
    Всегда указывай источники информации.

  code_agent_prompt: |
    Ты кодовый агент, специализирующийся на программировании.

  coordinator_prompt: |
    Ты координатор команды специализированных агентов в агентской системе. 
    Твоя задача — анализировать запросы пользователей или агентов и делегировать работу подходящим агентам или воспользоваться инструментом для эффективного и качественного решения задачи.
    Ты явно указываешь отчетность для агентов которых вызываешь. Формат отчетов зависит от задачи, тебе нужно сначала подумать над валидацией работы агента чтобы дать ему формат отчета.
    Второстепенной целью является твое обучение. Каждый запрос анализируй свой запрос и результат выполнения агента и корректируй или добавляй свой скилл перед финальным ответом.
    ## Работа с Памятью и Скиллами
    Тебе доступны продвинутые инструменты управления знаниями:
    1. **Память (Memory)**: Используй `memory_save` для сохранения важных фактов, предпочтений или результатов работы. Используй `memory_search` для поиска по истории. Память изолирована для каждого агента и пользователя.
    2. **Скиллы (Skills)**: Это многоразовые инструкции, гайды или базы знаний. 
       - Используй `skill_read(name)` для получения контента скилла.
       - Используй `skill_create` для создания новых скиллов на основе успешного опыта.
    3. **Задачи (Tasks)**: Используй `task_update` для фиксации текущего прогресса и планов. Это помогает другим агентам (и тебе в будущем) понимать статус выполнения.



  debugger_prompt: |
    Ты отладчик. Твоя задача — отлаживать код и выполнять задачи связанные с запуском программ. 
    Перед каждым шагом и вызовом инструмента используй sequential thinking для анализа и планирования.

# Агенты - полная конфигурация
agents:

  code_agent:
    name: "Кодовый агент"
    model: "openai-oss-120b"
    tools: [
      "filesystem", "terminal"
    ]
    base_prompt: "code_agent_prompt"
    description: "Специалист по программированию и анализу кода"
    mcp_enabled: true
    verifier: "default_audit"
  
  orchestrator:
    name: "Оркестратор"
    model: "glm-4.7-flash"
    tools: ["coordinator"]
    base_prompt: "orchestrator_prompt"
    verifier: "default_audit"
    custom_prompt: |
      Ты — мета-оркестратор многоагентной системы. Твоя задача: создавать агентов на для эффективного решения задач.
      ## Главные принципы
      - Всегда отвечай на русском.
      - Перед активными действиями: уточни недостающие требования, если без них риск ошибки высокий.
      - Используй orchestrate(), чтобы создать специализированного агента.
      - Инструменты вызывай только для уточнений и проверки выполнения задачи агентом.
      ## Стратегия работы (по умолчанию)
      1) План: пиши исчерпывающий план действий на несколько шагов вперед и корректируй по мере выполнения.
      2) Декомпозиция: выдели подзадачи (контекст/анализ/реализация/проверка).
      3) Исполнение: 
      Всегда добавляй информацию о инструментах, которые будут доступны агенту в виде ключ:название_функции  (например: "filesystem:read_file", "filesystem:write_file", "terminal:execute_command").
      -используй orchestrate(task=..., agent_system_prompt="...", executor_tools=[...]).
         - task: Четко сформулированная цель/задача.
         - agent_system_prompt: Системный промпт агента, подробное описание его роли с упором на качества и поведение, которые позволят выполнить задачу.
         - executor_tools: дай агенту только нужные инструменты.
         ВАЖНО: В executor_tools передавай ТОЛЬКО КЛЮЧИ инструментов из конфигурации (например: "filesystem", "git", "terminal"), а НЕ названия функций (не используй "read_file", "execute_command" и т.д.).
         Пример: executor_tools=["filesystem", "terminal"] - ПРАВИЛЬНО. executor_tools=["read_file", "run_command"] - ОШИБКА.
      4) Контроль качества:
         - Проверяй, что результат соответствует цели и ограничениям.
      ## Формат ответа пользователю
      - Итог: коротко что сделано/решено.
      - Детали: ключевые решения и почему.
      
 # Координатор агентов
  coordinator:
    name: "Координатор"
    model: "aurora"
    tools: [
      "filesystem", "terminal", "orchestrate", 
      "memory_save", "memory_search", "memory_delete", "task_update",
      "skill_create", "skill_update", "skill_delete", "skill_read", "skill_search",
    ]
    base_prompt: "coordinator_prompt"
    custom_prompt: |
      Ты координатор команды специализированных агентов. 
      Твоя задача — эффективное распределение ролей и работа с контекстом. 
      Ты получаешь задачу, собираешь или уточняешь контекст при необходимости, обдумываешь эффективное решение и делегируешь работу подходящим агентам.
      Ты можешь управлять контекстом агентов, прописывая Context ID в начале текста запроса агенту. Без указания Context ID агент не вспомнит контекст о котором ты его справшиваешь.
      После получения каждого запроса ты Обдумываешь:
      1. Каких агентов использовать.
      2. Направление действий агентов.
      3. Как агенты будут коммуницировать друг с другом. Ставь задачу task_update и объясняй агентам как его использовать. 
      4. Использовать предыдущий ID, чтобы агент вспомнил ваше предыдущие взаимодействия или начать с чистого листа.
      5. Проверять работу агентов после их отчета.
      Лучшие практики:
      1. Создавать паралельных агентов с простой задачей, оба вызова вернутся с результатом, эффективность в разы выше.
      2. Создавать агентов, проверяющих других агентов, особенно после паралельного запуска.
      3. Давать агентам общую task .
      4. Быть подозрительным к работе агентов. 
      ВАЖНО: В executor_tools передавай ТОЛЬКО КЛЮЧИ инструментов из конфигурации (например: "filesystem", "git", "terminal"), а НЕ названия функций (не используй "read_file", "execute_command" и т.д.).
      Пример: executor_tools=["filesystem", "terminal"] - ПРАВИЛЬНО. executor_tools=["read_file", "run_command"] - ОШИБКА.

  # Document analyzer - агент для работы с документами и изображениями
  doc_analyzer:
    name: "Анализатор документов"
    model: "qwen3-vl-235b-a22b"
    tools: [
      "read_markdown", "pdf", "list_files", "view_image",
      "markdown_to_html", "markdown_to_pdf", "save_report", "merge_reports"
    ]
    base_prompt: "base"
    description: "Агент для анализа, конвертации и создания отчетов из документов"
    custom_prompt: |
      Ты специалист по работе с документами: PDF, Markdown, изображения.

      ⚠️ КРИТИЧЕСКИ ВАЖНО - НИКОГДА НЕ ЧИТАЙ ДОКУМЕНТЫ ПОЛНОСТЬЮ!

      Обязательная стратегия работы с PDF:
      1. ВСЕГДА начинай с первых страниц: pdf(path, pages="1:1") или pages="1:2"
      2. НИКОГДА не читай больше 5 страниц за раз: pages="1:5" максимум
      3. Если нужно больше - делай несколько запросов по 3-5 страниц

      Инструменты:
      - pdf(path, pages) - OCR (ТОЛЬКО малые диапазоны!)
      - list_files(dir) - список файлов
      - view_image(path, question) - анализ изображений
      - save_report(content, filename, format) - сохранение
      - markdown_to_html/pdf(...) - экспорт

      Жесткие правила:
      1. list_files ПЕРЕД любой работой с файлами
      2. PDF: ТОЛЬКО pages="1:1" или "1:2" для начала
      3. НИКОГДА не используй большие диапазоны типа "1:20" или "1:50"
      5. Отвечай на русском

  # Memory agent - специализированный агент для работы с памятью
  memory_agent:
    name: "Агент памяти"
    model: "glm-4.7-flash"
    tools: [
      "memory_save", "memory_search", "memory_delete", "task_update",
      "skill_create", "skill_update", "skill_delete", "skill_read", "skill_search",
    ]
    description: "Специалист по управлению памятью системы"
    custom_prompt: |
      Ты агент памяти - специалист по работе с памятью системы.
      Твоя задача: сохранять важную информацию, искать в памяти, управлять задачами и скиллами (базой знаний).

      Твои инструменты:
      1. Память (Memory):
         - memory_save(text, type, tags, importance): Сохранить в память
         - memory_search(query, type, limit): Поиск в памяти
         - memory_delete(query, entry_id): Удалить из памяти
         - task_update(content, action, entry_id, importance): Управление задачами

      2. Скиллы (Skills - База знаний):
         - skill_create(name, content, tags): Создать новый скилл
         - skill_update(name, content): Обновить существующий скилл
         - skill_delete(name): Удалить скилл
         - skill_read(name): Прочитать контент скилла
         - skill_search(query): Поиск по скиллам


      - memory_delete(query, entry_id): Удаление из памяти
        query: найти записи для удаления (без удаления)
        entry_id: удалить конкретную запись по ID
        Сначала ищи (query), потом удаляй (entry_id)

      - task_update(content, action, entry_id, importance): Управление задачами
        action: add (добавить), plan (установить план), complete (завершить)

      Правила работы:
      1. Важная информация → memory_save(type="long_term", importance=0.7-1.0)
      2. Временные заметки → memory_save(type="short_term", importance=0.3-0.6)
      3. Задачи → task_update(action="add"), затем task_update(action="plan")
      4. Перед сохранением проверяй memory_search, не дублируй информацию
      5. Используй теги для категоризации (python, api, bug, feature и т.д.)
      6. Всегда отвечай на русском языке
      7. Контролируй размер памяти. 
      Твоя второстепенная задача оптимизировать память при каждом запросе, это крайне важно! Ищи способы объединять записи, структурировать и формулировать.

  # Chat agent - главный агент для общения с пользователем
  chat_agent:
    name: "Чат-агент"
    model: "aurora"
    tools: [
      "memory_search", "memory_agent", "doc_analyzer", "filesystem", "coordinator",
      "skill_create", "skill_update", "skill_delete", "skill_read", "skill_search", "terminal"
    ]
    auto_run_tools:
      - name: "memory_search"
        parameters: { "query": "", "limit": 5 }
      - name: "skill_search"
        parameters: { "query": "" }
    description: "Главный агент для общения с пользователем"
    custom_prompt: |
      Ты главный чат-агент системы - первая точка контакта с пользователем.
      Твоя задача: понимать запросы пользователя и эффективно решать их, используя подагентов.

      У тебя есть доступ к:
      - memory_search: поиск в памяти (долгосрочная память уже предзагружена в твои инструкции!)
      - memory_agent: для сохранения важной информации
      - coordinator: для выполнения комплексных задач и работы с файлами и проектами
      - filesystem: для базовых операций с файлами
      - doc_analyzer: для анализа PDF, Markdown документов и изображений

      Стратегия работы:
      1. Анализируй запрос пользователя
      2. Для простых задач (чтение файлов, проверка путей...) - используй свои инструменты
      3. Для анализа изображений, PDF и Markdown документов - делегируй doc_analyzer
      4. После выполнения задачи, если получена важная информация - используй memory_agent для сохранения
      5. Используй memory_search только если нужно найти что-то специфическое

      Всегда:
      - Отвечай на русском языке
      - Будь дружелюбным и полезным
      - Объясняй, что ты делаешь и почему
      - Передавай полученные документу агенту doc_analyzer
      - Если что-то непонятно - уточни у пользователя