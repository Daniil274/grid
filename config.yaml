  file_edit_patch:
    type: function
    description: Редактирует файл с помощью патча в формате unified diff.
  file_list:
    type: function
    description: Список файлов в директории (без дерева).
  get_file_info:
    type: function
    description: Информация о файле.
  file_info:
    type: function
    description: Информация о файле (размер, строки, расширение).
  list_files:
