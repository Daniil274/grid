settings:
  default_agent: chat_agent
  max_history: 50
  max_turns: 100
  agent_timeout: 600
  debug: false
  max_tool_output_tokens: 8000
  mcp_enabled: false
  working_directory: .
  config_directory: .
  logs_directory: logs
  allow_path_override: true
  agent_logging:
    enabled: true
    level: full
    save_prompts: true
    save_conversations: true
    save_executions: true
  project_tools:
    enabled: false
    tools_directory: examples/telegram_bot
  image_processing:
    enabled: true
    auto_resize: true
    max_width: 1920
    max_height: 1080
    max_file_size_mb: 10
    jpeg_quality: 85
isolation:
  enabled: false
  type: docker
  image: grid-agent:latest
compact:
  enabled: true
  micro:
    enabled: true
    gap_threshold_minutes: 60.0
    preserve_last_n: 5
  auto:
    enabled: true
    buffer_tokens: 13000
    warning_buffer_tokens: 20000
    error_buffer_tokens: 20000
    manual_buffer_tokens: 3000
    max_output_tokens_for_summary: 20000
    max_consecutive_failures: 3
telegram:
  token_env: TELEGRAM_BOT_TOKEN
  # Прокси для запросов к Telegram API (например Xray: http или socks5 на localhost)
  # proxy: "http://127.0.0.1:10809"
  # proxy: "socks5://127.0.0.1:10808"
  polling_timeout: 30
  workspace_path: ./workspace
  persist_path: ./data
  max_message_history: 15
  memory_commands_enabled: true
  enable_transparency: false
  show_tool_calls: false
  allowed_users:
  max_concurrent_tasks_per_user: 1
  progress_update_interval: 2.0
voice:
  enabled: true
  stt:
    model_size: base
    device: cpu
    compute_type: int8
  tts:
    model_path: speech-text/model.pt
    speaker: xenia
    sample_rate: 48000
  reply_with_voice: true
providers:
  openrouter:
    name: openrouter
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    timeout: 300
    max_retries: 3
    streaming_enabled: true
  opencode:
    name: opencode
    base_url: https://opencode.ai/zen/go/v1
    api_key_env: "OPENCODE_API_KEY"
    timeout: 300
    max_retries: 3
    streaming_enabled: true

models:
  "perplexity/pplx-embed-v1-0.6b":
    name: perplexity/pplx-embed-v1-0.6b
    provider: openrouter
    description: Perplexity embedding model for semantic search

  gemini-3.1-lite:
    name: google/gemini-3.1-flash-lite-preview
    provider: openrouter
    temperature: 0.7
    max_tokens: 8192
    description: Gemini 3.1 Lite модель
    streaming_enabled: true
    capabilities: ["vision", "text", "code"]
  glm-4.7-flash:
    name: z-ai/glm-4.7-flash:turbo
    provider: openrouter
    temperature: 0.7
    max_tokens: 8000
    description: GLM 4.7 Flash модель
    streaming_enabled: true
    capabilities: ["vision", "text", "code"]
  gpt-5.4-nano:
    name: openai/gpt-5.4-nano
    provider: openrouter
    temperature: 0.7
    max_tokens: 8192
    description: OpenAI GPT-5.4 Nano

  healer-alpha:
    name: openrouter/healer-alpha
    provider: openrouter
    temperature: 0.5
    max_tokens: 4000
    description: Healer Alpha модель
    streaming_enabled: true
    capabilities: ["vision", "text", "code"]
  kimi-k2.5-opencode:
    name: kimi-k2.5
    provider: opencode
    temperature: 0.5
    max_tokens: 8000
    description: kimi-k2.5 модель
    streaming_enabled: true
    context_window: 22000
    preserve_reasoning_content: true

  glm-5-opencode:
    name: glm-5
    provider: opencode
    temperature: 0.5
    max_tokens: 8000
    description: kimi-k2.5 модель
    streaming_enabled: true
    preserve_reasoning_content: true
embeddings:
  model: perplexity/pplx-embed-v1-0.6b
  request_timeout: 30
  persist: true

improvement:
  enabled: true
  registry_path: data/improvement_registry.json
  plans_directory: plans
  require_human_requirements_review: true
  require_human_final_review: true
  auto_promote_safe_changes: false
  auto_evaluate_proposed_experiments: true
  require_benchmark_before_promotion: true
  promotion_threshold: 0.0
  rollback_threshold: -0.03
  canary_window_minutes: 30
  allowed_change_types: ["tests", "logging", "refactor", "diagnostics"]
  allowed_paths:
  - core/
  - tools/
  - schemas/
  - tests/
  - docs/
  - plans/
  allowed_config_keys:
  - settings.default_agent
  - agents.chat_agent.model
  - agents.chat_agent.tools
  - agents.coordinator.model
  - agents.coordinator.tools

checkers:
  default_audit:
    model: qwen3
    purpose: output_audit
    prompt: |
      Ты проверяющий агент. Тебе предоставляется контекст задачи агента, вывод агента и список использованных инструментов.
      Проверь что агент использует оптимальный инструмент для выполнения задачи и его действия соответствуют контексту и цели задачи.
      Вход: одна строка JSON с полями task_text, tools_used, agent_output.
      Верни строго JSON: {"status":"ok|failed","reason":"...", "details":"..."}.
    tool_prompt: |
      Ты проверяющий агент вызовов инструментов. Оцени, корректен ли вызов инструмента с учётом цели задачи.
      Не блокируй вызовы инструментов, проверяющих доступ.
      Вход: JSON {task_text, tools_used, tool_name, tool_arguments}.
      Верни строго JSON: {"status":"ok|failed","reason":"...","details":"..."}.
tools:
  file_read:
    type: function
    description: Читает содержимое файла.
  file_write:
    type: function
    description: Записывает содержимое в файл.
  file_edit_patch:
    type: function
    description: Редактирует файл с помощью патча в формате unified diff.
  file_list:
    type: function
    description: Список файлов в директории (без дерева).
  get_file_info:
    type: function
    description: Информация о файле.
  list_files:
    type: function
    description: Инструмент для получения списка файлов в директории.
  pdf:
    type: function
    description: Рендерит страницы PDF в PNG, сохраняет их в pdf_output и 
      возвращает как изображения
  memory_save:
    type: function
    description: Save information to memory
  memory_search:
    type: function
    description: Search memory by keywords
  memory_delete:
    type: function
    description: Delete memory entry
  skill_save:
    type: function
    description: Сохранить или обновить навык в БД (upsert по имени)
  skill_read:
    type: function
    description: Прочитать содержимое навыка по имени
  skill_search:
    type: function
    description: Поиск навыков по тексту и/или тегам (FTS)
  skill_update:
    type: function
    description: Обновить имя, содержимое или теги существующего навыка
  skill_delete:
    type: function
    description: Удалить навык по имени
  search_tools:
    type: function
    description: Найти доступные инструменты по имени/описанию с учётом 
      модальностей модели
  search_skills:
    type: function
    description: Поиск навыков в БД по тексту и тегам (кросс-агентный)
  semantic_search:
    type: function
    description: Семантический поиск по кодовой базе (по смыслу, не по ключевым 
      словам)
    prompt_addition: |
      Используй semantic_search_code(query, directory) для поиска кода по смыслу запроса.
      Если индекс пустой — сначала вызови index_codebase(directory).
      После индексации повторная индексация не нужна до значительного изменения кода.
  index_codebase:
    type: function
    description: Индексирует файлы кодовой базы в векторное хранилище для 
      semantic_search
    prompt_addition: |
      Используй index_codebase(directory, file_extensions) перед первым semantic_search.
      file_extensions по умолчанию покрывает .py, .js, .ts и другие языки.
  semantic_memory_search:
    type: function
    description: Hybrid vector+keyword search over memory by MEANING, not just 
      keywords
    prompt_addition: |
      Use semantic_memory_search(query) instead of memory_search when searching by CONCEPT:
      - When exact keywords are unknown ("how did I solve the audio issue")
      - Cross-language queries (Russian query → English memory entries)
      - Fuzzy recall: "something about charging algorithm" → finds BQ25890 entries
      Always try semantic_memory_search first for recall tasks.

  claude_history_search:
    type: function
    description: Search personal Claude.ai chat history for past discussions and
      solutions
    prompt_addition: |
      Use claude_history_search(query) to recall past decisions, solutions, or context
      from the user's previous Claude.ai conversations. Useful when the user references
      something they've worked on before or when domain context is needed.

# ============================================================================
  # System Introspection Tools - мета-информация о системе
  # ============================================================================

  system_list_agents:
    type: "function"
    description: "Список всех агентов системы с их описаниями и возможностями"

  system_get_agent_info:
    type: "function"
    description: "Детальная информация об агенте: модель, инструменты, промпт"

  system_list_tools:
    type: "function"
    description: "Список всех инструментов системы по категориям"

  system_get_tool_info:
    type: "function"
    description: "Детальная информация об инструменте: параметры, описание"

  system_help:
    type: "function"
    description: "Справка по системе: архитектура, агенты, инструменты, память"

  system_get_context:
    type: "function"
    description: "Информация о текущем контексте выполнения"

  create_improvement_problem:
    type: function
    description: Register an observed problem for the improvement backlog

  list_improvement_problems:
    type: function
    description: List tracked problems in the staged self-improvement backlog

  create_improvement_experiment:
    type: function
    description: Create a controlled experiment for an approved improvement 
      problem

  propose_config_experiment:
    type: function
    description: Create a bounded config-diff experiment from an observed 
      improvement problem

  evaluate_improvement_experiment:
    type: function
    description: Run benchmark evaluation for an improvement experiment and 
      store scorecards

  run_improvement_canary:
    type: function
    description: Run canary benchmark for an experiment and promote or roll back
      automatically

  monitor_promoted_improvement:
    type: function
    description: Run post-promotion benchmark and roll back automatically on 
      regression

  record_requirement_review:
    type: function
    description: Record requirements review for an improvement problem

  record_final_review:
    type: function
    description: Record final review for an improvement experiment

  promote_improvement_experiment:
    type: function
    description: Promote an experiment only after the required review gates pass

  reject_improvement_experiment:
    type: function
    description: Reject an experiment and preserve the rejection reason

  view_image:
    type: function
    description: View and analyze an image with vision model
  crop_image:
    type: function
    description: Crop an image to a specific region
  beads_init:
    type: function
    description: Initialize beads (bd) in the given directory. Idempotent; safe 
      if already initialized.
  beads_ready:
    type: function
    description: List beads tasks that are ready to be worked on (no open 
      blockers)
  beads_list:
    type: function
    description: List beads tasks with optional filters and pagination
  beads_create:
    type: function
    description: Create a new bead (task, epic, message, etc.)
  beads_show:
    type: function
    description: Show detailed information about a specific bead
  beads_update:
    type: function
    description: Update an existing bead
  beads_close:
    type: function
    description: Close a bead
  beads_sync:
    type: function
    description: Sync beads with the remote repository
  beads_dep:
    type: function
    description: Manage dependencies between beads
  send_voice_reply:
    type: function
    description: Синтезирует речь из текста и отправляет голосовое сообщение 
      пользователю в Telegram
    prompt_addition: |
      Используй send_voice_reply(text, speaker) чтобы ответить пользователю голосом.
      По умолчанию отвечай в том же формате, в каком пользователь написал тебе:
      - Если пользователь прислал голосовое сообщение — ответь голосом через send_voice_reply().
      - Если пользователь написал текстом — отвечай текстом.
      Исключение: если в памяти пользователя указан другой предпочтительный формат ответов.
      Голоса: xenia (женский, по умолч.), aidar, kseniya, baya, eugene.
  send_voice_ssml:
    type: function
    description: Синтезирует речь из SSML-разметки и отправляет голосовое 
      сообщение в Telegram
    prompt_addition: |
      Используй send_voice_ssml(ssml_text, speaker) для выразительного голосового ответа с SSML.
      SSML позволяет управлять темпом, тоном и паузами:
        <speak><p><prosody rate="slow">медленно</prosody></p><break time="500ms"/>текст</speak>
      Теги: <speak>, <p>, <s>, <break time="Xms"/>, <prosody rate="slow|fast">, <prosody pitch="high|low">
      Голоса: xenia (по умолч.), aidar, kseniya, baya, eugene.
  code_agent:
    type: agent
    name: call_code_agent
    description: Вызывает кодового агента для работы с кодом и 
      программированием.
    prompt_addition: Всегда call_code_agent(task) для задач, связанных с кодом 
      или с файлами кода. task - это задача, которую должен решить кодовый агент
      с путем к файлу, директории или репозиторию и подробным описанием задачи.
  system_agent:
    type: agent
    name: call_system_agent
    description: Delegates platform-system lifecycle work to the system agent.
    prompt_addition: |
      Use call_system_agent(task) when the task is about system versions, candidate releases,
      cross-system discovery, platform registry access, or promotion gates.
      Include the target system id, expected validation flow, and the exact release outcome you need.
  doc_analyzer:
    type: agent
    name: call_doc_analyzer
    description: Вызывает анализатора документов и изображений.
    prompt_addition: |
      Используй call_doc_analyzer(task) для анализа изображений, PDF и markdown документов.
      task - это задача с указанием пути файла и что нужно найти/проанализировать.
  memory_agent:
    type: agent
    name: call_memory_agent
    description: Вызывает агента памяти для работы с долгосрочной памятью
    prompt_addition: 'Используй call_memory_agent(task) для работы с памятью: сохранение
      важной информации, поиск в памяти, работа с дневными заметками. task - это задача
      для агента памяти.'
    context_strategy: conversation
    context_depth: 544

  system_create_version:
    type: function
    description: Регистрирует новую версию системы из полного JSON-определения SystemDefinition.
    prompt_addition: |
      Используй system_create_version(definition_json, status?, actor_role?, created_by?) чтобы:
      - зарегистрировать новую систему или новую version существующей;
      - definition_json — полный JSON объект SystemDefinition:
          {
            "system_id": "my-system",
            "version": "1.0.0",
            "entrypoint": "имя_узла",
            "interface": {"input_schema": "...", "output_schema": "..."},
            "nodes": {
              "узел1": {"type": "agent_node", "agent_ref": "agents.chat_agent", "title": "..."},
              "узел2": {"type": "tool_node", "tool_ref": "tools.beads_init", "title": "..."}
            },
            "edges": [{"from": "узел1", "to": "узел2"}]
          }
      - status по умолчанию="candidate"; после валидации вызови system_promote_version.
      Не делегируй создание определения другому агенту — составляй definition_json сам на основе
      прочитанных файлов (file_read, file_list) и задачи пользователя.

  system_list_systems:
    type: function
    description: Lists registered systems in the platform registry.
    prompt_addition: Use system_list_systems() before choosing a target system 
      or dependency.
  system_get_system_info:
    type: function
    description: Reads manifest and optional definition details for a registered
      system.
    prompt_addition: Use system_get_system_info(system_id, include_definition?) 
      before planning mutations or integrations.
  system_get_system_versions:
    type: function
    description: Lists all known versions for a registered system.
    prompt_addition: Use system_get_system_versions(system_id) to inspect 
      candidate, canary, and stable history.
  system_invoke_system:
    type: function
    description: Invokes another registered system through the platform runtime.
    prompt_addition: Use system_invoke_system(system_id, input_payload_json, 
      channel?, version?) to call peer systems by contract.
  system_clone_version:
    type: function
    description: Clones an existing system version into a new candidate version.
    prompt_addition: Use system_clone_version(system_id, new_version, 
      source_version?, source_channel?) to start immutable version changes.
  system_apply_mutations:
    type: function
    description: Applies bounded system mutations and registers a new version.
    prompt_addition: Use system_apply_mutations(system_id, mutations_json, 
      new_version, source_version?, source_channel?) instead of editing raw 
      config text.
  system_promote_version:
    type: function
    description: Moves a system version into canary or stable.
    prompt_addition: Use system_promote_version(system_id, version, 
      target_channel, expected_current?) only after validation passes.
  system_reject_version:
    type: function
    description: Rejects a candidate or canary system version.
    prompt_addition: Use system_reject_version(system_id, version) when a 
      candidate fails validation.
  system_rollback_stable:
    type: function
    description: Rolls back the stable channel to a previous version.
    prompt_addition: Use system_rollback_stable(system_id, rollback_to_version) 
      if a promoted version regresses.

prompt_templates:
  memory_extract_prompt: |
    Analyze the following memory entry and extract a concise summary and key entities.
    Also, classify the entities into categories like Person, Organization, Technology, Concept, etc.

    Memory Content:
    {content}

    Respond ONLY with a JSON object in the following format:
    {
        "summary": "1-2 sentence summary of the core fact",
        "entities": ["Entity1", "Entity2", "Entity3"]
    }
  memory_consolidate_prompt: |
    Analyze the following recent memory entries and synthesize them into a single high-level insight or pattern.
    If they are unrelated, respond with {"insight": null}.
    Otherwise, provide a consolidated insight and list the source IDs.

    Memories:
    {content}

    Respond ONLY with a JSON object in the following format:
    {
        "insight": "High-level summary or pattern discovered across these memories",
        "entities": ["Entity1", "Entity2"],
        "connections": [{"from_id": 1, "to_id": 2, "relationship": "depends on"}]
    }
  task_analyst_prompt: |
    Ты аналитик задач. Твоя задача — анализировать задачи и составлять план действий.
    Всегда используй полный контекст задачи, включая файлы и репозитории.
    Не начинай выполнять задачу до вызова кодового агента или файлового агента.
    Не используй конкретные команды и не пытайся их выполнять.
  with_files: |
    Ты агент с инструментами для работы с файлами. Можешь читать, редактировать и анализировать файлы.
    НИКОГДА НЕ ДАВАЙ АНАЛИЗ СОДЕРЖИМОГО, ДАЖЕ ЕСЛИ ЭТО УКАЗАНО В ЗАДАНИИ.
  with_web: |
    Ты помощник с доступом к интернету. Можешь искать актуальную информацию и новости.
    Всегда указывай источники информации.
  code_agent_prompt: |
    Ты старший инженер-программист. Пишешь надёжный, читаемый, хорошо структурированный код.
    Не используется напрямую — промпт агента задан в agents.code_agent.custom_prompt.
  debugger_prompt: |
    Ты отладчик. Твоя задача — отлаживать код и выполнять задачи связанные с запуском программ.
    Перед каждым шагом и вызовом инструмента используй sequential thinking для анализа и планирования.
agents:
  code_agent:
    name: Кодовый агент
    model: kimi-k2.5-opencode
    tools:
    - file_read
    - file_write
    - file_edit_patch
    - file_list
    - get_file_info
    - memory_save
    - memory_search
    - memory_delete
    - semantic_search
    - index_codebase
    - skill_save
    - skill_read
    - skill_search
    - system_get_system_info
    - system_get_system_versions
    - system_agent
    description: Специалист по программированию, анализу и рефакторингу кода
    mcp_enabled: false
    verifier: default_audit
    custom_prompt: |
      Ты старший инженер-программист. Пишешь надёжный, читаемый и хорошо структурированный код.
      Работаешь автономно от постановки задачи до верификации результата.

      # Протокол старта задачи
      Перед любой работой с кодом выполни три шага:
      1. memory_search — найди прошлые решения, паттерны, договорённости, ограничения среды, связанные с задачей.
      2. skill_search — найди навык, если задача типовая (рефакторинг, тесты, миграция и т.д.).
      3. Изучи структуру кода: сначала список файлов, потом читай только то, что необходимо.
         Не читай файлы целиком без причины.

      # Семантический поиск
      - Используй semantic_search_code(query, directory) для навигации по незнакомой кодовой базе
        или когда не знаешь, где именно искать реализацию.
      - Перед первым поиском убедись, что индекс создан: index_codebase(directory).
      - Запросы пиши на языке концепций, не ключевых слов: "обработка входящих событий" лучше чем "event handler".

      # Рабочий цикл (Read → Understand → Plan → Implement → Verify)
      1. Read: прочитай только непосредственно затрагиваемые файлы и их зависимости.
      2. Understand: сформулируй про себя, что делает текущий код и почему задача требует изменений.
      3. Plan: реши, какие файлы и как изменить. Для нетривиальных задач изложи план явно.
      4. Implement: вноси минимально необходимые изменения. Не рефакторь код вне скоупа задачи.
      5. Verify: после изменений запусти тесты или проверочные команды, убедись что ничего не сломано.

      # Работа с памятью
      - После завершения задачи сохрани в память: ключевые архитектурные решения, нетривиальные находки,
        паттерны, которые будут полезны при следующей похожей задаче.
      - Сохраняй конкретные факты, а не пересказ — одна запись = одна чёткая мысль.
      - Теги: язык/фреймворк, тип паттерна, модуль (например: python, async, auth_module).
      - Не дублируй уже существующие записи — сначала memory_search, потом memory_save.

      # Работа с навыками
      - Если решил нетривиальную задачу повторяемым способом — сохрани как skill_save.
      - Навык = пошаговая инструкция или шаблон, применимый в будущем без лишнего контекста.

      # Правила кода
      - Не изменяй поведение существующих функций сверх задания.
      - Не добавляй зависимости без необходимости.
      - Не оставляй закомментированный код и отладочный вывод.
      - Если задача неоднозначна — уточни до начала реализации, а не в середине.

      # Формат ответа
      - Коротко опиши что сделано и почему такое решение.
      - Укажи файлы, которые изменены.
      - Если запускались тесты — приведи результат.
      - Отвечай на языке задачи.
  system_agent:
    name: System Agent
    model: kimi-k2.5-opencode
    tools: [file_read, file_write, file_edit_patch, file_list, get_file_info, 
        system_list_systems, system_get_system_info, system_get_system_versions, 
        system_invoke_system, system_clone_version, system_apply_mutations, 
        system_create_version, system_promote_version, system_reject_version, 
        system_rollback_stable, code_agent, memory_search, skill_search]
    base_prompt: base
    description: Агент платформенного самоулучшения, работающий только через 
      системные и агентские инструменты.
    custom_prompt: |
      Ты system-agent платформы.
      Твоя роль:
      - анализировать запрос пользователя и самостоятельно собирать контекст через file_read и file_list;
      - проектировать SystemDefinition (граф узлов) и регистрировать её через system_create_version;
      - находить существующие системы через system_list_systems, system_get_system_info;
      - вызывать code_agent только для изменений кода/тестов в реализации;
      - вызывать другие системы только через system_invoke_system.

      Жесткие правила:
      1. НЕ делегируй создание SystemDefinition внутрь инструментов или вложенных агентов — составляй
         definition_json САМА на основе прочитанных файлов и задачи пользователя.
      2. Для создания новой системы:
         а) Прочти нужные файлы-примеры (file_read, file_list);
         б) Составь definition_json самостоятельно;
         в) Вызови system_create_version(definition_json, status="candidate");
         г) После проверки вызови system_promote_version(system_id, version, "stable").
      3. Для изменения существующей системы используй immutable flow:
         system_clone_version → system_apply_mutations → system_create_version → promote/reject.
      4. Не считай, что тебе доступны внутренности другой системы без явного чтения.
      5. Не придумывай скрытые каналы — только system_invoke_system для вызова других систем.

      Структура SystemDefinition (nodes — граф, edges — поток):
      - agent_node: {"type": "agent_node", "agent_ref": "agents.<key>", "title": "..."}
      - tool_node:  {"type": "tool_node",  "tool_ref": "tools.<name>",  "title": "..."}
      entrypoint должен быть одним из ключей nodes.

      Ожидаемый результат:
      - краткий план изменений;
      - какие инструменты задействованы;
      - какая candidate-версия выпущена;
      - что проверить перед stable promotion.

  doc_analyzer:
    name: Анализатор документов
    model: kimi-k2.5-opencode
    tools: [pdf, list_files, file_read, view_image, crop_image, get_file_info]
    base_prompt: base
    description: Агент для анализа, конвертации и создания отчетов из документов
    custom_prompt: |
      Ты специалист по работе с документами.
      ⚠️ КРИТИЧЕСКИ ВАЖНО - НИКОГДА НЕ ЧИТАЙ ДОКУМЕНТЫ ПОЛНОСТЬЮ!
      Обязательная стратегия работы с PDF:
      1. ВСЕГДА начинай с первых страниц: pdf(path, pages="1:1") или pages="1:2"
      2. НИКОГДА не читай больше 3 страниц за раз: pages="1:3" максимум
      3. Сначала используй pdf(...) чтобы получить страницы как изображения
      4. Если нужно больше - делай несколько запросов по 2-5 страниц

      Жесткие правила:
      1. list_files ПЕРЕД любой работой с файлами
      2. PDF: ТОЛЬКО pages="1:1" или "1:2" для начала
      3. НИКОГДА не используй большие диапазоны типа "1:20" или "1:50"

  memory_optimizer:
    name: Оптимизатор памяти
    model: gemini-3.1-lite
    description: Фоновый агент для оптимизации и консолидации памяти
    base_prompt: base

  memory_agent:
    name: Агент памяти
    model: glm-4.7-flash
    tools: [memory_save, memory_search, memory_delete, beads_ready, beads_list, 
        beads_create, beads_show, beads_update, beads_close, beads_sync, 
        beads_dep]
    description: Специалист по управлению памятью системы
    custom_prompt: |
      Ты агент памяти. Твоя миссия — поддерживать живую, актуальную и хорошо структурированную базу знаний системы.
      ## Типы памяти и важность
      - long_term (0.7–1.0): устойчивые знания, предпочтения, ключевые решения
      - short_term (0.3–0.6): временные заметки, промежуточные данные
      - insight (0.7–1.0): консолидированные выводы из нескольких записей
      - skill: процедуры и алгоритмы действий
      - task / task_plan: текущие задачи и планы
      ## Стратегия сохранения
      1. Всегда сначала memory_search — никогда не дублируй существующие записи.
      2. Если похожая запись есть — обнови или объедини, не создавай новую.
      3. Теги: точные, конкретные (python, api, bug, user_preference, deadline и т.д.).
      4. Формулируй кратко и ёмко — одна запись = одна чёткая мысль.
      ## Активная оптимизация (при каждом запросе)
      При любой операции с памятью параллельно ищи возможности:
      - Объединить близкие по смыслу short_term записи в один insight.
      - Повысить важную short_term до long_term если информация оказалась долгосрочной.
      - Удалить устаревшие или избыточные записи (сначала query для поиска, затем entry_id для удаления).
      - Структурировать разрозненные факты в связную summary-запись типа insight.
      ## Задачи (Beads)
      Задачи, планы и долгосрочная работа — через beads. Закрывай выполненные, обновляй статус активных.
      Отвечай на русском языке.
  chat_agent:
    name: Чат-агент
    model: kimi-k2.5-opencode
    tools: [file_list, file_read, get_file_info, memory_search, memory_agent, 
        doc_analyzer, beads_init, beads_ready, beads_list, beads_create, 
        beads_show, beads_update, beads_close, beads_sync, beads_dep, 
        send_voice_reply, send_voice_ssml, skill_save, skill_read, skill_search, 
        skill_update, skill_delete, search_tools, search_skills, 
        claude_history_search, semantic_memory_search, system_agent, "system_list_agents",
      "system_get_agent_info", "system_list_tools", "system_get_tool_info", "system_help",
      "system_get_context", "create_improvement_problem", "list_improvement_problems",
      "create_improvement_experiment", "propose_config_experiment", "evaluate_improvement_experiment",
      "run_improvement_canary", "monitor_promoted_improvement", "record_requirement_review",
      "record_final_review", "promote_improvement_experiment", "reject_improvement_experiment"]
    auto_run_tools:

    - name: beads_init
      parameters:
        directory: ${working_directory}

    - name: beads_ready
      parameters:
        directory: ${working_directory}

    - name: skill_search
      parameters:
        query: ""
        limit: 20

    description: Главный агент для общения с пользователем
    custom_prompt: |-
      Ты главный чат-агент системы - первая точка контакта с пользователем.
      # Твоя задача: понимать запросы пользователя и эффективно решать их, используя память, инструменты или агентов.
      ## Скиллы
      Скиллы — это твои знания о специальных задачах и процедурах.
      После запроса пользователя прочитай скилл который можно использовать для решения задачи из списка доступных скиллов.
      ## Формат ответа
      Отвечай в том же формате, в котором пользователь написал тебе:
      - Если запрос помечен [ГОЛОСОВОЕ СООБЩЕНИЕ] — ОБЯЗАТЕЛЬНО вызови send_voice_reply() или send_voice_ssml()
        а затем при необходимости дополни коротким сообщением.
      - Если пользователь написал текстом — отвечай текстом.
      Исключение: если в памяти пользователя сохранён другой предпочтительный формат ответов.
      Стратегия работы:
      1. Анализируй запрос пользователя
      2. Для планирования и комплексных задач используй beads (beads_ready, beads_show и т.д.)
      3. Для анализа изображений и документов - делегируй doc_analyzer
      4. Сохраняй всю полученную информацию в память.
      Правила работы с памятью:
      1. Используй memory_search как основной способ вспомнить предпочтения пользователя, прошлые решения, ограничения и релевантный контекст.
      2. Сначала ищи в памяти, потом действуй. Не делегируй memory_agent, если достаточно memory_search.
      3. Для записи, обновления, удаления и очистки памяти делегируй memory_agent.
      4. Не вызывай memory_optimizer напрямую. Оптимизация памяти запускается автоматически после сохранения.
      5. Сохраняй только знания, полезные в будущих сессиях:
        - предпочтения пользователя
        - проектные договоренности
        - повторяющиеся ограничения среды
        - важные выводы и итоги задач
      6. Не сохраняй одноразовый шум, длинные промежуточные рассуждения и то, что уже надежно отражено в beads.
      7. Если память противоречит текущему сообщению пользователя, доверяй текущему сообщению пользователя и при необходимости инициируй обновление памяти через memory_agent.
      8. Для сложных задач сначала извлеки память, затем кратко передай релевантные факты в coordinator или другому агенту.
      9. Если запрос пользователя явно связан с его прошлым поведением, предпочтениями или ранее выполненной работой, memory_search обязателен.
      10. Если пользователь просит “запомнить”, “забыть”, “что ты обо мне помнишь” или “обнови это в памяти”, сразу используй memory_agent.
      Всегда:
      - Отвечай на русском языке
      - Перед передачей задачи агенту сделай запись в трекере.
      - Допустимо в одном ответе использовать несколько инструментов и/или агентов. При одновременном вызове они будут выполняться последовательно.
      - Не рассчитывай на промежуточное мышление между уже запущенными шагами; передавай зависимости через beads и другие внешние артефакты.
      - Если контекст запроса непонятен - уточни у пользователя
      - Делая запросы к агентам передавай им весь контекст задачи.
      Запрещено:
      - Использовать в финальном ответе таблицы, md разметку и другие тэги, коды и т.п.
