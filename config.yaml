settings:
  default_agent: chat_agent
  max_history: 50
  max_turns: 100
  agent_timeout: 600
  debug: false
  max_tool_output_tokens: 8000
  mcp_enabled: true
  working_directory: .
  config_directory: .
  logs_directory: D:/Work/repo/agents_portable/logs
  allow_path_override: true
  agent_logging:
    enabled: true
    level: full
    save_prompts: true
    save_conversations: true
    save_executions: true
    tools_common_rules: |
      Всегда выполняй операции с файлами через инструменты и возвращай их результаты.
      Запрещено утверждать создание/изменение файла без вызова инструмента.
  project_tools:
    enabled: true
    tools_directory: examples/telegram_bot
  image_processing:
    enabled: true
    auto_resize: true
    max_width: 1920
    max_height: 1080
    max_file_size_mb: 10
    jpeg_quality: 85
isolation:
  enabled: true
  type: docker
  image: grid-agent:latest
telegram:
  token_env: TELEGRAM_BOT_TOKEN
  # Прокси для запросов к Telegram API (например Xray: http или socks5 на localhost)
  # proxy: "http://127.0.0.1:10809"
  # proxy: "socks5://127.0.0.1:10808"
  polling_timeout: 30
  workspace_path: ./workspace
  persist_path: ./data
  max_message_history: 15
  memory_commands_enabled: true
  enable_transparency: false
  show_tool_calls: false
  allowed_users: null
  max_concurrent_tasks_per_user: 1
  progress_update_interval: 2.0
voice:
  enabled: true
  stt:
    model_size: base
    device: cpu
    compute_type: int8
  tts:
    model_path: speech-text/model.pt
    speaker: xenia
    sample_rate: 48000
  reply_with_voice: true
providers:
  lm-studio:
    name: lm-studio
    base_url: http://192.168.3.2:1234/v1
    api_key: lm-studio
    timeout: 300
    max_retries: 3
  openrouter:
    name: openrouter
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    timeout: 300
    max_retries: 3
    streaming_enabled: true
  anthropic:
    name: anthropic
    base_url: https://api.anthropic.com/v1/
    api_key_env: ANTHROPIC_API_KEY
    timeout: 300
    max_retries: 3
    streaming_enabled: true
  hf:
    name: hf
    base_url: https://router.huggingface.co/v1
    api_key_env: HF_API_KEY
    timeout: 300
    max_retries: 3
    streaming_enabled: true

  github:
    name: github
    base_url: https://models.github.ai/inference
    api_key_env: GH_API_KEY
    timeout: 300
    max_retries: 3
    streaming_enabled: true

