services:
  grid:
    build:
      context: .
    image: grid-agent-system:local
    init: true
    env_file:
      - path: .env
        required: false
    environment:
      SEARXNG_URL: http://searxng:8080
    depends_on:
      searxng:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ${GRID_WORKSPACE:-.}:/workspace
    command:
      - grid-web-chat
      - --routing
      - /app/routing.yaml
      - --path
      - /workspace
      - --host
      - 0.0.0.0
      - --port
      - "8000"

  # Grid evolution workshop: the administrator system on its own clone of the
  # controller's stable branch. Start the controller on the host first:
  #   grid-control serve --repo <evolution.git> --policy <policy.json> --port 8010
  # (Docker Desktop reaches the host's 127.0.0.1 as host.docker.internal; on
  # Linux bind the controller to the docker bridge address instead)
  # then: docker compose --profile evolution up workshop  (UI on :8001)
  workshop:
    profiles: [evolution]
    image: grid-agent-system:local
    init: true
    environment:
      # Only what the administrator needs: no .env, no host files. Missing values
      # stop `grid-workshop init` with a clear error (a required ${VAR:?} here
      # would break every compose command, profiles notwithstanding).
      GRID_CONTROL_URL: ${GRID_CONTROL_URL:-http://host.docker.internal:8010}
      GRID_CONTROL_TOKEN: ${GRID_CONTROL_TOKEN:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      # The administrator's own traces stay outside the clone it commits from.
      GRID_TIMELINE_DB: /workspace/.grid-runtime/timeline.db
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8001:8000"
    volumes:
      - workshop-data:/workspace
    command:
      - sh
      - -c
      - >-
        grid-workshop init /workspace/grid &&
        exec grid-web-chat
        --config /workspace/grid/examples/system-admin/config.yaml
        --path /workspace/grid --host 0.0.0.0 --port 8000

  searxng:
    image: docker.io/searxng/searxng:latest
    restart: unless-stopped
    environment:
      SEARXNG_BASE_URL: http://searxng:8080/
      SEARXNG_REDIS_URL: redis://valkey:6379/0
    volumes:
      - ./searxng/core-config:/etc/searxng:ro
      - searxng-data:/var/cache/searxng
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 12
    depends_on:
      - valkey

  valkey:
    image: docker.io/valkey/valkey:9-alpine
    restart: unless-stopped
    command: ["valkey-server", "--save", "30", "1", "--loglevel", "warning"]
    volumes:
      - valkey-data:/data

volumes:
  searxng-data:
  valkey-data:
  workshop-data:
