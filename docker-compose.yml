services:
  grid:
    build:
      context: .
    image: grid-agent-system:local
    init: true
    env_file:
      - path: .env
        required: false
    environment:
      SEARXNG_URL: http://searxng:8080
    depends_on:
      searxng:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ${GRID_WORKSPACE:-.}:/workspace
    command:
      - grid-web-chat
      - --routing
      - /app/routing.yaml
      - --path
      - /workspace
      - --host
      - 0.0.0.0
      - --port
      - "8000"

  searxng:
    image: docker.io/searxng/searxng:latest
    restart: unless-stopped
    environment:
      SEARXNG_BASE_URL: http://searxng:8080/
      SEARXNG_REDIS_URL: redis://valkey:6379/0
    volumes:
      - ./searxng/core-config:/etc/searxng:ro
      - searxng-data:/var/cache/searxng
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 12
    depends_on:
      - valkey

  valkey:
    image: docker.io/valkey/valkey:9-alpine
    restart: unless-stopped
    command: ["valkey-server", "--save", "30", "1", "--loglevel", "warning"]
    volumes:
      - valkey-data:/data

volumes:
  searxng-data:
  valkey-data:
