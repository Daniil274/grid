name: two-misroutes
kind: fix
notes: >-
  Two independent causes behind one vague complaint: the video and the desktop
  descriptions were both damaged. A fix that stops at the first cause leaves
  half the targets failing.
request: |
  После последних правок часть запросов уходит не в ту систему: жалуются и на
  монтаж видео, и на просьбы что-то сделать на компьютере — всё это теперь
  попадает в engineering. Разберись, что сломано, и почини всё сразу.
sabotage:
  - file: routing.yaml
    find: "git, explore a codebase. Also all internet research"
    replace: "git, explore a codebase. Also video and audio files (mp4, mov, clips): trimming, joining, subtitles, previews and rendering with ffmpeg. Also all internet research"
  - file: routing.yaml
    find: "Working with video files and footage (mp4, mov, clips): inspect footage,\n        detect scenes, annotate, cut and join clips, add subtitles, build cutlists\n        and edit lists, render previews and final versions, and quality-check\n        rendered output."
    replace: "Catalogue of the video team's published renders: list finished videos and their metadata. Not for editing footage: cutting, joining, subtitles and rendering belong to engineering."
  - file: routing.yaml
    find: "Controlling this Windows computer through its GUI like a person: open\n        and use applications, click, type, press hotkeys, switch windows, fill\n        forms in programs. Pick when the task must be done on screen."
    replace: "Recording screencasts and taking screenshots of this Windows computer for documentation. Not for operating programs: opening applications, clicking, typing, switching windows and changing settings belong to engineering."
locus:
  - file: routing.yaml
    yaml_path: routing.systems.video.description
  - file: routing.yaml
    yaml_path: routing.systems.desktop.description
  - file: routing.yaml
    yaml_path: routing.systems.engineering.description
allowed_paths:
  - routing.yaml
  - examples/coder/config.yaml
  - examples/video-editor/config.yaml
  - examples/windows-computer-use/config.yaml
dev:
  - name: dev-join
    message: "Склей clips/intro.mp4 и clips/main.mp4 в один ролик."
    system: video
    timeout_seconds: 90
  - name: dev-notepad
    message: "Открой Блокнот и напечатай в нём список покупок."
    system: desktop
    timeout_seconds: 90
  - name: dev-code
    message: "Почини падающий тест в tests/test_api.py."
    system: engineering
    timeout_seconds: 90
targets:
  - name: t-video-cut
    message: "Вырежи из interview.mov фрагмент с 01:20 до 02:05 и сохрани его отдельным клипом."
    system: video
    timeout_seconds: 90
  - name: t-video-highlights
    message: "Найди в footage/match.mp4 смены сцен и собери короткий ролик из лучших моментов."
    system: video
    timeout_seconds: 90
  - name: t-desktop-settings
    message: "Зайди в параметры Windows и включи тёмную тему."
    system: desktop
    timeout_seconds: 90
  - name: t-desktop-window
    message: "Открой Word и создай в нём новый документ с заголовком «Отчёт за март»."
    system: desktop
    timeout_seconds: 90
guards: [g-code, g-question, g-web, g-pipeline]
