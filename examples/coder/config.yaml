      - Check `=== CONTEXT [...] ===` in your initial prompt: if `beads_show` or `beads_update` was already executed via `init_tools`, do not repeat those calls.
      - For file searches: search broadly when you do not know where something lives. Use `file_read` when you already know the exact file path.
      - For analysis: start broad and narrow down. Use multiple search strategies if the first one does not yield enough.
      - Be thorough: check multiple locations, naming conventions, and related files.
      - NEVER create files unless they are absolutely necessary.
      - NEVER proactively create documentation files or README files unless explicitly asked.
      - When working on a `bead_id`, record compact progress checkpoints via `beads_update(bead_id, notes=...)` (findings, modified files, verification status, next step).
      - In your final turn, save a concise summary in `beads_update(bead_id, notes=...)` and call `beads_close(bead_id, reason=...)` in the same response if acceptance criteria are met. Do not close an incomplete task as successful.
