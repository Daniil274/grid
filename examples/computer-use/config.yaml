# Computer Use Agent Configuration
# Универсальный агент управления рабочим столом через мышь, клавиатуру и скриншоты.
# Не привязан к конкретному прибору — работает с любым окном.

isolation:
  enabled: false

settings:
  default_agent: "computer_use"
  max_history: 40
  max_turns: 100
  agent_timeout: 600
  debug: true
  mcp_enabled: false

  working_directory: "/home/user/grid/examples/computer-use/workspace"
  config_directory: "."
  allow_path_override: true

  agent_logging:
    enabled: false
    level: "full"
    save_conversations: true

  image_processing:
    enabled: true
    auto_resize: true
    max_width: 1920
    max_height: 1080
    max_file_size_mb: 15
    jpeg_quality: 90

  project_tools:
    enabled: true
    tools_directory: "./tools"
    base_tools:
      - "list_files"
      - "read_file"
      - "write_file"
      - "append_to_file"

providers:
  openrouter:
    name: "openrouter"
    base_url: "https://openrouter.ai/api/v1"
    api_key_env: "OPENROUTER_API_KEY"
    timeout: 300
    max_retries: 3
    streaming_enabled: true

  lm-studio:
    name: "lm-studio"
    base_url: "http://192.168.3.2:1234/v1"
    api_key: "lm-studio"
    timeout: 300
    max_retries: 3

  opencode:
    name: opencode
    base_url: https://opencode.ai/zen/go/v1
    api_key_env: "OPENCODE_API_KEY"
    timeout: 300
    max_retries: 3
    streaming_enabled: true

models:
  qwen3.5-flash:
    name: "qwen/qwen3.5-122b-a10b:alibaba"
    provider: "openrouter"
    temperature: 0.3
    max_tokens: 8192
    streaming_enabled: true

  qwen3.5-27b:
    name: "qwen/qwen3.5-27b:alibaba"
    provider: "openrouter"
    temperature: 0.3
    max_tokens: 8000
    streaming_enabled: true

  kimi-k2.5:
    name: kimi-k2.5
    provider: opencode
    temperature: 0.5
    max_tokens: 8000
    streaming_enabled: true
    preserve_reasoning_content: true

  qwen3.5-35b-local:
    name: "qwen/qwen3.5-35b-a3b"
    provider: "lm-studio"
    temperature: 0.3
    max_tokens: 8192
    streaming_enabled: true

tools:
  # ── Window discovery ────────────────────────────────────────────────────────
  find_window:
    type: "function"
    description: "Найти и выбрать окно для работы. Возвращает список окон с id, заголовком и геометрией."
    prompt_addition: |
      find_window(query=None, set_active=None)
      Всегда начинай с find_window() чтобы узнать id окна для работы.
      Используй set_active='<id>' чтобы сделать окно активным по умолчанию.

  # ── Screenshot ──────────────────────────────────────────────────────────────
  get_screen:
    type: "function"
    description: "Сделать скриншот активного окна или всего экрана."
    prompt_addition: |
      get_screen(window_id=None, save_path=None, full_screen=False)
      Координаты на скриншоте соответствуют координатам для mouse_click.
      ВСЕГДА делай скриншот после каждого действия чтобы увидеть результат.

  # ── Mouse ───────────────────────────────────────────────────────────────────
  mouse_click:
    type: "function"
    description: "Кликнуть мышью в точке (x, y) окна."
    prompt_addition: |
      mouse_click(x, y, button='left', clicks=1, window_id=None)
      Координаты ОТНОСИТЕЛЬНО верхнего-левого угла окна (не экрана).
      button: 'left', 'right', 'middle'
      clicks=2 для двойного клика.

  mouse_scroll:
    type: "function"
    description: "Прокрутить колёсиком мыши в точке (x, y) окна."
    prompt_addition: |
      mouse_scroll(x, y, direction='down', amount=3, window_id=None)
      direction: 'up', 'down', 'left', 'right'

  mouse_drag:
    type: "function"
    description: "Перетащить мышь от (x1,y1) до (x2,y2) в окне."
    prompt_addition: |
      mouse_drag(x1, y1, x2, y2, button='left', window_id=None)
      Для ползунков, выделения текста, drag-and-drop.

  # ── Keyboard ────────────────────────────────────────────────────────────────
  key_press:
    type: "function"
    description: "Нажать клавишу или комбинацию клавиш в окне."
    prompt_addition: |
      key_press(keys, window_id=None)
      Примеры: 'Return', 'Escape', 'Tab', 'ctrl+c', 'ctrl+v', 'ctrl+z',
               'alt+F4', 'F5', 'ctrl+a', 'BackSpace', 'Up', 'Down'

  type_text:
    type: "function"
    description: "Ввести строку текста в окно как с клавиатуры."
    prompt_addition: |
      type_text(text, delay_ms=12, window_id=None)
      Перед вводом кликни на поле ввода через mouse_click.
      delay_ms: увеличь до 30-50 если приложение пропускает символы.

  # ── Utility ─────────────────────────────────────────────────────────────────
  crop_image:
    type: "function"
    description: "Вырезать фрагмент скриншота для детального анализа."

  append_to_file:
    type: "function"
    description: "Добавить текст в конец файла (для логов и отчётов)."

  file_list:
    type: "function"
    description: "Список файлов в директории."

  read_file:
    type: "function"
    description: "Прочитать файл."

  write_file:
    type: "function"
    description: "Записать файл."

agents:
  computer_use:
    name: "Computer Use"
    model: "kimi-k2.5"
    tools:
      - find_window
      - get_screen
      - mouse_click
      - mouse_scroll
      - mouse_drag
      - key_press
      - type_text
      - crop_image
      - append_to_file
      - file_list
      - read_file
      - write_file
    description: "Агент управления рабочим столом через мышь, клавиатуру и скриншоты"
    custom_prompt: |
      # Ты агент компьютерного управления (Computer Use).
      Ты видишь экран, нажимаешь кнопки, кликаешь мышью и вводишь текст в любые приложения.

      ## Обязательный протокол:
      1. **Найди окно**: find_window() → выбери нужное окно → set_active
      2. **Посмотри экран**: get_screen() перед любым действием
      3. **Действуй**: mouse_click / key_press / type_text
      4. **Проверь**: get_screen() после каждого действия

      ## Координаты:
      - Все координаты (x, y) — ОТНОСИТЕЛЬНО верхнего-левого угла окна
      - Смотри на скриншот: левый край = x=0, правый = x=ширина окна
      - Верхний край = y=0, нижний = y=высота окна
      - Центр 480x278 окна ≈ (240, 139)

      ## Правила:
      - ВСЕГДА делай get_screen() после нажатий, чтобы убедиться в результате
      - Если клик не сработал — проверь координаты и попробуй снова
      - Для ввода текста: сначала mouse_click по полю, потом type_text
      - Пиши отчёт о выполненных действиях в markdown

prompt_templates:
  base: |
    Ты агент управления рабочим столом. Используй инструменты для работы с любыми
    приложениями через мышь, клавиатуру и скриншоты. Отвечай на русском языке.
