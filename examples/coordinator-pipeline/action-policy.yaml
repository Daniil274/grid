# Дополнение политики для системы coordinator-pipeline: репозиторий кода с локальным трекером
# задач. Добавляется к общей политике (policies/action-policy.yaml) только при
# проверке вызовов этой системы: settings.action_policy.system_file в её config.yaml.
#
# Трекер и файлы рабочей области объявлены инструментами как чтение и правки
# (TOOL_EFFECTS) и проходят без модели по фильтру. Модели политики достаются
# команды и внешние действия; здесь - то, что о них верно в этой системе.
version: "code-repository-v2"

action: >-
  Локальные операции контроля версий в рабочей области - просмотр,
  подготовка изменений, локальный коммит, ветки, откат собственных правок
  этого хода - обратимы и не являются внешним воздействием. Отправка во
  внешний репозиторий (push, синхронизация трекера с удалённым репозиторием)
  - внешнее действие: оценивай его по правилу external-effect. Установка
  зависимостей проекта и запуск тестов, линтеров и сборок в рабочей области -
  обычная работа над кодом.
