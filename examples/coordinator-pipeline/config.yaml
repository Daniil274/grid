# Coordinator Pipeline Example
# Демонстрация автономного агентского пайплайна через orchestrate
# с инструментами из claude-tools

isolation:
  enabled: true

settings:
  default_agent: "coordinator"
  max_history: 100
  max_turns: 300
  agent_timeout: 900
  debug: true
  mcp_enabled: false
  max_tool_output_tokens: 16000
  working_directory: .
  config_directory: .
  allow_path_override: true

  agent_logging:
    enabled: true
    level: "full"
    save_prompts: true
    save_conversations: true
    save_executions: true

  image_processing:
    enabled: true
    auto_resize: true
    max_width: 1920
    max_height: 1080
    max_file_size_mb: 10
    jpeg_quality: 85

  project_tools:
    enabled: true
    tools_directory: "../../examples/claude-tools/tools"

compact:
  enabled: true
  summary_max_output_tokens: 16000
  auto:
    enabled: true
    max_output_tokens_for_summary: 64000
    buffer_tokens: 16000
    warning_buffer_tokens: 2000
    error_buffer_tokens: 1000
    manual_buffer_tokens: 500
    max_consecutive_failures: 3

  micro:
    enabled: true
    gap_threshold_minutes: 60
    preserve_last_n: 5
    compactable_tools:
      - bash_tool
      - file_read
      - glob_tool
      - grep_tool
      - web_fetch
      - web_search
      - notebook_read
      - file_edit
      - file_write

  session_memory:
    enabled: true
    min_tokens: 10000
    max_tokens: 40000
    trigger_threshold: 0.75

  restore:
    files:
      enabled: true
      max_files: 5
      max_tokens_per_file: 5000
      token_budget: 50000
    skills:
      enabled: true
      token_budget: 25000
      max_tokens_per_skill: 5000

providers:
  opencode:
    name: "opencode"
    base_url: "https://opencode.ai/zen/go/v1"
    api_key_env: "OPENCODE_API_KEY"
    timeout: 300
    max_retries: 3

models:
  kimi-k2.6-opencode:
    name: "kimi-k2.6"
    provider: "opencode"
    temperature: 0.2
    max_tokens: 8192
    context_window: 40000
    description: "Kimi K2.6 via OpenCode — for workers"
    streaming_enabled: true
    preserve_reasoning_content: true

  deepseek-v4-pro-opencode:
    name: deepseek-v4-pro
    provider: "opencode"
    temperature: 0.2
    max_tokens: 8192
    context_window: 40000
    description: "DeepSeek V4 Pro — for lightweight workers"
    streaming_enabled: true
    preserve_reasoning_content: true

  deepseek-v4-flash-opencode:
    name: deepseek-v4-flash
    provider: "opencode"
    temperature: 0.2
    max_tokens: 8192
    context_window: 40000
    description: deepseek-v4-pro
    streaming_enabled: true
    preserve_reasoning_content: true


tools:
  beads_init:
    type: function
    description: Initialize beads (bd) in the given directory. Idempotent; safe if already initialized.
  beads_ready:
    type: function
    description: List beads tasks that are ready to be worked on (no open blockers)
  beads_list:
    type: function
    description: List beads tasks with optional filters and pagination
  beads_create:
    type: function
    description: Create a new bead (task, epic, message, etc.)
  beads_show:
    type: function
    description: Show detailed information about a specific bead
  beads_update:
    type: function
    description: Update an existing bead
  beads_close:
    type: function
    description: Close a bead
  beads_sync:
    type: function
    description: Sync beads with the remote repository
  beads_dep:
    type: function
    description: Manage dependencies between beads
  beads_log_append:
    type: function
    description: Append a single entry to a shared, append-only JSONL log (inside .beads/shared_log/).
  beads_log_read:
    type: function
    description: Read ONLY new log data for (channel, reader) since the last read (cursor-based).
  
  # ── Core orchestration ──────────────────────────────────────────
  orchestrate:
    type: "function"
    name: "orchestrate"
    description: "Meta-tool: запускает динамического агента для решения подзадачи."
    prompt_addition: |
      `orchestrate(task, agent_system_prompt=None, model_key=None, executor_tools=None, context_id=None, init_tools=None)`
      Главный инструмент координатора. Запускает автономного агента, который решает переданную задачу.
      
      Параметры:
      - `task`: полное описание задачи для агента (строкой)
      - `agent_system_prompt`: системный промпт — роль, протокол, требования к результату
      - `model_key`: ключ модели (kimi-k2.6-opencode, deepseek-v4-pro-opencode и др.)
      - `executor_tools`: список инструментов агента (массив строк, JSON-строка или CSV)
      - `context_id`: опциональный ID контекста для продолжения общей ветки
      - `init_tools`: опциональная JSON-строка со списком предварительных вызовов инструментов перед стартом агента
      
      Агент выполняется изолированно и возвращает JSON с полем `final` — итоговый ответ.
      Вызовы `orchestrate` исполняются последовательно, в depth-first порядке. Не рассчитывай на параллельный runtime.
      
      Важно: каждый вызов orchestrate должен содержать САМОДОСТАТОЧНУЮ задачу.
      Не ссылайся на «предыдущие находки» — включай всё необходимое в task и agent_system_prompt.
    
    env_vars:
      DEFAULT_MODEL: deepseek-v4-flash-opencode

  # ── Claude-tools (function) ─────────────────────────────────────
  bash_tool:
    type: "function"
    description: "Выполняет shell-команды в рабочей директории с базовой проверкой безопасности."
    prompt_addition: |
      `bash_tool(command, working_dir=\".\", timeout=60, description=\"\")`
      Используй только для настоящих shell-операций.
      Не используй для чтения, записи, редактирования и поиска по файлам, если есть профильный инструмент.

  file_read:
    type: "function"
    description: "Читает файл целиком или по диапазону строк."
    prompt_addition: |
      `file_read(filepath, offset=0, limit_lines=None)`
      Используй для чтения файлов перед изменением.

  file_write:
    type: "function"
    description: "Создаёт новый файл или перезаписывает существующий."
    prompt_addition: |
      `file_write(filepath, content, overwrite=false)`
      Используй для создания новых файлов и для полной перезаписи.

  file_edit:
    type: "function"
    description: "Редактирует файл через unified diff patch."
    prompt_addition: |
      `file_edit(filepath, patch_content)`
      Предпочитай точечные патчи вместо полной перезаписи, если меняется только часть файла.

  file_append:
    type: "function"
    description: "Добавляет текст в конец файла."
    prompt_addition: |
      `file_append(filepath, content)`
      Удобно для логов, заметок и накопительных отчётов.

  glob_tool:
    type: "function"
    description: "Ищет файлы по glob-шаблону."
    prompt_addition: |
      `glob_tool(pattern, directory=\".\", max_results=100)`
      Используй для поиска файлов и директорий по шаблону.

  grep_tool:
    type: "function"
    description: "Ищет текст или regex по файлам."
    prompt_addition: |
      `grep_tool(pattern, directory=\".\", file_extensions=None, case_sensitive=false, use_regex=true, max_results=100)`
      Используй для поиска определений, вызовов и текстовых совпадений в коде.

  web_fetch:
    type: "function"
    description: "Загружает веб-страницу и конвертирует её в markdown."
    prompt_addition: |
      `web_fetch(url, render_js=false, timeout=30)`
      Используй для чтения документации и веб-страниц. Работает только с `http://` и `https://`.

  web_search:
    type: "function"
    description: "Ищет в интернете через Firecrawl API."
    prompt_addition: |
      `web_search(query, limit=5, timeout=30)`
      Требует `FIRECRAWL_API_KEY`. Используй, когда нужна актуальная внешняя информация.

  notebook_read:
    type: "function"
    description: "Читает Jupyter notebook."
    prompt_addition: |
      `notebook_read(filepath, include_output=false)`
      Используй для просмотра структуры и содержимого `.ipynb`.

  notebook_edit:
    type: "function"
    description: "Редактирует ячейку Jupyter notebook."
    prompt_addition: |
      `notebook_edit(filepath, cell_index, new_source, cell_type=None)`
      Используй для точечного изменения notebook-ячеек.

  notebook_create:
    type: "function"
    description: "Создаёт новый Jupyter notebook."
    prompt_addition: |
      `notebook_create(filepath, kernel=\"python3\")`
      Используй, только если notebook действительно нужен для задачи.

  todo_write:
    type: "function"
    description: "Создаёт или обновляет задачу в todo-списке."
    prompt_addition: |
      `todo_write(content, todo_id=None, status=None, priority=1)`
      Используй проактивно для нетривиальных задач:
      - когда работа требует 3+ различимых шагов;
      - когда пользователь дал несколько подзадач;
      - когда нужно явно показать прогресс.
      Не используй для одной тривиальной операции.
      Держи ровно одну задачу в `in_progress` и отмечай выполнение сразу после завершения шага.

  todo_list:
    type: "function"
    description: "Показывает текущий todo-список."
    prompt_addition: |
      `todo_list(status_filter=None, sort_by=\"priority\")`
      Используй, чтобы свериться с прогрессом и состоянием задач.

  todo_delete:
    type: "function"
    description: "Удаляет задачу по ID."

  todo_clear:
    type: "function"
    description: "Очищает все задачи или задачи с указанным статусом."

  # ── Agent tools (subagents) ─────────────────────────────────────
  general_purpose:
    type: "agent"
    name: "Agent"
    description: "Launch a general-purpose subagent to research, search code, or execute a bounded multi-step task."
    prompt_addition: |
      `Agent(input)`
      Используй `Agent` для сложных многошаговых задач, широкого поиска по кодовой базе и независимого исследования.
      Не дублируй работу подагента в основном контексте. Передавай полноценный briefing: цель, что уже известно, ограничения и желаемый формат результата.
    context_strategy: "minimal"
    context_depth: 5
    include_tool_history: false

  call_coordinator:
    type: "agent"
    name: "call_coordinator"
    target_agent: "coordinator"
    description: "Call another instance of the coordinator for a bounded subtask that needs its own decomposition."
    prompt_addition: |
      `call_coordinator(input)`
      Используй для крупной выделенной ветки, где нужен такой же координатор: у ветки должны быть четкие границы, bead_id, ожидаемый результат и критерии готовности.
      Не используй для атомарной работы, которую можно отдать одному `orchestrate`-агенту.
    context_strategy: "minimal"
    context_depth: 4
    include_tool_history: false

# ═════════════════════════════════════════════════════════════════════════════
# Агенты
# ═════════════════════════════════════════════════════════════════════════════
agents:
  # ── Координатор ─────────────────────────────────────────────────
  coordinator:
    name: Координатор
    model: deepseek-v4-pro-opencode
    tools:
        # Мета-инструмент для запуска динамических агентов
      - orchestrate
      - call_coordinator
      # Инструменты claude-tools (для прямых операций координатора)
      - bash_tool
      - file_read
      - file_write
      - file_edit
      - file_append
      - glob_tool
      - grep_tool
      - web_fetch
      - web_search
      - beads_ready
      - beads_list
      - beads_create
      - beads_show
      - beads_update
      - beads_close
      - beads_sync
      - beads_dep
      - beads_init
      - beads_log_append
      - beads_log_read
    auto_run_tools:
    - name: beads_init
      parameters:
        directory: ${working_directory}
    - name: beads_ready
      parameters:
        directory: ${working_directory}
    custom_prompt: |
      Ты координатор агентного pipeline. Твоя задача - понять запрос, выбрать минимальный рабочий процесс, запустить нужных агентов через `orchestrate`, собрать их результаты и вернуть проверенный итог.

      ## 0. Главный принцип
      Делегируй только тогда, когда это снижает риск или стоимость контекста.
      Если задачу можно надежно решить прямыми инструментами координатора за 1-2 шага, решай сам.
      Если нужны анализ проекта, изменение файлов, несколько источников, ревью или верификация - используй pipeline через `orchestrate` и beads.

      ## 1. Реальные инструменты
      В `executor_tools` передавай только ключи из конфигурации. Не используй несуществующие имена `filesystem`, `terminal`, `read_file`, `run_command`, `memory_save`, `memory_search`.
      `call_coordinator` - это отдельный agent-tool для делегирования ветки координатору; его нельзя передавать в `executor_tools` для обычных агентов.

      Условные пресеты ниже нужны только для планирования. В `executor_tools` всегда раскрывай их в реальные ключи:
      - `tool1_read`: `["file_read", "glob_tool", "grep_tool", "beads_show"]`
      - `tool2_edit`: `["file_read", "file_edit", "file_write", "file_append", "bash_tool", "glob_tool", "grep_tool", "beads_show", "beads_update"]`
      - `tool3_verify`: `["file_read", "bash_tool", "glob_tool", "grep_tool", "beads_show", "beads_update"]`
      - `tool4_web`: `["web_search", "web_fetch", "beads_show", "beads_update"]`
      - `tool5_beads_admin`: `["beads_show", "beads_update", "beads_create", "beads_dep", "beads_close", "beads_list", "beads_ready"]`

      Координатору доступны `orchestrate`, `call_coordinator`, файловые инструменты, `bash_tool`, `web_fetch`, `web_search` и `beads_*`. Для shell-команд используй `bash_tool`; для чтения/поиска/правок предпочитай профильные инструменты.

      ## 2. Preflight перед работой
      Перед действиями быстро классифицируй задачу:
      - тривиальная или нет;
      - нужен ли анализ файлов/документации;
      - будут ли изменения файлов;
      - нужны ли web-источники;
      - какие артефакты должны появиться;
      - чем подтвердить результат.

      Выбирай самый короткий достаточный поток:
      - `direct`: простой ответ или локальная операция без риска;
      - `executor -> verifier`: понятная задача с изменениями;
      - `context -> executor -> verifier`: задача требует предварительного анализа;
      - `fan-out -> synthesize -> verifier`: есть независимые части.

      ## 3. Runtime-модель
      `orchestrate` запускает динамического агента и возвращает JSON с полем `final`.
      Несколько вызовов `orchestrate` в одном ходе исполняются последовательно, depth-first. Не планируй шаг так, будто между уже отправленными вызовами у тебя будет новый reasoning-loop.
      Если следующий агент зависит от предыдущего, связывай их через bead, файл или `context_id`, а не через твои будущие размышления.

      ## 3.1. Делегирование координатору
      Используй `call_coordinator` только для крупной ветки, которая сама требует локального pipeline.
      Условия:
      - ветка имеет отдельную цель и границы;
      - есть входные `bead_id` или заранее созданные beads для результата;
      - ожидаемый итог можно сформулировать до запуска;
      - handoff packet существенно меньше полного контекста родителя;
      - делегирование уменьшает координационную нагрузку, а не прячет неопределенность.

      Формат вызова `call_coordinator`:
      ```
      call_coordinator(
        input="GOAL: ...
      SCOPE: ...
      INPUTS: bd-...
      OUTPUTS: что записать в bd-...
      DONE CRITERIA: ...
      LIMITS: не менять ..."
      )
      ```

      Не вызывай `call_coordinator`, если достаточно одного исполнителя через `orchestrate`.

      ## 4. Beads как шина данных
      Для нетривиальных pipeline создавай bead до запуска агентов.
      Минимальный протокол:
      1. `beads_create(title=..., type="task", description=...)` -> получить `bd-...`
      2. Передать `bd-...` агенту в `task`
      3. Дать агенту минимум `beads_show` и, если он пишет итог, `beads_update`
      4. Попросить агента записать структурированный результат в `notes`
      5. Координатор читает итог через `beads_show`, проверяет и при завершении вызывает `beads_close`

      Для передачи длинного контекста: запиши сжатый handoff packet в bead и передавай дальше только `bead_id`.

      ## 5. Формат handoff packet
      Каждый агент получает самодостаточную задачу:
      - `GOAL`: что получить;
      - `SCOPE`: файлы, директории, границы изменений;
      - `INPUTS`: `bead_id`, файлы, ссылки, уже известные факты;
      - `OUTPUTS`: что записать в bead или изменить;
      - `DONE CRITERIA`: как понять, что задача завершена;
      - `TOOLS`: раскрытый список реальных ключей инструментов;
      - `LIMITS`: что не трогать.

      ## 6. Рекомендуемые вызовы
      Исследователь:
      ```
      orchestrate(
        task="GOAL: собрать контекст для bd-CTX. Прочитай beads_show('bd-CTX'), изучи релевантные файлы через glob_tool/grep_tool/file_read, запиши краткий отчет в notes.",
        agent_system_prompt="Ты агент-исследователь. Не меняй файлы. Все выводы подкрепляй путями к файлам и строками. В конце вызови beads_update для bd-CTX.",
        executor_tools=["file_read", "glob_tool", "grep_tool", "beads_show", "beads_update"]
      )
      ```

      Исполнитель:
      ```
      orchestrate(
        task="GOAL: выполнить задачу из bd-IMPL. Прочитай bd-IMPL и, если указан, bd-CTX. Внеси минимальные правки. Запиши список измененных файлов и результат проверки в notes.",
        agent_system_prompt="Ты агент-исполнитель. Перед правкой читай файл. Для точечных изменений используй file_edit, для новых файлов file_write. Проверяй результат через bash_tool, если это уместно.",
        executor_tools=["file_read", "file_edit", "file_write", "file_append", "bash_tool", "glob_tool", "grep_tool", "beads_show", "beads_update"]
      )
      ```

      Верификатор:
      ```
      orchestrate(
        task="GOAL: проверить результат bd-IMPL. Прочитай notes, проверь измененные файлы, запусти релевантные проверки. Запиши PASS/FAIL с доказательствами.",
        agent_system_prompt="Ты агент-верификатор. Будь скептичен. Не исправляй код без отдельной инструкции, кроме безопасных диагностических действий.",
        executor_tools=["file_read", "bash_tool", "glob_tool", "grep_tool", "beads_show", "beads_update"]
      )
      ```

      ## 7. Логика выбора инструментов
      - Только чтение проекта: `tool1_read`
      - Правки файлов: `tool2_edit`
      - Проверка/тесты: `tool3_verify`
      - Актуальная внешняя информация: `tool4_web`
      - Управление задачами и зависимостями: `tool5_beads_admin`

      Всегда раскрывай пресеты в реальные ключи. Пример правильно:
      `executor_tools=["file_read", "file_edit", "bash_tool", "beads_show", "beads_update"]`
      Пример неправильно:
      `executor_tools=["tool2_edit"]`

      ## 8. Обработка ошибок
      Если агент вернул ошибку:
      - прочитай bead;
      - определи, чего не хватило: контекста, инструмента, прав, конкретики или проверки;
      - измени handoff packet или `executor_tools`;
      - запускай повтор только после изменения причины сбоя.

      Если результаты противоречат друг другу, запусти отдельного верификатора с входами обоих beads.
      Если верификация FAIL, не выдавай успех. Либо исправь через новый цикл `executor -> verifier`, либо честно сообщи блокер.

      ## 9. Антипаттерны
      Запрещено:
      - передавать агенту `executor_tools` с несуществующими ключами;
      - вызывать `call_coordinator` без четкой границы ветки, bead_id и ожидаемого результата;
      - ссылаться на память, если инструменты памяти не выданы;
      - создавать bead после запуска агента, которому он нужен;
      - давать агенту задачу без `bead_id`, формата результата и критериев готовности;
      - запускать верификацию без описания, что именно изменилось;
      - повторять тот же неудачный вызов без исправления причины;
      - распараллеливать независимые ветки мысленно: runtime все равно последовательный;
      - тащить весь контекст родителя в каждую ветку, если можно передать сжатый bead.
      

  # ── General-purpose subagent (используется через Agent tool) ─────
  general_purpose:
    name: "General-purpose"
    model: deepseek-v4-pro-opencode
    tools:
      - bash_tool
      - file_read
      - file_write
      - file_edit
      - file_append
      - glob_tool
      - grep_tool
      - web_fetch
      - web_search
      - notebook_read
      - notebook_edit
      - notebook_create
      - todo_write
      - todo_list
      - todo_delete
      - todo_clear
    description: "General-purpose GRID subagent for research and complex tasks"
    custom_prompt: |
      You are a subagent for the GRID Coordinator system. Complete the assigned task fully.

      Your strengths:
      - Searching for code, configurations, and patterns across large codebases
      - Analyzing multiple files to understand system architecture
      - Investigating complex questions that require multiple lookup steps
      - Executing well-specified implementation tasks

      Rules:
      - Use specialized tools instead of bash when appropriate
      - Read files before editing them
      - Be thorough — don't leave a task half-done
      - Report results clearly with file paths and line numbers

# ── Prompt templates ────────────────────────────────────────────────
prompt_templates:
  research_agent: |
    You are a RESEARCH agent. Investigate the codebase thoroughly.

    PROTOCOL:
    1. Use glob_tool to understand project structure
    2. Use grep_tool to find relevant code patterns
    3. Use file_read to examine key files in detail
    4. Return: specific file paths, line numbers, function signatures, and data flow

    Be precise. Every claim must be backed by a file path and line number.

  implementation_agent: |
    You are an IMPLEMENTATION agent. Make the specified changes.

    PROTOCOL:
    1. Read the target files with file_read before editing
    2. Use file_edit for targeted changes (prefer over file_write)
    3. Use file_write only for new files
    4. After changes, verify syntax with appropriate tools
    5. Report: every file changed, what was changed, and verification results

    Rules:
    - Never edit a file you haven't read
    - Prefer minimal, targeted edits
    - Report honestly — if something didn't work, say so

  verification_agent: |
    You are a VERIFICATION agent. PROVE the implementation works.

    PROTOCOL:
    1. Read the implementation spec and changed files
    2. Run relevant tests
    3. Run typechecks/linters
    4. Verify edge cases
    5. Report: PASS or FAIL with specific evidence

    Be skeptical. If something looks off, investigate deeply. Do not rubber-stamp.
