# Coordinator Pipeline Example
# Демонстрация автономного агентского пайплайна через orchestrate
# с инструментами из claude-tools

isolation:
  enabled: false

settings:
  default_agent: "coordinator"
  max_history: 100
  max_turns: 150
  agent_timeout: 900
  debug: true
  mcp_enabled: false
  max_tool_output_tokens: 16000
  working_directory: "/home/user/grid/examples/coordinator-pipeline/workspace"
  config_directory: "."
  allow_path_override: true

  agent_logging:
    enabled: true
    level: "full"
    save_prompts: true
    save_conversations: true
    save_executions: true

  image_processing:
    enabled: true
    auto_resize: true
    max_width: 1920
    max_height: 1080
    max_file_size_mb: 10
    jpeg_quality: 85

  project_tools:
    enabled: true
    tools_directory: "../../examples/claude-tools/tools"

  tools_common_rules: |
    - Используй специализированные инструменты вместо bash, когда они подходят задаче.
    - Для чтения файлов используй `file_read`, а не `cat`, `head`, `tail`, `sed`.
    - Для редактирования файлов используй `file_edit`, а не `sed` или `awk`.
    - Для создания файлов используй `file_write`, а не heredoc через shell.
    - Для поиска файлов используй `glob_tool`, для поиска по содержимому — `grep_tool`.
    - Если нужно сделать несколько независимых вызовов инструментов, делай их параллельно в одном ответе.
    - Если задача состоит из нескольких заметных шагов, веди её через `todo_write` и держи ровно одну задачу в `in_progress`.

compact:
  enabled: true
  summary_max_output_tokens: 4000

  auto:
    enabled: true
    max_output_tokens_for_summary: 4000
    buffer_tokens: 3000
    warning_buffer_tokens: 2000
    error_buffer_tokens: 1000
    manual_buffer_tokens: 500
    max_consecutive_failures: 3

  micro:
    enabled: true
    gap_threshold_minutes: 60
    preserve_last_n: 5
    compactable_tools:
      - bash_tool
      - file_read
      - glob_tool
      - grep_tool
      - web_fetch
      - web_search
      - notebook_read
      - file_edit
      - file_write

  session_memory:
    enabled: true
    min_tokens: 10000
    max_tokens: 40000
    trigger_threshold: 0.75

  restore:
    files:
      enabled: true
      max_files: 5
      max_tokens_per_file: 5000
      token_budget: 50000
    skills:
      enabled: true
      token_budget: 25000
      max_tokens_per_skill: 5000

providers:
  opencode:
    name: "opencode"
    base_url: "https://opencode.ai/zen/go/v1"
    api_key_env: "OPENCODE_API_KEY"
    timeout: 300
    max_retries: 3

  anthropic:
    name: "anthropic"
    base_url: "https://api.anthropic.com/v1"
    api_key_env: "ANTHROPIC_API_KEY"
    timeout: 300
    max_retries: 3

models:
  claude-sonnet-4.6:
    name: claude-sonnet-4-6
    provider: "anthropic"
    temperature: 0.2
    max_tokens: 8192
    context_window: 40000
    description: "Anthropic Claude Sonnet 4.6 — for coordinator"
    streaming_enabled: true
    preserve_reasoning_content: true

  kimi-k2.6-opencode:
    name: "kimi-k2.6"
    provider: "opencode"
    temperature: 0.2
    max_tokens: 8192
    context_window: 40000
    description: "Kimi K2.6 via OpenCode — for workers"
    streaming_enabled: true
    preserve_reasoning_content: true

  deepseek-v4-pro-opencode:
    name: deepseek-v4-pro
    provider: "opencode"
    temperature: 0.2
    max_tokens: 8192
    context_window: 40000
    description: "DeepSeek V4 Pro — for lightweight workers"
    streaming_enabled: true
    preserve_reasoning_content: true

tools:
  # ── Core orchestration ──────────────────────────────────────────
  orchestrate:
    type: "function"
    name: "orchestrate"
    description: "Meta-tool: запускает динамического агента для решения подзадачи."
    prompt_addition: |
      `orchestrate(task, agent_system_prompt=None, model_key=None, executor_tools=None)`
      Главный инструмент координатора. Запускает автономного агента, который решает переданную задачу.
      
      Параметры:
      - `task`: полное описание задачи для агента (строкой)
      - `agent_system_prompt`: системный промпт — роль, протокол, требования к результату
      - `model_key`: ключ модели (kimi-k2.6-opencode, deepseek-v4-pro-opencode и др.)
      - `executor_tools`: список инструментов агента (массив строк или JSON-строка)
      
      Агент выполняется изолированно и возвращает JSON с полем `final` — итоговый ответ.
      
      Важно: каждый вызов orchestrate должен содержать САМОДОСТАТОЧНУЮ задачу.
      Не ссылайся на «предыдущие находки» — включай всё необходимое в task и agent_system_prompt.
    
    env_vars:
      DEFAULT_MODEL: "kimi-k2.6-opencode"

  # ── Claude-tools (function) ─────────────────────────────────────
  bash_tool:
    type: "function"
    description: "Выполняет shell-команды в рабочей директории с базовой проверкой безопасности."
    prompt_addition: |
      `bash_tool(command, working_dir=\".\", timeout=60, description=\"\")`
      Используй только для настоящих shell-операций.
      Не используй для чтения, записи, редактирования и поиска по файлам, если есть профильный инструмент.

  file_read:
    type: "function"
    description: "Читает файл целиком или по диапазону строк."
    prompt_addition: |
      `file_read(filepath, offset=0, limit_lines=None)`
      Используй для чтения файлов перед изменением.

  file_write:
    type: "function"
    description: "Создаёт новый файл или перезаписывает существующий."
    prompt_addition: |
      `file_write(filepath, content, overwrite=false)`
      Используй для создания новых файлов и для полной перезаписи.

  file_edit:
    type: "function"
    description: "Редактирует файл через unified diff patch."
    prompt_addition: |
      `file_edit(filepath, patch_content)`
      Предпочитай точечные патчи вместо полной перезаписи, если меняется только часть файла.

  file_append:
    type: "function"
    description: "Добавляет текст в конец файла."
    prompt_addition: |
      `file_append(filepath, content)`
      Удобно для логов, заметок и накопительных отчётов.

  glob_tool:
    type: "function"
    description: "Ищет файлы по glob-шаблону."
    prompt_addition: |
      `glob_tool(pattern, directory=\".\", max_results=100)`
      Используй для поиска файлов и директорий по шаблону.

  grep_tool:
    type: "function"
    description: "Ищет текст или regex по файлам."
    prompt_addition: |
      `grep_tool(pattern, directory=\".\", file_extensions=None, case_sensitive=false, use_regex=true, max_results=100)`
      Используй для поиска определений, вызовов и текстовых совпадений в коде.

  web_fetch:
    type: "function"
    description: "Загружает веб-страницу и конвертирует её в markdown."
    prompt_addition: |
      `web_fetch(url, render_js=false, timeout=30)`
      Используй для чтения документации и веб-страниц. Работает только с `http://` и `https://`.

  web_search:
    type: "function"
    description: "Ищет в интернете через Firecrawl API."
    prompt_addition: |
      `web_search(query, limit=5, timeout=30)`
      Требует `FIRECRAWL_API_KEY`. Используй, когда нужна актуальная внешняя информация.

  notebook_read:
    type: "function"
    description: "Читает Jupyter notebook."
    prompt_addition: |
      `notebook_read(filepath, include_output=false)`
      Используй для просмотра структуры и содержимого `.ipynb`.

  notebook_edit:
    type: "function"
    description: "Редактирует ячейку Jupyter notebook."
    prompt_addition: |
      `notebook_edit(filepath, cell_index, new_source, cell_type=None)`
      Используй для точечного изменения notebook-ячеек.

  notebook_create:
    type: "function"
    description: "Создаёт новый Jupyter notebook."
    prompt_addition: |
      `notebook_create(filepath, kernel=\"python3\")`
      Используй, только если notebook действительно нужен для задачи.

  todo_write:
    type: "function"
    description: "Создаёт или обновляет задачу в todo-списке."
    prompt_addition: |
      `todo_write(content, todo_id=None, status=None, priority=1)`
      Используй проактивно для нетривиальных задач:
      - когда работа требует 3+ различимых шагов;
      - когда пользователь дал несколько подзадач;
      - когда нужно явно показать прогресс.
      Не используй для одной тривиальной операции.
      Держи ровно одну задачу в `in_progress` и отмечай выполнение сразу после завершения шага.

  todo_list:
    type: "function"
    description: "Показывает текущий todo-список."
    prompt_addition: |
      `todo_list(status_filter=None, sort_by=\"priority\")`
      Используй, чтобы свериться с прогрессом и состоянием задач.

  todo_delete:
    type: "function"
    description: "Удаляет задачу по ID."

  todo_clear:
    type: "function"
    description: "Очищает все задачи или задачи с указанным статусом."

  # ── Agent tools (subagents) ─────────────────────────────────────
  general_purpose:
    type: "agent"
    name: "Agent"
    description: "Launch a general-purpose subagent to research, search code, or execute a bounded multi-step task."
    prompt_addition: |
      `Agent(input)`
      Используй `Agent` для сложных многошаговых задач, широкого поиска по кодовой базе и независимого исследования.
      Не дублируй работу подагента в основном контексте. Передавай полноценный briefing: цель, что уже известно, ограничения и желаемый формат результата.
    context_strategy: "minimal"
    context_depth: 5
    include_tool_history: false

  web_spider:
    type: "agent"
    name: "WebSpider"
    description: "Launch a web research subagent that searches the internet, follows relevant pages, and returns a concise fact-and-sources report."
    prompt_addition: |
      `WebSpider(input)`
      Используй `WebSpider` для веб-исследования: поиск свежей информации, обход найденных страниц, сбор фактов, ссылок, документации и кратких выводов.
      Передавай чёткий briefing: что нужно найти, какие домены или источники предпочтительны, какие ограничения есть по глубине поиска и какой формат ответа нужен.
    context_strategy: "minimal"
    context_depth: 4
    include_tool_history: false

# ═════════════════════════════════════════════════════════════════════════════
# Агенты
# ═════════════════════════════════════════════════════════════════════════════
agents:
  # ── Координатор ─────────────────────────────────────────────────
  coordinator:
    name: "Coordinator"
    model: claude-sonnet-4.6
    tools:
      # Мета-инструмент для запуска динамических агентов
      - orchestrate
      # Инструменты claude-tools (для прямых операций координатора)
      - bash_tool
      - file_read
      - file_write
      - file_edit
      - file_append
      - glob_tool
      - grep_tool
      - web_fetch
      - web_search
      - notebook_read
      - notebook_edit
      - notebook_create
      - todo_write
      - todo_list
      - todo_delete
      - todo_clear
      # Агент-инструменты (субагенты)
      - general_purpose
      - web_spider
    system_skills:
      - coordinator_pipeline_skill
    description: "Автономный координатор — строит агентские пайплайны через orchestrate для решения инженерных задач"
    custom_prompt: |
      You are GRID Coordinator — an AI that orchestrates software engineering tasks across autonomous agent pipelines.

      ## 1. Your Role

      You are a **coordinator**. Your job is to:
      - Help the user achieve their goal
      - Decompose tasks and build autonomous agent pipelines via `orchestrate`
      - Synthesize results and communicate with the user
      - Answer simple questions directly when possible — don't build a pipeline for trivial tasks

      You are NOT an executor. Your value is in correct decomposition, agent briefing, and result synthesis.

      ## 2. Your Tools

      ### Primary: `orchestrate` — Your Pipeline Engine

      `orchestrate(task, agent_system_prompt, model_key, executor_tools)` launches an autonomous agent that solves a single well-defined subtask.

      **When to use orchestrate:**
      - Research tasks: codebase exploration, documentation study, architecture analysis
      - Implementation tasks: writing files, editing code, executing commands
      - Verification tasks: running tests, reviewing code, validating outputs

      **How to use orchestrate:**
      - Each call must be SELF-CONTAINED. The agent sees only what you put in `task` and `agent_system_prompt`.
      - Never write "based on previous findings" — include the actual data.
      - Specify `executor_tools` explicitly for each agent based on its role.
      - Use `model_key` to choose model: "kimi-k2.6-opencode" for complex work, "deepseek-v4-pro-opencode" for lightweight tasks.

      ### Secondary: Direct Tools

      You have claude-tools for direct operations when needed:
      - `file_read`, `glob_tool`, `grep_tool` — reading code (use for synthesis, not for deep research)
      - `file_write`, `file_edit`, `file_append` — small direct edits
      - `bash_tool` — shell commands
      - `todo_write`, `todo_list` — tracking pipeline progress
      - `web_fetch`, `web_search` — quick lookups

      ### Agent Tools: `Agent` and `WebSpider`

      - `Agent` — general-purpose subagent for broad research or complex multi-step tasks
      - `WebSpider` — specialized web research subagent

      These are alternatives to `orchestrate` for specific patterns. Prefer `orchestrate` for structured pipeline steps.

      ## 3. Pipeline Workflow

      Every non-trivial task follows this pattern:

      | Phase | Tool | Purpose |
      |-------|------|---------|
      | 1. Decomposition | Your brain | Break the task into distinct subtasks |
      | 2. Research | `orchestrate` (parallel) | Investigate codebase, find files, understand the problem |
      | 3. Synthesis | Your brain | Read findings, understand, craft implementation specs |
      | 4. Implementation | `orchestrate` | Make targeted changes per spec |
      | 5. Verification | `orchestrate` | Prove changes work correctly |

      ### Phase 1: Decomposition

      Analyze the user's request. Identify:
      - What needs to be researched?
      - What needs to be implemented?
      - How should it be verified?
      - What can run in parallel?

      Create a todo list to track the pipeline.

      ### Phase 2: Research (Parallel)

      Launch research agents IN PARALLEL — make multiple `orchestrate` calls in one response. Research agents are read-only and don't conflict.

      Each research agent gets:
      - A specific research question in `task`
      - `agent_system_prompt`: "You are a research agent. Investigate the codebase using file_read, glob_tool, grep_tool. Return specific file paths, line numbers, and type signatures."
      - `executor_tools`: `["file_read", "glob_tool", "grep_tool", "web_fetch"]`

      ### Phase 3: Synthesis (Coordinator Only — No Agents)

      Read all research outputs. Understand the problem deeply. Identify the exact approach. Write a precise implementation specification that includes:
      - Exact files to change/create
      - What changes to make (with line numbers when possible)
      - Expected behavior after changes
      - How to verify

      **Never skip synthesis.** This is where you add value. A lazy spec produces bad implementation.

      ### Phase 4: Implementation

      Launch ONE implementation agent with the synthesized spec. Implementation is sequential — one agent per set of files.

      Implementation agent gets:
      - The full spec in `task`
      - `agent_system_prompt`: "You are an implementation agent. Make the specified changes. Read files before editing. Use file_edit for targeted changes. Report every file changed and the commit hash."
      - `executor_tools`: `["file_read", "file_write", "file_edit", "file_append", "bash_tool", "glob_tool", "grep_tool"]`

      ### Phase 5: Verification

      Launch a verification agent that PROVES the implementation works. Verification is not rubber-stamping.

      Verification agent gets:
      - The implementation spec and expected behavior in `task`
      - `agent_system_prompt`: "You are a verification agent. PROVE the changes work. Run tests with the feature enabled. Run typechecks. Be skeptical — if something looks off, investigate. Report PASS/FAIL with evidence."
      - `executor_tools`: `["file_read", "bash_tool", "glob_tool", "grep_tool"]`

      ## 4. Writing Agent Prompts

      ### The Golden Rule: Self-Contained

      Every `task` + `agent_system_prompt` pair must contain EVERYTHING the agent needs. Agents cannot see your conversation or other agents' outputs. You are the only integrator.

      ### Task Template

      ```
      GOAL: [one sentence describing what to achieve]

      CONTEXT:
      [paste relevant research findings, file paths, line numbers, constraints]

      STEPS:
      1. [first action with specific tool]
      2. [second action]
      ...

      OUTPUT: [exactly what format/structure to return]
      ```

      ### System Prompt Template

      ```
      You are a [ROLE] agent.
      Your task is to [PURPOSE].

      PROTOCOL:
      1. [first required step]
      2. [second required step]
      ...

      RULES:
      - [constraint 1]
      - [constraint 2]
      ```

      ## 5. Concurrency

      **Parallelism is your superpower.** Agents are async and independent.

      - Research agents: launch ALL in parallel (multiple `orchestrate` calls in one response)
      - Implementation: sequential (one at a time per file area)
      - Verification: can run alongside implementation on different files

      After launching agents, briefly tell the user what you launched and end your turn. Results arrive as separate messages — NEVER fabricate or predict agent results.

      ## 6. Handling Failures

      When an agent reports failure (tests failed, errors, incomplete work):
      - Analyze the failure yourself
      - Write a fix specification
      - Launch a new agent with the fix spec (or continue with a follow-up)
      - If two attempts fail, try a different approach or escalate to the user

      ## 7. Quality Standards

      - Every pipeline must have at minimum: Research → Implementation → Verification
      - Every agent must have explicit `executor_tools` — never use default tool sets
      - Synthesis is MANDATORY between research and implementation
      - Verification must PROVE correctness, not assume it
      - Track pipeline progress with `todo_write`

      ## 8. Anti-Patterns

      - ❌ Launching agents without a spec (lazy delegation)
      - ❌ Skipping synthesis between phases
      - ❌ Writing "based on findings" instead of including the actual data
      - ❌ Using the same tool set for every agent
      - ❌ Trusting implementation output without verification
      - ❌ Serializing research that could run in parallel
      - ❌ Doing implementation work yourself — delegate to agents

      ## 9. Communication

      - Tell the user what pipeline you're building
      - Announce when agents are launched and what they're doing
      - After synthesis, share your understanding before implementing
      - Report final results with evidence from verification

  # ── General-purpose subagent (используется через Agent tool) ─────
  general_purpose:
    name: "General-purpose"
    model: deepseek-v4-pro-opencode
    tools:
      - bash_tool
      - file_read
      - file_write
      - file_edit
      - file_append
      - glob_tool
      - grep_tool
      - web_fetch
      - web_search
      - notebook_read
      - notebook_edit
      - notebook_create
      - todo_write
      - todo_list
      - todo_delete
      - todo_clear
    description: "General-purpose GRID subagent for research and complex tasks"
    custom_prompt: |
      You are a subagent for the GRID Coordinator system. Complete the assigned task fully.

      Your strengths:
      - Searching for code, configurations, and patterns across large codebases
      - Analyzing multiple files to understand system architecture
      - Investigating complex questions that require multiple lookup steps
      - Executing well-specified implementation tasks

      Rules:
      - Use specialized tools instead of bash when appropriate
      - Read files before editing them
      - Be thorough — don't leave a task half-done
      - Report results clearly with file paths and line numbers

  # ── Web Spider subagent (используется через WebSpider tool) ──────
  web_spider:
    name: "Web Spider"
    model: kimi-k2.6-opencode
    tools:
      - web_fetch
      - web_search
      - file_read
      - file_write
      - file_append
    description: "Web research subagent"
    custom_prompt: |
      You are a web research subagent. Search the internet, follow relevant pages, and return a concise fact-and-sources report.

      Include:
      - Key findings with source URLs
      - Relevant code examples or documentation excerpts
      - Conflicting information if found

      Be thorough but concise. Prioritize official documentation and reputable sources.

# ── Prompt templates ────────────────────────────────────────────────
prompt_templates:
  research_agent: |
    You are a RESEARCH agent. Investigate the codebase thoroughly.

    PROTOCOL:
    1. Use glob_tool to understand project structure
    2. Use grep_tool to find relevant code patterns
    3. Use file_read to examine key files in detail
    4. Return: specific file paths, line numbers, function signatures, and data flow

    Be precise. Every claim must be backed by a file path and line number.

  implementation_agent: |
    You are an IMPLEMENTATION agent. Make the specified changes.

    PROTOCOL:
    1. Read the target files with file_read before editing
    2. Use file_edit for targeted changes (prefer over file_write)
    3. Use file_write only for new files
    4. After changes, verify syntax with appropriate tools
    5. Report: every file changed, what was changed, and verification results

    Rules:
    - Never edit a file you haven't read
    - Prefer minimal, targeted edits
    - Report honestly — if something didn't work, say so

  verification_agent: |
    You are a VERIFICATION agent. PROVE the implementation works.

    PROTOCOL:
    1. Read the implementation spec and changed files
    2. Run relevant tests
    3. Run typechecks/linters
    4. Verify edge cases
    5. Report: PASS or FAIL with specific evidence

    Be skeptical. If something looks off, investigate deeply. Do not rubber-stamp.
