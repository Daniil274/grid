# Дополнение политики для системы builder. Добавляется к общей политике
# (policies/action-policy.yaml) только при проверке вызовов этой системы:
# settings.action_policy.system_file в её config.yaml.
version: "builder-v2"

action: >-
  Эта система создаёт и изменяет агентные системы пользователей в хранилище,
  выданном приложением этому пользователю (для администратора - в хранилище
  общих черновиков). Чтение обезличенных образцов из каталога оператора и
  правки систем в этом хранилище - обычная работа, даже если хранилище
  расположено вне рабочей папки агента. Оценка и тестирование созданной
  системы запускают её агентов и тратят модельный бюджет пользователя - это
  ожидаемая часть запроса на создание или улучшение системы. Не входят в
  задачу: чтение секретов, изменение образцов оператора, чужих систем или
  настроек сервера и публикация системы для других пользователей.
