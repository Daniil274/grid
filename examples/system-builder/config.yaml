settings:
  default_agent: builder
  max_history: 100
  max_turns: 200
  agent_timeout: 7200
  mcp_enabled: true
  max_tool_output_tokens: 16000
  working_directory: .
  allow_path_override: true
  action_policy:
    system_file: action-policy.yaml
  agent_logging:
    enabled: true
    level: full
    save_prompts: true
    save_conversations: true
    save_executions: true
  debug: true
isolation:
  enabled: true
compact:
  enabled: true
  summary_max_output_tokens: 4000
  auto:
    enabled: true
    max_output_tokens_for_summary: 4000
    buffer_tokens: 12000
    max_consecutive_failures: 3
  micro:
    enabled: true
    preserve_last_n: 4
    compactable_tools:
      - builder_catalog
      - builder_tool_set
      - builder_read
      - builder_check
providers_file: ../../catalog/providers.yaml
models_file: ../../catalog/models.yaml

providers:
  use: [kimi-code, opencode, openrouter]
  refine:
    openrouter:
      max_retries: 2

models:
  use:
    - deepseek-flash-latest
    - muse-spark-1.3-contributor
    - glm-latest
    - gpt-6.1-sol
    - deepseek-v4-pro
  refine:
    kimi-k3.1-pro:
      reasoning:
        effort: high

tools:
  builder_compare:
    type: function
  builder_evaluate:
    type: function
  builder_fork:
    type: function
  builder_catalog:
    type: function
  builder_tool_set:
    type: function
  builder_read:
    type: function
  builder_check:
    type: function
  builder_create:
    type: function
  builder_write:
    type: function
  builder_write_files:
    type: function
  builder_delete:
    type: function
  builder_describe:
    type: function
  builder_test_tools:
    type: function
agents:
  builder:
    name: System builder
    model:
      - gpt-6.1-sol
      - deepseek-v4-pro
    description: >-
      Creates new Grid systems for this server from a description of what they
      should do: designs their agents, writes their configs, prompts and skills,
      writes new tools for them as tested tool packages, and leaves them as drafts
      for their owner to try and activate. Also changes drafts. Not for using a
      system, only for making or changing one.
    tools:
      - builder_compare
      - builder_evaluate
      - builder_fork
      - builder_catalog
      - builder_tool_set
      - builder_read
      - builder_check
      - builder_create
      - builder_write
      - builder_write_files
      - builder_delete
      - builder_describe
      - builder_test_tools
    system_skills: [building, quality]
    custom_prompt: |
      Ты — конструктор систем Grid на этом сервере. По описанию пользователя ты
      создаёшь новую систему: проектируешь её агентов, пишешь её config.yaml с нуля,
      промпты и навыки, а когда готовых инструментов не хватает — пишешь новые
      инструменты как пакеты инструментов с тестами. Результат — черновик, который
      владелец проверит на странице Systems. builder_catalog.shared показывает,
      создаёшь ли ты общую систему администратора или личную систему пользователя.
      Личную систему видит только владелец, который может включить её для своего
      роутера. Общую систему публикует администратор. Сам статус не меняй.

      Порядок работы, контракты ролей и проверки описаны в навыках building и
      quality — следуй им. Ключевое:

      - начни с builder_catalog и прочитай близкую систему из каталога как образец;
        если shared: false, соблюдай private_rules из каталога;
      - новые инструменты оформляй в пакетах инструментов (tools/<package>/) как
        функции @function_tool и объявляй каждую нужную функцию в tools как
        type: function с tool_package: tools/<package>, выдавая каждому агенту
        только нужные ему функции;
      - пиши файлы черновика одним вызовом builder_write_files — навыки, README,
        модули пакетов инструментов с тестами, quality.yaml — вместо серии
        builder_write; каждый новый инструмент с тестами, и builder_test_tools
        должен пройти;
      - до реализации представь пользователю проект системы и остановись: исходный
        запрос на создание системы не является утверждением ещё не показанного
        проекта. До явного утверждения пользователем разрешены каталог и чтение,
        но не создание, изменение или форк системы;
      - существенные изменения согласованных возможностей, ролей, зависимостей
        или критериев приёмки снова согласуй до реализации;
      - для изменения активной системы используй builder_fork;
      - после конфигурационных проверок запусти builder_evaluate; провалы
        исправляй по причине и не ослабляй ожидаемый результат; максимум три
        цикла исправления и повторной оценки;

      В конце кратко перечисли владельцу: ключ черновика, агентов, инструменты
      (готовые и новые), результаты проверки и тестов, чего не хватает машине,
      и что владельцу сделать дальше (открыть /systems, попробовать, включить для
      своего роутера; общую систему администратор может опубликовать). Техническая
      готовность не заменяет пользовательскую приёмку: покажи результаты
      согласованных сценариев и ограничения, затем запроси приёмку.

      Пиши по-русски, если пользователь пишет по-русски.
    mcp_enabled: true
    parallel_tool_calls: true
