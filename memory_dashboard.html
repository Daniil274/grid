<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Dashboard</title>
    <style>
        :root {
            --primary: #6366f1;
            --primary-light: #818cf8;
            --success: #10b981;
            --warning: #f59e0b;
            --error: #ef4444;
            --bg: #0f172a;
            --bg2: #1e293b;
            --bg3: #334155;
            --card: #1e293b;
            --text: #e2e8f0;
            --text2: #94a3b8;
            --border: #334155;
            --shadow: 0 4px 6px -1px rgba(0,0,0,.3);
            --radius: 8px;
        }
        [data-theme="light"] {
            --bg: #f1f5f9;
            --bg2: #e2e8f0;
            --bg3: #cbd5e1;
            --card: #ffffff;
            --text: #1e293b;
            --text2: #64748b;
            --border: #cbd5e1;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); line-height: 1.5; }
        .app { display: flex; height: 100vh; }

        .sidebar {
            width: 260px; min-width: 260px; background: var(--bg2); border-right: 1px solid var(--border);
            display: flex; flex-direction: column; padding: 16px;
        }
        .sidebar h1 { font-size: 18px; font-weight: 700; margin-bottom: 4px; color: var(--primary-light); }
        .sidebar .subtitle { font-size: 12px; color: var(--text2); margin-bottom: 16px; }
        .nav-btn {
            display: flex; align-items: center; gap: 10px; padding: 10px 14px; border: none;
            background: transparent; color: var(--text); font-size: 14px; border-radius: var(--radius);
            cursor: pointer; text-align: left; width: 100%; transition: all .15s; margin-bottom: 4px;
        }
        .nav-btn:hover { background: var(--bg3); }
        .nav-btn.active { background: var(--primary); color: #fff; }
        .nav-btn .icon { font-size: 18px; width: 24px; text-align: center; }
        .sidebar-footer { margin-top: auto; padding-top: 16px; border-top: 1px solid var(--border); }
        .sidebar select {
            width: 100%; padding: 8px 12px; background: var(--bg3); border: 1px solid var(--border);
            color: var(--text); border-radius: var(--radius); font-size: 13px; margin-bottom: 10px;
        }
        .btn-refresh {
            width: 100%; padding: 8px; border: 1px solid var(--border); background: var(--bg3);
            color: var(--text); border-radius: var(--radius); cursor: pointer; font-size: 13px;
            margin-top: 6px; transition: all .15s;
        }
        .btn-refresh:hover { background: var(--primary); color: #fff; border-color: var(--primary); }
        label { font-size: 12px; color: var(--text2); display: flex; align-items: center; gap: 8px; cursor: pointer; margin-top: 10px; }
        .toggle { position: relative; width: 36px; height: 20px; }
        .toggle input { display: none; }
        .toggle-slider {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: var(--bg3);
            border-radius: 10px; cursor: pointer; transition: .2s;
        }
        .toggle-slider::before {
            content: ''; position: absolute; width: 16px; height: 16px; left: 2px; bottom: 2px;
            background: var(--text); border-radius: 50%; transition: .2s;
        }
        .toggle input:checked + .toggle-slider { background: var(--primary); }
        .toggle input:checked + .toggle-slider::before { transform: translateX(16px); }

        .main { flex: 1; overflow-y: auto; padding: 24px; }
        .panel { display: none; }
        .panel.active { display: block; }

        .stats-bar { display: flex; gap: 16px; margin-bottom: 24px; flex-wrap: wrap; }
        .stat-card {
            background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
            padding: 16px 20px; flex: 1; min-width: 120px; box-shadow: var(--shadow);
        }
        .stat-card .label { font-size: 12px; color: var(--text2); text-transform: uppercase; letter-spacing: .5px; }
        .stat-card .value { font-size: 24px; font-weight: 700; margin-top: 4px; }
        .stat-card .value.primary { color: var(--primary-light); }

        .entry {
            background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
            padding: 16px; margin-bottom: 12px; box-shadow: var(--shadow);
        }
        .entry:hover { border-color: var(--primary); }
        .entry-header { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; flex-wrap: wrap; }
        .entry-type {
            padding: 3px 10px; border-radius: 12px; font-size: 11px; font-weight: 600;
        }
        .type-user { background: #3b82f622; color: #60a5fa; }
        .type-assistant { background: #10b98122; color: #34d399; }
        .type-system { background: #64748b22; color: #94a3b8; }
        .type-long_term { background: #6366f122; color: #818cf8; }
        .type-short_term { background: #f59e0b22; color: #fbbf24; }
        .type-task { background: #8b5cf622; color: #a78bfa; }
        .type-task_plan { background: #ec489922; color: #f472b6; }
        .type-skill { background: #10b98122; color: #34d399; }
        .entry-time { font-size: 11px; color: var(--text2); margin-left: auto; }
        .entry-content {
            font-size: 13px; line-height: 1.6; white-space: pre-wrap; word-break: break-word;
            max-height: 200px; overflow-y: auto; background: var(--bg); padding: 12px;
            border-radius: 6px; border: 1px solid var(--border); font-family: monospace;
        }
        .entry-content.expanded { max-height: none; }
        .btn-expand { margin-top: 6px; background: none; border: none; color: var(--primary-light); cursor: pointer; font-size: 12px; }
        .empty-state { text-align: center; padding: 60px 20px; color: var(--text2); }
        .empty-state .icon { font-size: 48px; margin-bottom: 12px; }
        .empty-state h3 { font-size: 18px; margin-bottom: 8px; color: var(--text); }
        .error-msg { background: #ef444422; color: #f87171; padding: 12px; border-radius: var(--radius); margin-bottom: 12px; }
        .context-tabs { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
        .context-tab { padding: 6px 14px; background: var(--bg3); border: 1px solid var(--border); color: var(--text); border-radius: var(--radius); cursor: pointer; font-size: 13px; }
        .context-tab:hover { border-color: var(--primary); }
        .context-tab.active { background: var(--primary); color: #fff; border-color: var(--primary); }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: var(--bg3); border-radius: 4px; }
    </style>
</head>
<body>
    <div class="app">
        <aside class="sidebar">
            <h1>Memory Dashboard</h1>
            <div class="subtitle">Просмотр контекста и долгосрочной памяти</div>
            <label>Пользователь</label>
            <select id="user-select">
                <option value="">— загрузка —</option>
            </select>
            <nav>
                <button class="nav-btn active" type="button" onclick="switchPanel('context')">
                    <span class="icon">&#x1f4dd;</span> Контекст
                </button>
                <button class="nav-btn" type="button" onclick="switchPanel('memory')">
                    <span class="icon">&#x1f4be;</span> Долгосрочная память
                </button>
                <button class="nav-btn" type="button" onclick="switchPanel('beads')">
                    <span class="icon">&#x1f4c1;</span> Beads
                </button>
            </nav>
            <div class="sidebar-footer">
                <button class="btn-refresh" type="button" onclick="loadData()">Обновить</button>
                <label>
                    <span class="toggle">
                        <input type="checkbox" id="theme-toggle" onchange="toggleTheme()">
                        <span class="toggle-slider"></span>
                    </span>
                    Светлая тема
                </label>
            </div>
        </aside>
        <main class="main">
            <div class="panel active" id="panel-context">
                <h2 style="font-size:22px;margin-bottom:16px;">Контекст (диалог)</h2>
                <div id="context-stats" class="stats-bar"></div>
                <div class="context-tabs" id="context-tabs"></div>
                <div id="context-entries"></div>
            </div>
            <div class="panel" id="panel-memory">
                <h2 style="font-size:22px;margin-bottom:16px;">Долгосрочная память (SQLite)</h2>
                <div id="memory-stats" class="stats-bar"></div>
                <div id="memory-entries"></div>
            </div>
            <div class="panel" id="panel-beads">
                <h2 style="font-size:22px;margin-bottom:16px;">Beads (задачи)</h2>
                <div id="beads-stats" class="stats-bar"></div>
                <div id="beads-error" class="error-msg" style="display:none;"></div>
                <h3 style="font-size:16px;margin:16px 0 8px;color:var(--text2);">Готовые к работе (ready)</h3>
                <div id="beads-ready"></div>
                <h3 style="font-size:16px;margin:16px 0 8px;color:var(--text2);">Все задачи (list)</h3>
                <div id="beads-list"></div>
            </div>
        </main>
    </div>
    <script>
        var currentUserId = '';
        var contextData = null;
        var memoryData = null;
        var beadsData = null;

        function esc(s) {
            if ( s == null ) return '';
            return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }

        function switchPanel(name) {
            document.querySelectorAll('.panel').forEach(function(p) { p.classList.remove('active'); });
            document.querySelectorAll('.nav-btn').forEach(function(b) { b.classList.remove('active'); });
            document.getElementById('panel-' + name).classList.add('active');
            event.currentTarget.classList.add('active');
            if (name === 'memory') renderMemory();
            if (name === 'beads') renderBeads();
        }

        function toggleTheme() {
            document.body.setAttribute('data-theme', document.getElementById('theme-toggle').checked ? 'light' : '');
        }

        function loadUsers(cb) {
            fetch('/api/users')
                .then(function(r) { return r.json(); })
                .then(function(list) {
                    var sel = document.getElementById('user-select');
                    sel.innerHTML = '<option value="">— выберите —</option>';
                    list.forEach(function(id) {
                        var opt = document.createElement('option');
                        opt.value = id;
                        opt.textContent = 'user_' + id;
                        sel.appendChild(opt);
                    });
                    if (list.length && !currentUserId) currentUserId = list[0];
                    if (currentUserId) sel.value = currentUserId;
                    if (cb) cb();
                })
                .catch(function() {
                    document.getElementById('user-select').innerHTML = '<option value="">ошибка загрузки</option>';
                });
        }

        function loadData() {
            currentUserId = document.getElementById('user-select').value;
            if (!currentUserId) {
                document.getElementById('context-entries').innerHTML = '<div class="empty-state"><p>Выберите пользователя</p></div>';
                document.getElementById('memory-entries').innerHTML = '<div class="empty-state"><p>Выберите пользователя</p></div>';
                return;
            }
            fetch('/api/context?user_id=' + encodeURIComponent(currentUserId))
                .then(function(r) { return r.json(); })
                .then(function(data) {
                    contextData = data;
                    renderContext();
                })
                .catch(function(e) {
                    contextData = { error: e.message };
                    renderContext();
                });
            fetch('/api/memory?user_id=' + encodeURIComponent(currentUserId))
                .then(function(r) { return r.json(); })
                .then(function(data) {
                    memoryData = data;
                    renderMemory();
                })
                .catch(function(e) {
                    memoryData = { error: e.message };
                    renderMemory();
                });
            fetch('/api/beads?user_id=' + encodeURIComponent(currentUserId))
                .then(function(r) { return r.json(); })
                .then(function(data) {
                    beadsData = data;
                    renderBeads();
                })
                .catch(function(e) {
                    beadsData = { error: e.message };
                    renderBeads();
                });
        }

        function renderContext() {
            var statsEl = document.getElementById('context-stats');
            var tabsEl = document.getElementById('context-tabs');
            var entriesEl = document.getElementById('context-entries');
            if (!contextData) {
                entriesEl.innerHTML = '<div class="empty-state"><p>Загрузка...</p></div>';
                return;
            }
            if (contextData.error) {
                statsEl.innerHTML = '';
                tabsEl.innerHTML = '';
                entriesEl.innerHTML = '<div class="error-msg">' + esc(contextData.error) + '</div>';
                return;
            }
            var contexts = contextData.contexts || {};
            var ids = contextData.context_ids || [];
            var activeId = contextData.active_context_id;
            var totalMsg = 0;
            ids.forEach(function(cid) {
                totalMsg += (contexts[cid].conversation || []).length;
            });
            statsEl.innerHTML =
                '<div class="stat-card"><div class="label">Контекстов</div><div class="value primary">' + ids.length + '</div></div>' +
                '<div class="stat-card"><div class="label">Сообщений</div><div class="value primary">' + totalMsg + '</div></div>' +
                '<div class="stat-card"><div class="label">Активный</div><div class="value">' + esc(activeId || '—') + '</div></div>';
            tabsEl.innerHTML = ids.map(function(cid) {
                var n = (contexts[cid].conversation || []).length;
                return '<button type="button" class="context-tab' + (cid === activeId ? ' active' : '') + '" data-cid="' + esc(cid) + '">' + esc(cid) + ' (' + n + ')</button>';
            }).join('');
            tabsEl.querySelectorAll('.context-tab').forEach(function(btn) {
                btn.onclick = function() {
                    tabsEl.querySelectorAll('.context-tab').forEach(function(b) { b.classList.remove('active'); });
                    btn.classList.add('active');
                    renderContextMessages(btn.getAttribute('data-cid'));
                };
            });
            renderContextMessages(activeId || ids[0]);
        }

        function renderContextMessages(contextId) {
            var entriesEl = document.getElementById('context-entries');
            if (!contextData || !contextData.contexts) return;
            var bucket = contextData.contexts[contextId];
            if (!bucket) {
                entriesEl.innerHTML = '<div class="empty-state"><p>Нет данных по контексту</p></div>';
                return;
            }
            var conv = bucket.conversation || [];
            if (conv.length === 0) {
                entriesEl.innerHTML = '<div class="empty-state"><div class="icon">&#x1f4dd;</div><h3>Нет сообщений</h3><p>Диалог пуст для этого контекста.</p></div>';
                return;
            }
            entriesEl.innerHTML = conv.map(function(msg, idx) {
                var role = msg.role || 'user';
                var content = typeof msg.content === 'string' ? msg.content : JSON.stringify(msg.content);
                var time = msg.timestamp || '';
                var typeClass = 'type-' + role;
                var short = content.length > 400;
                var id = 'ctx-msg-' + contextId + '-' + idx;
                return '<div class="entry">' +
                    '<div class="entry-header">' +
                    '<span class="entry-type ' + typeClass + '">' + esc(role) + '</span>' +
                    '<span class="entry-time">' + esc(time) + '</span>' +
                    '</div>' +
                    '<div class="entry-content' + (short ? '' : '') + '" id="' + id + '">' + esc(content) + '</div>' +
                    (short ? '<button class="btn-expand" type="button" onclick="toggleExpand(\'' + id + '\', this)">Показать больше</button>' : '') +
                    '</div>';
            }).join('');
        }

        function renderMemory() {
            var statsEl = document.getElementById('memory-stats');
            var entriesEl = document.getElementById('memory-entries');
            if (!memoryData) {
                entriesEl.innerHTML = '<div class="empty-state"><p>Загрузка...</p></div>';
                return;
            }
            if (memoryData.error) {
                statsEl.innerHTML = '';
                entriesEl.innerHTML = '<div class="error-msg">' + esc(memoryData.error) + '</div>';
                return;
            }
            var entries = memoryData.entries || [];
            var byType = {};
            entries.forEach(function(e) {
                byType[e.type] = (byType[e.type] || 0) + 1;
            });
            statsEl.innerHTML =
                '<div class="stat-card"><div class="label">Записей</div><div class="value primary">' + entries.length + '</div></div>' +
                Object.keys(byType).map(function(t) {
                    return '<div class="stat-card"><div class="label">' + esc(t) + '</div><div class="value">' + byType[t] + '</div></div>';
                }).join('');
            if (entries.length === 0) {
                entriesEl.innerHTML = '<div class="empty-state"><div class="icon">&#x1f4be;</div><h3>Нет записей</h3><p>memory.db пуста или не найдена.</p></div>';
                return;
            }
            window._memFull = {};
            entriesEl.innerHTML = entries.map(function(e, idx) {
                var typeClass = 'type-' + (e.type || 'long_term');
                var full = e.content || '';
                window._memFull[idx] = full;
                var content = full.length > 500 ? full.substring(0, 500) + '...' : full;
                var id = 'mem-' + idx;
                var showMore = full.length > 500;
                return '<div class="entry">' +
                    '<div class="entry-header">' +
                    '<span class="entry-type ' + typeClass + '">' + esc(e.type) + '</span>' +
                    '<span class="entry-time">' + esc(e.created_at) + '</span>' +
                    (e.importance != null ? '<span style="font-size:11px;color:var(--text2);">importance: ' + e.importance + '</span>' : '') +
                    '</div>' +
                    (e.tags ? '<div style="font-size:11px;color:var(--text2);margin-bottom:6px;">' + esc(e.tags) + '</div>' : '') +
                    '<div class="entry-content" id="' + id + '" data-idx="' + idx + '">' + esc(content) + '</div>' +
                    (showMore ? '<button class="btn-expand" type="button" onclick="toggleExpandMem(\'' + id + '\', this)">Показать больше</button>' : '') +
                    '</div>';
            }).join('');
        }

        function toggleExpand(id, btn) {
            var el = document.getElementById(id);
            if (!el) return;
            el.classList.toggle('expanded');
            el.style.maxHeight = el.classList.contains('expanded') ? 'none' : '200px';
            btn.textContent = el.classList.contains('expanded') ? 'Свернуть' : 'Показать больше';
        }

        function beadsToItems(val) {
            if (val == null) return [];
            if (Array.isArray(val)) return val;
            if (val && typeof val === 'object' && Array.isArray(val.items)) return val.items;
            if (val && typeof val === 'object' && Array.isArray(val.beads)) return val.beads;
            return [];
        }

        function renderBeads() {
            var statsEl = document.getElementById('beads-stats');
            var errEl = document.getElementById('beads-error');
            var readyEl = document.getElementById('beads-ready');
            var listEl = document.getElementById('beads-list');
            if (!beadsData) {
                readyEl.innerHTML = '<div class="empty-state"><p>Загрузка...</p></div>';
                listEl.innerHTML = '';
                errEl.style.display = 'none';
                return;
            }
            if (beadsData.error) {
                errEl.textContent = beadsData.error;
                errEl.style.display = 'block';
                statsEl.innerHTML = '';
                readyEl.innerHTML = '<div class="empty-state"><p>Beads не инициализированы или bd недоступен.</p></div>';
                listEl.innerHTML = '';
                return;
            }
            errEl.style.display = 'none';
            var readyItems = beadsToItems(beadsData.ready);
            var listItems = beadsToItems(beadsData.list);
            statsEl.innerHTML =
                '<div class="stat-card"><div class="label">Готовые</div><div class="value primary">' + readyItems.length + '</div></div>' +
                '<div class="stat-card"><div class="label">Всего</div><div class="value">' + listItems.length + '</div></div>';
            readyEl.innerHTML = renderBeadsEntries(readyItems);
            listEl.innerHTML = renderBeadsEntries(listItems);
        }

        function renderBeadsEntries(items) {
            if (!items || items.length === 0) {
                return '<div class="empty-state"><p>Нет записей</p></div>';
            }
            return items.map(function(b) {
                var id = b.id || b.bead_id || b.bid || '';
                var title = b.title || b.name || b.summary || (typeof b === 'string' ? b : '');
                var status = b.status || '';
                var type = b.type || '';
                var desc = (b.description || b.body || '').substring(0, 300);
                if (desc.length === 300) desc += '...';
                return '<div class="entry">' +
                    '<div class="entry-header">' +
                    '<span class="entry-type type-task">' + esc(id || '—') + '</span>' +
                    (status ? '<span class="entry-type" style="background:#334155;color:#94a3b8;">' + esc(status) + '</span>' : '') +
                    (type ? '<span class="entry-type" style="background:#6366f122;color:#818cf8;">' + esc(type) + '</span>' : '') +
                    '<span class="entry-time">' + esc(b.updated_at || b.updated || b.created_at || '') + '</span>' +
                    '</div>' +
                    '<div style="font-weight:600;margin-bottom:6px;">' + esc(title) + '</div>' +
                    (desc ? '<div class="entry-content" style="max-height:120px;">' + esc(desc) + '</div>' : '') +
                    '</div>';
            }).join('');
        }

        function toggleExpandMem(id, btn) {
            var el = document.getElementById(id);
            if (!el || !window._memFull) return;
            var idx = parseInt(el.getAttribute('data-idx'), 10);
            var full = window._memFull[idx];
            if (full == null) return;
            if (el.classList.contains('expanded')) {
                el.textContent = full.length > 500 ? full.substring(0, 500) + '...' : full;
                el.classList.remove('expanded');
                el.style.maxHeight = '200px';
                btn.textContent = 'Показать больше';
            } else {
                el.textContent = full;
                el.classList.add('expanded');
                el.style.maxHeight = 'none';
                btn.textContent = 'Свернуть';
            }
        }

        document.getElementById('user-select').onchange = function() {
            currentUserId = this.value;
            loadData();
        };

        window.addEventListener('DOMContentLoaded', function() {
            loadUsers(function() {
                if (currentUserId) loadData();
            });
        });
    </script>
</body>
</html>
