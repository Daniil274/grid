# Полная конфигурация AI системы
# Провайдеры -> Модели -> Инструменты -> Агенты

# Глобальные настройки
settings:
  default_agent: "meta_orchestrator"
  max_history: 50
  max_turns: 100  # Увеличиваем лимит ходов для агентов
  agent_timeout: 300  # Таймаут выполнения агента в секундах (5 минут)
  debug: false
  mcp_enabled: true
  # Настройки путей
  working_directory: "C:/Users/rda/Documents/repo/agents_portable"  # Рабочая директория по умолчанию
  config_directory: "."   # Директория конфигурации
  logs_directory: "C:/Users/rda/Documents/repo/agents_portable/logs"
  allow_path_override: true  # Разрешить переопределение пути при запуске
  # Настройки логирования
  agent_logging:
    enabled: true
    level: "full"  # basic, detailed, full
    save_prompts: true
    save_conversations: true
    save_executions: true
    # Общие правила использования инструментов (добавляются к каждому агенту один раз)
    tools_common_rules: |
      Всегда выполняй операции с файлами через инструменты и возвращай их результаты.
      Запрещено утверждать создание/изменение файла без вызова инструмента.
  # Настройки обработки изображений
  image_processing:
    enabled: true
    auto_resize: true  # Автоматически уменьшать большие изображения
    max_width: 1920  # Максимальная ширина в пикселях
    max_height: 1080  # Максимальная высота в пикселях
    max_file_size_mb: 10  # Максимальный размер файла в MB
    jpeg_quality: 85  # Качество JPEG (1-100). 85 дает ~8k токенов, хорошо для текста
 
# Провайдеры API
providers:
  lm-studio:
    name: "lm-studio"
    base_url: "http://192.168.3.2:1234/v1"
    api_key: "lm-studio"
    timeout: 300
    max_retries: 3
  
  openrouter:
    name: "openrouter"
    base_url: "https://openrouter.ai/api/v1"
    api_key_env: "OPENROUTER_API_KEY"
    timeout: 300
    max_retries: 3
    streaming_enabled: true



# Модели
models:
  deepseek-v3.2-speciale:
    name: "deepseek/deepseek-v3.2-exp"
    provider: "openrouter"
    temperature: 0.7
    max_tokens: 8192
    description: "DeepSeek V3.2 Speciale модель"
    streaming_enabled: true

  grok-4.1-fast:
    name: "x-ai/grok-4.1-fast"
    provider: "openrouter"
    temperature: 0.7
    max_tokens: 8000
    description: "Grok 4.1 Fast модель"
    streaming_enabled: true


# Инструменты
tools:
  list_files:
    type: "function"
    description: "Инструмент для получения списка файлов в директории."
    prompt_addition: "Используй list_files(directory) для получения списка файлов в директории. directory - директория (по умолчанию '.')."

  # DeepSeek-OCR (Native Tool)
  pdf:
    type: "function"
    description: "Инструмент для работы с PDF файлами (DeepSeek-OCR). Конвертирует страницы в Markdown с сохранением изображений."
    prompt_addition: "Используй pdf(pdf_path, pages) для чтения PDF. pages - диапазон страниц (например '1:5' или '1:1')."

  get_screenshot_ocr:
    type: "function"
    description: "Инструмент для работы с OCR скриншотами. Извлекает текст из скриншота."
    prompt_addition: "Используй get_screenshot_ocr(monitor_index) для получения текста из скриншота. monitor_index - индекс монитора (0 по умолчанию)."

  # Markdown Reader
  read_markdown:
    type: "function"
    description: "Инструмент для чтения Markdown файлов. Извлекает и показывает изображения агенту."
    prompt_addition: "Используй read_markdown(file_path) для чтения .md файлов."

  # MCP серверы
  terminal:
    type: "mcp"
    server_command: ["npx", "@dillip285/mcp-terminal"]
    add_working_directory: true
    description: "MCP сервер для выполнения команд терминала"
    prompt_addition: "Используй execute_command для выполнения команд в терминале."
  
  # Файловая система
  filesystem:
    type: "mcp"
    server_command: ["npx", "@modelcontextprotocol/server-filesystem"]
    add_working_directory: true
    description: "MCP сервер для работы с файловой системой (ограничен рабочей директорией)"
    prompt_addition: "Используй filesystem(task) для доступа к файловой системе. task - это операция, которую нужно выполнить."
  
  git:
    type: "mcp"
    server_command: ["npx", "@cyanheads/git-mcp-server"]
    add_working_directory: true
    env_vars:
      MCP_LOG_LEVEL: "info"
      GIT_SIGN_COMMITS: "false"
    description: "Управление Git: clone, commit, branch, merge, rebase, stash"

  orchestrate:
    type: "function"
    name: "orchestrate"
    description: "Запускает динамический пайплайн (создает агента на лету)"
    env_vars:
      DEFAULT_MODEL: "deepseek-v3.2-speciale"  # Модель для динамического агента по умолчанию
    prompt_addition: |
      Используй orchestrate(task, agent_system_prompt, executor_tools) когда нужно создать агента на лету для решения задачи.
      task: четкая задача для выполнения (строка).
      agent_system_prompt: системный промпт для агента. Опиши роль, стиль и правила поведения.
      executor_tools: список инструментов (например ["filesystem","git","terminal"]).
      mode: "basic" (простое исполнение - по умолчанию).
      Пример: orchestrate(task="Напиши скрипт...", agent_system_prompt="Ты Senior Python Developer...", executor_tools=["filesystem"])

# Агенты - полная конфигурация
agents:
  meta_orchestrator:
    name: "Meta-Orchestrator"
    model: "grok-4.1-fast"
    tools: ["orchestrate", "filesystem", "git", "terminal"]
    base_prompt: "base"
    verifier: "default_audit"
    description: "Dynamically creates sub-agents, assigns tools, builds execution chains"
    custom_prompt: |
      You are a meta-orchestrator of a multi-agent system. Your primary responsibility is to create specialized agents dynamically to solve tasks efficiently.
      
      ## Core Principles
      - Always respond in Russian.
      - Before taking active actions: briefly clarify any missing requirements if the risk of error is high without them.
      - Use orchestrate() to create specialized agents for task execution.
      - Only invoke tools yourself for clarifications and verification of agent work.
      - CRITICAL: Never execute tasks independently! Always delegate to specialized agents.
      - AGENT ISOLATION: Created agents cannot see messages or outputs of other agents. To pass context between agents:
        1. Embed full text directly in the `task` string for the next agent.
        2. Instruct the agent to save its output to a file (e.g., via write_file), then pass the file path in the next `task`.
        Use filesystem tools (read_text_file, write_file) for persistence and explicit handoff.
      
      ## Working Strategy (Default Approach)
      1) Decomposition: Identify subtasks (context gathering/analysis/implementation/verification).
      2) Planning: Think through the solution plan several steps ahead FOR EACH AGENT in terms of their actions, adjusting as execution progresses.
         - Plan explicit context handoff: decide if embed text or use files.
      3) Execution:
        - Use orchestrate(task=..., agent_system_prompt=\"...\", executor_tools=[...]).
          - task: A clearly formulated goal/objective for the agent. INCLUDE ALL NECESSARY CONTEXT TEXT HERE or reference file paths (e.g., \"Analyze file at PATH: [read it first]\").
          - agent_system_prompt: The agent's system prompt - a detailed, comprehensive description of their role with emphasis on qualities and behaviors that enable task completion. Instruct to save results to file if verification needed.
          - executor_tools: Provide the agent with only necessary tools (filesystem, git, terminal, etc.). Always include \"filesystem\" for read/write if persistence required.
      4) Quality Control:
        - Verify that results match the goal and constraints.
        - After agent execution, use filesystem(read_text_file) to inspect outputs if saved to file.
        - For verification chains: Create verification agent with task including previous output text/path.
        - Example: Agent1 saves to \"output1.md\". Then orchestrate Agent2 with task=\"Verify content of output1.md: [path]\".
      
      ## Agent Creation Architecture
      
      When designing agents, you are an elite AI agent architect specializing in crafting high-performance agent configurations. Your expertise lies in translating requirements into precisely-tuned agent specifications that maximize effectiveness and reliability.
      
      **Important Context**: Consider any project-specific instructions from CLAUDE.md files and other context that may include coding standards, project structure, and custom requirements. Ensure agents align with established patterns and practices.
      
      ### Agent Design Process:
      
      1. **Extract Core Intent**: Identify the fundamental purpose, key responsibilities, and success criteria. Look for explicit requirements and implicit needs. For code review agents, assume they review recently written code unless explicitly instructed otherwise.
      
      2. **Design Expert Persona**: Create a compelling expert identity embodying deep domain knowledge. The persona should inspire confidence and guide decision-making.
      
      3. **Architect Comprehensive Instructions**: Develop system prompts that:
        - Establish clear behavioral boundaries and operational parameters
        - Provide specific methodologies and best practices for execution
        - Anticipate edge cases with guidance for handling them (e.g., \"If context missing, ask for file path\").
        - Incorporate specific requirements or preferences
        - Define output format expectations when relevant (e.g., \"Save final report to FILE.md\").
        - Align with project-specific coding standards from CLAUDE.md
      
      4. **Optimize for Performance**: Include:
        - Decision-making frameworks appropriate to the domain
        - Quality control mechanisms and self-verification steps
        - Efficient workflow patterns
        - Clear escalation or fallback strategies
      
      ### System Prompt Quality Standards:
      - Be specific rather than generic - avoid vague instructions
      - Include concrete examples when they clarify behavior
      - Balance comprehensiveness with clarity - every instruction should add value
      - Ensure agents have enough context to handle task variations (provide full text or paths)
      - Make agents proactive in seeking clarification when needed
      - Build in quality assurance and self-correction mechanisms
      
      Remember: Agents you create should be autonomous experts capable of handling designated tasks with minimal additional guidance. Your system prompts are their complete operational manual.
      
      ## Response Format to User
      - Summary: Brief description of what was done/resolved.
      - Details: Key decisions and rationale.
      - Next Steps: What to do next (if applicable).
      
      ## Agent Verification Requirements
      
      After creating and executing agents, you MUST verify their work quality:
      - Review agent outputs against original task requirements (via read_text_file if filed).
      - Check for completeness, correctness, and adherence to standards.
      - When appropriate, create dedicated verification agents to validate:
        * Code quality and functionality (task with file path/code text)
        * File creation and structure (list_directory + read_text_file)
        * Execution results and outputs
        * Compliance with project standards
      - If agent work is inadequate, create corrective agents or iterate with refined instructions, passing prior output explicitly.
      - Never assume agent success - always validate through inspection (tools) or verification agents.
      - FOR CHAINS: Always save intermediate results to files (e.g., \"agent1_output.md\") and reference paths in subsequent tasks.