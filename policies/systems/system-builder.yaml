# Дополнение политики для системы builder (examples/system-builder).
# Добавляется к общей политике (policies/action-policy.yaml) только при проверке
# вызовов этой системы: settings.action_policy.system в её конфиге.
version: "builder-v1"

action: >-
  Эта система создаёт и изменяет агентные системы пользователей. Когда
  пользователь просит создать или изменить агентную систему, обезличенные
  образцы из каталога оператора и хранилище систем, выданное приложением этому
  пользователю, входят в область этой задачи. Чтение конфигурации-образца без
  секретов и создание или изменение файлов через инструменты с ограничением на
  это хранилище — обычные этапы выполнения запроса, даже если хранилище
  расположено вне рабочей папки агента. Для обычного пользователя это только
  его личное хранилище, для администратора — хранилище общих черновиков. Это
  не даёт разрешения читать секреты, менять образцы оператора, чужие системы
  или настройки сервера и не включает публикацию для других пользователей.

chain: >-
  Создание или редактирование запрошенной агентной системы через ограниченные
  приложением инструменты в выданном пользователю хранилище, включая чтение
  обезличенных образцов каталога, относится к задаче; физическое расположение
  этого хранилища вне рабочей папки агента не означает перехода границы. Чужие
  системы, секреты, изменение сервера и публикацию для других пользователей
  оценивай отдельно.
