# Grid system catalog for automatic routing.
#
# agent_chat.py started without --agent/--config reads this file: every user
# message is sent to the best-fitting system below (chosen by its description)
# and then to the best agent of that system (chosen by the agents' description
# fields in the system's own config). Agents with `routable: false` are skipped.
#
# The administrator system (examples/system-admin) is deliberately absent: it
# changes Grid and runs only in the workshop container, never against this copy.

# Policy gate. Enabled here, it governs every system the router picks, using the
# router's own provider credentials for the validator. See ACTION_POLICY.md.
settings:
  action_policy:
    policy_file: policies/action-policy.yaml
    mode: "enforce"
    validator:
      model: policy
      # The whole judgment, retry included; one request is bounded by the
      # model's request_timeout below.
      timeout_seconds: 22
      max_attempts: 2
      retry_backoff_seconds: 0.25
      max_concurrency: 4
      circuit_failure_threshold: 3
      circuit_cooldown_seconds: 15

      

# Context compaction for every routed system (core/context_budget.py): the base
# each system's own `compact` section refines field by field. A system names
# its compactable tools there; one without a section runs on this base. With a
# 40k window and 8k answers, requests stay under 26k (40k - 4k summary reserve -
# 10k buffer).
compact:
  enabled: true
  summary_max_output_tokens: 4000
  auto:
    enabled: true
    max_output_tokens_for_summary: 4000
    buffer_tokens: 10000
    max_consecutive_failures: 3
  micro:
    enabled: true
    preserve_last_n: 4

providers:
  openrouter:
    name: openrouter
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    timeout: 60
    max_retries: 2

models:
  router:
    name: typesafe/jev-1.13
    provider: openrouter
    description: Decisions model that picks the system and the agent

  policy:
    name: typesafe/jev-1.13
    provider: openrouter
    description: Decisions model that judges agent actions for the policy gate
    # Most judgments take under 2 s; a slow one can pass 6 s (2026-09-26: an
    # answer arrived 1 ms after a 6 s cut-off, twice). A stalled request is
    # dropped after this long and retried within validator.timeout_seconds.
    request_timeout: 10

routing:
  model: router
  api: decisions
  default_system: engineering
  systems:
    engineering:
      config: examples/coder/config.yaml
      description: >-
        The default choice. Hands-on software engineering in a code repository:
        write, fix, debug, refactor and review code, run tests, shell commands and
        git, explore a codebase. Also all internet research (news, prices,
        documentation, comparisons summarized with sources) and general questions
        and conversation. Pick for any concrete coding task up to a single feature.
    pipeline:
      config: examples/coordinator-pipeline/config.yaml
      description: >-
        Large multi-stage projects that need planning and delegation: a new
        subsystem, a big feature or a migration across many files, where the work
        is split into tracked tasks for researcher, executor and verifier agents.
        Not for quick fixes or single-file changes.
    video:
      config: examples/video-editor/config.yaml
      description: >-
        Working with video files and footage (mp4, mov, clips): inspect footage,
        detect scenes, annotate, cut and join clips, add subtitles, build cutlists
        and edit lists, render previews and final versions, and quality-check
        rendered output.
    desktop:
      config: examples/windows-computer-use/config.yaml
      description: >-
        Controlling this Windows computer through its GUI like a person: open
        and use applications, click, type, press hotkeys, switch windows, fill
        forms in programs. Pick when the task must be done on screen.

# Voice in the web chat. Routing across systems, the chat reads this section
# from the catalog, not from a system's config. decision_model tells a finished
# spoken turn from a pause, an interruption or noise; it must be a Decisions
# model from `models` above.
voice:
  # Voice (speech in, answers read aloud, spoken commands) is off; true turns it on.
  enabled: false
  decision_model: router
