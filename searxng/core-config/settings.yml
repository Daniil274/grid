# SearXNG for Grid's web_search tool: the image's own defaults, and only what
# Grid changes. Engines come from the image, so they always match its version
# (a full copy of an older default file listed engines newer images dropped).
# https://docs.searxng.org/admin/settings/settings.html
use_default_settings:
  engines:
    # Tor onion search: fails to load without a Tor proxy, which Grid does not run.
    remove:
      - ahmia
      - torch

general:
  instance_name: "Grid search"

search:
  # web_search reads the JSON API.
  formats:
    - html
    - json

server:
  bind_address: "0.0.0.0"
  # Reached only by Grid on the compose network, never published: no rate
  # limiter, no public-instance checks, no image proxy.
  limiter: false
  public_instance: false
  image_proxy: false
  # Set SEARXNG_SECRET in the environment to override.
  secret_key: "grid-internal-searxng-not-published"

valkey:
  url: valkey://valkey:6379/0
