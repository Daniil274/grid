settings:
  default_agent: main
  working_directory: .
  allow_path_override: true
  max_turns: 100
  mcp_enabled: true
  max_tool_output_tokens: 12000
  project_tools:
    enabled: true
    tools_directory: ../../examples/coder/tools
providers:
  opencode:
    name: opencode
    base_url: https://opencode.ai/zen/go/v1
    api_key_env: OPENCODE_API_KEY
    default_headers:
      User-Agent: grid-agent-system/1.0
      x-opencode-session: grid-coder
    timeout: 300
    max_retries: 3
models:
  glm-flash:
    name: glm-5.3-flash
    provider: opencode
  deepseek-flash-latest:
    name: deepseek-v4.1-flash
    provider: opencode
tools:
  file_read:
    type: function
    description: Read a file
  file_write:
    type: function
    description: Create a file or replace its whole content
  file_replace:
    type: function
    description: Replace one exact fragment of a file
  file_edit_patch:
    type: function
    description: Apply a unified diff to a file
  file_append:
    type: function
    description: Append content to a file
  file_list:
    type: function
    description: List files in a directory
  file_search:
    type: function
    description: Find files by name regex
  file_content_search:
    type: function
    description: Find lines containing a text
  bash_tool:
    type: function
    description: Run shell commands in the workspace container (converters, pip, scripts)
  doc_tools:
    type: mcp
    tool_package: tools/doc_tools
    description: Documentation analysis, linting, TOC, link checks, terminology, format conversion, text extraction and offline PDF
  call_writer:
    type: agent
    target_agent: writer
    description: Delegate text writing, editing, TOC, terminology and Markdown/HTML/CSV conversion to the writer agent
    context_strategy: minimal
  call_converter:
    type: agent
    target_agent: converter
    description: Delegate text extraction and PDF conversion (including doc/docx) to the converter agent
    context_strategy: minimal
  call_reviewer:
    type: agent
    target_agent: reviewer
    description: Independently verify source and result artifacts against acceptance criteria
    context_strategy: minimal
agents:
  main:
    name: Docs coordinator
    timeout: 0  # No agent timeout: the coordinator must not be cut off mid-orchestration.
    model: [glm-flash, deepseek-flash-latest]
    mcp_enabled: true
    description: >-
      Documentation operations coordinator: delegates writing, PDF conversion
      and verification to specialized agents. Handles README, guides, lint, TOC,
      links, terminology, Markdown/HTML/CSV and PDF from text or doc/docx.
      Not for code changes, git, tests or internet research.
    tools: [call_writer, call_converter, call_reviewer, file_read, file_list, file_search]
    system_skills: [coordinator]
    custom_prompt: |
      Ты — координатор Docs Ops. Сам файлы не правишь и не конвертируешь.
      Разбери запрос, вызови call_writer и/или call_converter с путями и критериями приёмки, затем обязательно call_reviewer с путями исходников и результатов. Максимум три цикла правок. Итог: файлы, вердикт проверки, ограничения. Нет входа — FILE_NOT_FOUND, никого не вызывай. Не выдумывай содержимое.
  writer:
    name: Docs writer
    model: [glm-flash, deepseek-flash-latest]
    routable: false
    mcp_enabled: true
    tools: [file_read, file_write, file_replace, file_edit_patch, file_append, file_list, file_search, file_content_search, doc_tools]
    system_skills: [writer]
    custom_prompt: |
      Ты — исполнитель текстовых задач. Прими от координатора пути, задачу и критерии. Разведай (file_read, doc_stats, doc_lint), правь точечно как единственный владелец файлов, новые файлы создавай целиком. Конвертации текстовых форматов — новым файлом рядом, без перезаписи без overwrite=true. После работы перечитай результат, прогони doc_lint и check_links. Верни пути и проверки. Нет входа — FILE_NOT_FOUND, ничего не создавай.
  converter:
    name: Docs converter
    model: [glm-flash, deepseek-flash-latest]
    routable: false
    mcp_enabled: true
    tools: [file_read, file_list, file_search, bash_tool, doc_tools]
    system_skills: [converter]
    custom_prompt: |
      Ты — исполнитель PDF-конвертаций. Прими путь исходника и критерии. Сначала extract_text, затем convert_to_pdf или md_to_pdf (результат рядом, без перезаписи без overwrite=true). Pixel-perfect через soffice — только если просили точный макет Word. Проверь: файл есть, размер > 0, заголовок %PDF, исходник цел. Верни путь PDF, движок и ограничения (кириллица без TTF заменяется на ?). Нет файла — FILE_NOT_FOUND. Отказ только после реальных попыток, с командами и ошибками.
  reviewer:
    name: Docs reviewer
    model: [glm-flash, deepseek-flash-latest]
    routable: false
    mcp_enabled: true
    tools: [file_read, file_list, file_search, file_content_search, bash_tool, doc_tools]
    system_skills: [reviewer]
    custom_prompt: |
      Ты — независимый проверяющий. Файлы не создаёшь и не правишь. Прочитай исходник и результат сам (file_read, extract_text, doc_lint, check_links; для PDF — ls/head/%PDF через bash только чтением). Сверь с критериями координатора. Верни PASS с перечислением проверенного либо FAIL с конкретными дефектами. Если проверить невозможно, назови блокер и непроверенные критерии.
