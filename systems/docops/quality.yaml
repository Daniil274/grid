version: 1
goal: Операции с документацией командой агентов — координатор делегирует тексты, PDF-конвертацию и независимую проверку
result: Изменённые или новые файлы (Markdown, HTML, CSV, PDF и др.) рядом с исходником и краткий отчёт с вердиктом проверки
acceptance: Файлы содержат ожидаемое содержимое, исходники не потеряны, существующие файлы не перезаписаны без просьбы, при отсутствии входа ничего не выдумано и не создано, результат подтверждён независимым проверяющим
architecture: coordinator
rationale: Координатор раскладывает запрос и вызывает исполнителей через type agent, проверяющий читает артефакты сам. Разделение убирает конфликт «писатель сам себя проверяет» и фиксирует владельца каждого файла.
roles:
  - agent: main
    purpose: Разбор запроса, делегирование writer и converter, обязательная независимая проверка reviewer, итоговый отчёт
    inputs: Запрос пользователя и файлы рабочей папки, включая uploads и doc и docx
    outputs: Проверенный результат либо явный блокер, список файлов и вердикт проверки
    acceptance: Исполнитель и проверяющий вызваны через agent-вызовы, замечания возвращены на доработку, итог опирается на вердикт reviewer
    failure: Назвать незавершённый этап и блокер, успех без PASS проверяющего не объявлять
  - agent: writer
    purpose: Тексты и правки, TOC, терминология, Markdown HTML CSV конвертации
    inputs: Пути файлов, точная задача и критерии приёмки от координатора
    outputs: Пути созданных и изменённых файлов и выполненные проверки
    acceptance: Результат перечитан, doc_lint и check_links для затронутых файлов пройдены, чужое не задето
    failure: При отсутствии входа FILE_NOT_FOUND, выдуманных результатов нет
  - agent: converter
    purpose: Извлечение текста и PDF-конвертация офлайн, точный макет через soffice при необходимости
    inputs: Путь исходника txt md csv html docx doc и критерии приёмки
    outputs: Путь PDF рядом с исходником, движок и ограничения
    acceptance: PDF существует, размер больше нуля, заголовок PDF, исходник цел
    failure: При отсутствии файла FILE_NOT_FOUND, при нечитаемом источнике явная ошибка, команды и тексты ошибок приведены
  - agent: reviewer
    purpose: Независимая проверка исходника и результата по критериям координатора
    inputs: Пути исходника и результата, исходные критерии приёмки
    outputs: PASS с перечислением проверенного либо FAIL с конкретными дефектами
    acceptance: Артефакты прочитаны самостоятельно, а не со слов исполнителя, непроверенное названо
    failure: Файлы не изменять, при невозможности проверки назвать блокер
examples:
  - Преобразуй guide.md в HTML со встроенным CSS
  - Добавь оглавление в README.md и проверь ссылки
  - Приведи термины в docs/ к единому виду - email вместо e-mail
  - Сконвертируй table.csv в таблицу Markdown
  - Конвертируй uploads/manual.doc в PDF
  - Сконвертируй guide.md в PDF рядом с исходником
limitations:
  - "Офлайн-PDF читаемый, но не pixel-perfect. Таблицы Word, картинки и колонтитулы не сохраняются. Кириллица без Unicode-TTF заменяется на знак вопроса, ограничение называется в отчёте."
  - "Точный макет doc и docx зависит от soffice и pandoc в контейнере или возможности их установить. Без них результат приближённый."
  - "Конвертер Markdown в HTML покрывает распространённое подмножество Markdown, не полный CommonMark."
  - "Оценщик работает без сети, поэтому PDF-сценарии используют латиницу, core-шрифтов достаточно."
failure_behavior: Исходные файлы сохраняются, существующие результаты не перезаписываются без явной просьбы, причина сбоя называется в ответе
repetitions: 2
max_total_seconds: 1500
max_total_tokens: 500000
max_total_tool_calls: 400
scenarios:
  - name: md_to_html
    category: normal
    message: Сконвертируй guide.md в HTML (файл рядом с исходником) и не удаляй исходник.
    fixtures:
      guide.md: "# Guide\n\nUse **bold** text.\n\n## Install\n\n- one\n- two\n"
    timeout_seconds: 240
    max_tokens: 40000
    max_tool_calls: 25
    assertions:
      - kind: contains
        path: guide.html
        value: <strong>bold</strong>
      - kind: contains
        path: guide.html
        value: Guide
      - kind: equals
        path: guide.md
        value: "# Guide\n\nUse **bold** text.\n\n## Install\n\n- one\n- two\n"
  - name: md_to_pdf
    category: normal
    message: Сконвертируй guide.md в PDF (файл рядом с исходником) и не удаляй исходник.
    fixtures:
      guide.md: "# Guide\n\nUse bold text here.\n\n## Install\n\n- one\n- two\n"
    timeout_seconds: 240
    max_tokens: 40000
    max_tool_calls: 25
    assertions:
      - kind: exists
        path: guide.pdf
      - kind: equals
        path: guide.md
        value: "# Guide\n\nUse bold text here.\n\n## Install\n\n- one\n- two\n"
  - name: add_toc
    category: normal
    message: Добавь в README.md оглавление (заголовки второго и третьего уровня) и убедись, что содержимое документа не пострадало.
    fixtures:
      README.md: "# Project\n\nIntro text.\n\n## Install\n\nRun it.\n\n### Linux\n\nApt.\n\n## Usage\n\nUse it.\n"
    timeout_seconds: 240
    max_tokens: 40000
    max_tool_calls: 25
    assertions:
      - kind: contains
        path: README.md
        value: "[Install](#install)"
      - kind: contains
        path: README.md
        value: "[Linux](#linux)"
      - kind: contains
        path: README.md
        value: "Intro text."
      - kind: contains
        path: README.md
        value: "## Usage"
  - name: terminology
    category: ambiguous
    message: В notes.md везде используй термин "email" вместо "e-mail" (в прозе и заголовках). Блок кода не меняй.
    fixtures:
      notes.md: "# E-mail setup\n\nSend an e-mail to the admin. Then check your e-mail.\n\n```\nMAIL=e-mail\n```\n"
    timeout_seconds: 240
    max_tokens: 40000
    max_tool_calls: 25
    assertions:
      - kind: contains
        path: notes.md
        value: "# Email setup"
      - kind: contains
        path: notes.md
        value: "MAIL=e-mail"
      - kind: not_contains
        path: notes.md
        value: "Send an e-mail"
  - name: missing_input
    category: invalid_input
    message: Сконвертируй missing.md в HTML; если файла нет, ответь FILE_NOT_FOUND и ничего не создавай.
    timeout_seconds: 120
    max_tokens: 25000
    max_tool_calls: 15
    assertions:
      - kind: contains
        value: FILE_NOT_FOUND
      - kind: absent
        path: missing.html
  - name: no_overwrite
    category: repeat
    message: Сконвертируй page.md в page.html. Файл page.html уже существует и не должен быть перезаписан; сообщи об этом и, если нужно, создай результат под другим именем.
    fixtures:
      page.md: "# Page\n\nText.\n"
      page.html: KEEP-ME
    timeout_seconds: 240
    max_tokens: 40000
    max_tool_calls: 25
    assertions:
      - kind: equals
        path: page.html
        value: KEEP-ME
      - kind: equals
        path: page.md
        value: "# Page\n\nText.\n"
  - name: broken_links
    category: failure
    message: Проверь ссылки в index.md и назови в ответе все битые (файл или якорь). Файлы не меняй.
    fixtures:
      index.md: "# Index\n\n[ok](other.md) [gone](nowhere.md) [bad anchor](#missing-section)\n\n## Real\n"
      other.md: "# Other\n"
    timeout_seconds: 180
    max_tokens: 40000
    max_tool_calls: 20
    assertions:
      - kind: contains
        value: nowhere.md
      - kind: contains
        value: missing-section
      - kind: equals
        path: index.md
        value: "# Index\n\n[ok](other.md) [gone](nowhere.md) [bad anchor](#missing-section)\n\n## Real\n"
  - name: csv_table
    category: boundary
    message: Сконвертируй data.csv в таблицу Markdown (файл data.md). В данных есть символ вертикальной черты.
    fixtures:
      data.csv: "name;note\nalpha;a|b\nbeta;plain\n"
    timeout_seconds: 240
    max_tokens: 40000
    max_tool_calls: 25
    assertions:
      - kind: contains
        path: data.md
        value: "| name | note |"
      - kind: contains
        path: data.md
        value: "a\\|b"
      - kind: contains
        path: data.md
        value: "| beta | plain |"
