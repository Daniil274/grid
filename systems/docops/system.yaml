key: docops
name: Docs Ops
description: 'Операции с документацией в рабочей папке: написание и правка технических
  текстов (README, гайды, API-справки, changelog, инструкции), проверка структуры
  и стиля (lint Markdown), оглавление, проверка относительных ссылок и якорей, единая
  терминология, конвертация форматов Markdown ↔ HTML ↔ plain text ↔ CSV/таблицы без
  тяжёлых зависимостей, статистика и анализ документов. Работает с текстовыми файлами.
  НЕ для: изменения кода в репозитории, запуска тестов и git (система engineering),
  поиска в интернете, работы с бинарными форматами (docx, pdf, изображения), ноутбуков.'
