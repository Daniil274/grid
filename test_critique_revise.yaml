# Тест 2: Execute → Critique → Revise цикл
# Цель: Проверить что критика передаётся в revise и улучшает результат

settings:
  default_agent: "test_critic"
  max_turns: 10
  debug: true
  mcp_enabled: true

  social_intelligence:
    enabled: true
    blackboard:
      enabled: true
      persist_path: "logs/test_critique_blackboard.json"
    pipeline_memory:
      enabled: true
      persist_path: "logs/test_critique_pipelines.json"
      similarity_threshold: 0.6
    primitives:
      critique_model: "gpt-nano"  # Используем ту же модель для критики
    refinement:
      enabled: true
      max_iterations: 3

si_prompts:
  execute_default: |
    Ты исполнитель. Выполни задачу качественно.

  critique: |
    Ты ЖЁСТКИЙ критик. Найди ВСЕ проблемы. Верни JSON:
    {
      "issues": ["проблема 1", "проблема 2", ...],
      "strengths": ["сильная сторона"],
      "suggestions": ["улучшение 1", ...],
      "severity": "none|minor|major|critical",
      "overall_score": 0.0-1.0
    }
    Будь строгим - ставь низкие оценки если есть проблемы!

  revise: |
    Ты ревизор. Исправь ВСЕ проблемы из критики.
    Верни ПОЛНЫЙ исправленный результат (не описание изменений!).

  validate: |
    Проверь на галлюцинации. Верни JSON:
    {"valid": true|false, "issues": [...], "confidence": 0.8}

  pipeline_planner: |
    Создай пайплайн из примитивов.
    Доступны: execute, critique, revise, validate, synthesize, branch, vote.

    Для задач требующих качества используй:
    execute → critique → revise → validate

    Верни JSON:
    {
      "pipeline_name": "имя",
      "steps": [
        {"primitive": "execute", "params": {"tools": ["filesystem"]}, "output_key": "draft"},
        {"primitive": "critique", "params": {"perspective": "quality"}, "input_from": "draft", "output_key": "review"},
        {"primitive": "revise", "params": {"feedback_from": "review", "tools": ["filesystem"]}, "input_from": "draft", "output_key": "revised"}
      ]
    }

providers:
  openrouter:
    name: "openrouter"
    base_url: "https://openrouter.ai/api/v1"
    api_key_env: "OPENROUTER_API_KEY"
    timeout: 300

models:
  gpt-nano:
    name: "openai/gpt-4o-nano"
    provider: "openrouter"
    temperature: 0.6
    max_tokens: 6000

tools:
  filesystem:
    type: mcp
    server_command: ["python", "openai-agents-python/mcp_servers/mcp_server_local_filesystem/mcp_server_local_filesystem_stdio.py"]
    add_working_directory: true

  orchestrate_emergent:
    type: function
    description: "Эмерджентная оркестрация с самообучением"

agents:
  test_critic:
    name: "test_critic"
    model: "gpt-nano"
    tools: ["filesystem", "orchestrate_emergent"]
    custom_prompt: |
      Ты тестируешь цикл critique → revise.

      ТЕСТ:
      1. Используй orchestrate_emergent для задачи: "Напиши простую функцию Python для сортировки списка"
      2. Система должна:
         - Выполнить (execute)
         - Раскритиковать (critique) - найти проблемы
         - Исправить (revise) - учесть критику
         - Валидировать (validate)
      3. Проверь logs/test_critique_blackboard.json - должны быть записи CRITIQUE и ARTIFACT от reviser
      4. Сравни первую и исправленную версии - вторая должна быть лучше
