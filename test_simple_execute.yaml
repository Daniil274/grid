# Тест 1: Простой execute с blackboard context
# Цель: Проверить что агент читает blackboard перед выполнением

settings:
  default_agent: "test_executor"
  max_turns: 10
  debug: true
  mcp_enabled: true

  allowed_models:
    - "grok-fast"

  social_intelligence:
    enabled: true
    blackboard:
      enabled: true
      persist_path: "logs/test_simple_blackboard.json"
      max_entries: 100
    pipeline_memory:
      enabled: true
      persist_path: "logs/test_simple_pipelines.json"
    refinement:
      enabled: true
      max_iterations: 2

si_prompts:
  execute_default: |
    Ты исполнитель задач.
    ВАЖНО: Если видишь контекст из blackboard - используй его!
    Результат должен учитывать ВСЮ доступную информацию.

  revise: |
    Исправь проблемы по обратной связи. Верни улучшенную версию.

  validate: |
    Проверь на галлюцинации и ошибки. Верни JSON:
    {"valid": true|false, "issues": [...], "confidence": 0.0-1.0}

providers:
  openrouter:
    name: "openrouter"
    base_url: "https://openrouter.ai/api/v1"
    api_key_env: "OPENROUTER_API_KEY"
    timeout: 300

models:
  grok-fast:
    name: "x-ai/grok-4.1-fast"
    provider: "openrouter"
    temperature: 0.7
    max_tokens: 8000
    description: "Быстрая модель для оркестрации"


# МCP-сервер для file operations
tools:
  filesystem:
    type: "mcp"
    server_command: ["npx", "@modelcontextprotocol/server-filesystem"]
    add_working_directory: true
    description: "MCP сервер для работы с файловой системой (ограничен рабочей директорией)"
    prompt_addition: "Используй filesystem(task) для доступа к файловой системе. task - это операция, которую нужно выполнить."
  

  orchestrate_emergent:
    type: function
    description: "Эмерджентная оркестрация с самообучением"
    prompt_addition: |
      Доступные модели: "grok-fast"

agents:
  test_executor:
    name: "test_executor"
    model: "grok-fast"
    tools: ["filesystem", "orchestrate_emergent"]
    custom_prompt: |
      Ты тестовый агент для проверки Social Intelligence Framework.
      Используй orchestrate_emergent для выполнения задач.

      СЦЕНАРИЙ ТЕСТА:
      1. Выполни простую задачу через orchestrate_emergent
      2. Затем выполни похожую задачу - проверь что видишь контекст из первой
      3. Проверь файл logs/test_simple_blackboard.json - там должны быть записи
