settings:
  default_agent: "voice_assistant"
  max_turns: 10
  working_directory: "voice_agent/workspace"
  logs_directory: "D:/Work/repo/agents_portable/logs"
  mcp_enabled: true

  agent_logging:
    enabled: true
    level: "full"  # basic, detailed, full
    save_prompts: true
    save_conversations: true
    save_executions: true
    # Общие правила использования инструментов (добавляются к каждому агенту один раз)
    tools_common_rules: |
      Всегда выполняй операции с файлами через инструменты и возвращай их результаты.
      Запрещено утверждать создание/изменение файла без вызова инструмента.

# Голосовой движок (STT + TTS)
voice:
  enabled: true
  stt:
    model_size: "large-v3"    # для RPi5: "base" или "small"
    device: "cuda"            # для RPi5: "cpu"
    compute_type: "int8"   # для RPi5: "int8"
  tts:
    model_path: "speech-text/model.pt"
    speaker: "eugene"          # xenia, aidar, kseniya, baya, eugene
    sample_rate: 48000

# Параметры голосового ассистента
voice_agent:
  keywords:
    start: ["начало запроса", "начало", "слушай", "агент", "джарвис", "квен"]
    end: ["конец строки", "конец запроса", "конец", "стоп", "выполняй", "выполни", "исполни", "исполняй", "отвечай"]
  recording:
    sample_rate: 16000          # 16kHz — стандарт Whisper
    channels: 1
    chunk_duration: 0.5         # секунд на чанк
    silence_threshold: 0.002    # RMS порог энергии (тишина vs речь) (уменьшено с 0.008 для чувствительности)
    silence_chunks_end: 4       # чанков тишины для конца сегмента (~2с)
    auto_end_silence_seconds: 2.5  # пауза после речи → авто-завершение запроса (0 = отключено)
    max_record_seconds: 120     # максимум записи (безопасность)
    device: null                # null = системный default; число = индекс (см. --list-devices)
  tts:
    temp_dir: "voice_agent/tts_temp"
    speaker: "xenia"            # переопределяет voice.tts.speaker

providers:
  openrouter:
    name: "OpenRouter"
    base_url: "https://openrouter.ai/api/v1"
    api_key_env: "OPENROUTER_API_KEY"
    timeout: 60
    max_retries: 2

  lm-studio:
    name: "lm-studio"
    base_url: "http://192.168.3.2:1234/v1"
    api_key: "lm-studio"
    timeout: 300
    max_retries: 3

models: 
  liquid-lfm2.5-1.2b:
    name: "liquid/lfm2.5-1.2b"
    provider: "lm-studio"
    temperature: 0.7
    max_tokens: 8000
    description: "Liquid LFM2.5 1.2b модель"
    streaming_enabled: true   # TTS нужен полный ответ (не стриминг)

  qwen3.5-4b:
    name: "qwen_qwen3.5-4b"
    reasoning: {enabled: false}
    provider: "lm-studio"
    temperature: 0.3
    max_tokens: 8000
    description: "qwen3-4b"
    streaming_enabled: true

  qwen3.5-397b:
    name: "qwen/qwen3.5-397b-a17b:nitro"
    provider: "openrouter"
    reasoning: {enabled: false}
    temperature: 0.3
    max_tokens: 8000
    description: "qwen3.5-397b-a17b:nitro"
    streaming_enabled: true  

  grok-4.1-fast:
    name: "x-ai/grok-4.1-fast"
    provider: "openrouter"
    temperature: 0.3
    max_tokens: 8000
    description: "grok-4.1-fast"
    streaming_enabled: true  

  gemini-2.5-flash-lite:
    name: "google/gemini-2.5-flash-lite:turbo"
    provider: "openrouter"
    temperature: 0.3
    max_tokens: 8000
    description: "gemini-2.5-flash-lite"
    streaming_enabled: true  

  gpt-oss-20b:
    name: "openai/gpt-oss-20b:turbo"
    provider: "openrouter"
    temperature: 0.3
    max_tokens: 8000
    description: "gpt-oss-20b"
    streaming_enabled: true  
    
tools:
  keyboard_type:
    type: "function"
    description: "Печатает текст как на клавиатуре"

  keyboard_press:
    type: "function"
    description: "Нажимает одну или несколько клавиш (hotkey)"

  keyboard_hotkey:
    type: "function"
    description: "Нажимает комбинацию клавиш одновременно"

  view_image:
    type: "function"
    description: "Показывает изображение."

  take_screenshot:
    type: "function"
    description: "Делает скриншот всего экрана. Возвращает изображение и размер в пикселях (нужен для crop_image)."

  crop_image:
    type: "function"
    description: "Вырезает фрагмент последнего скриншота по пиксельным координатам (left, top, right, bottom). Используй для zoom-in после take_screenshot."

  terminal:
    type: "mcp"
    server_command: ["npx", "@dillip285/mcp-terminal"]
    add_working_directory: true
    description: "MCP сервер для выполнения команд терминала"
    prompt_addition: "Используй execute_command для выполнения команд в терминале."

  image_analyzer:
    type: "agent"
    name: "image_analyzer"
    description: "Анализирует изображение."
    prompt_addition: |
      Используй image_analyzer(task) когда нужно аназировать изображение.
  
  keyboard_agent:
    type: "agent"
    name: "keyboard_agent"
    description: "Агент для работы с клавиатурой"
    prompt_addition: |
      Используй keyboard_agent(task) когда нужно напечатать текст, нажать клавишу или комбинацию клавиш.

agents:

 # Document analyzer - агент для работы с документами и изображениями
  image_analyzer:
    name: "Анализатор изображений"
    model: "qwen3.5-397b"
    tools: ["take_screenshot", "crop_image", "view_image"]
    description: "Агент для анализа изображений и скриншотов"
    custom_prompt: |
      Ты специалист по анализу изображений и экрана.
      Алгоритм работы:
      1. Вызови take_screenshot() — получишь изображение и размер экрана (например 1920x1080).
      2. Рассмотри скриншот. Если нужна деталь — вызови crop_image(left, top, right, bottom) с пиксельными координатами.
         Например для экрана 1920x1080: правый верхний угол=(1400,0,1920,300), строка статуса=(0,1020,1920,1080).
      3. Делай столько crop_image вызовов, сколько нужно.
      4. Верни точный текстовый ответ — только факты с экрана, без лишних слов.

  keyboard_agent:
    name: "Агент клавиатуры"
    model: "qwen3.5-4b"
    tools: ["keyboard_type", "keyboard_press", "keyboard_hotkey"]
    description: "Агент для работы с клавиатурой"
    custom_prompt: |
      Ты специалист по работе с клавиатурой.
      Ты можешь печатать текст, нажимать клавиши и комбинации клавиш.

  voice_assistant:
    name: "Голосовой ассистент"
    model: "qwen3.5-4b"
    tools: ["image_analyzer", "keyboard_agent"]
    custom_prompt: |
      You are a voice assistant. Your task is to communicate with the user
       and carry out their requests by delegating them to agents.
      - Request to analyze an image or screenshot → call image_analyzer with full request context, then speak the response.
      - Request to type text → call keyboard_agent with full request context, then speak the response.
      IMPORTANT: ALWAYS respond inside <speak>...</speak> at the end of each task.
      There must be NOTHING outside the <speak>...</speak> tags. No text before, no text after.
      SSML rules (Silero v5):
        <speak>...</speak>                    — root element (exactly one per entire response)
        <p>...</p>                            — paragraph (pause ~500ms)
        <s>...</s>                            — sentence (pause ~200ms)
        <break time="300ms"/>                 — explicit pause
        <prosody rate="slow">text</prosody>   — rate: x-slow slow medium fast x-fast
        <prosody pitch="high">text</prosody>  — pitch: x-low low medium high x-high
      Communication rules:
        - Be brief: 1–4 sentences, max ~100 words
        - Conversational style, as in a live dialogue
        - No lists, tables, or markdown (including ```xml or ```)
        - Pauses between meaning blocks via <break> or <p>
        - Do not use file paths in the spoken output.
        - Always respond in Russian.
      Example of CORRECT response:
        <speak>
          <p>Sure, <prosody rate="slow">I'll answer your question.</prosody></p>
          <break time="300ms"/>
          <p>Today the weather is <prosody pitch="high">great</prosody> for a walk!</p>
        </speak>
      Example of INCORRECT response (DO NOT do this):
        <speak>Hi!</speak> <p>Yes, I'm ready to help.</p>
