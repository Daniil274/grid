<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>Grid map · Grid</title>
  <link rel="stylesheet" href="/static/styles/tokens.css">
  <link rel="stylesheet" href="/static/styles/base.css">
  <link rel="stylesheet" href="/static/styles/grid.css">
</head>
<body class="gridPage">
  <main class="gridShell">
    <header class="gridHeader">
      <div>
        <a href="/" class="gridBrand">GRID / MAP</a>
        <h1 id="grid-title">Project map</h1>
        <p>The project as it stands: its goals and tasks, the chats working on it, and what those chats left in the project's space. The map does not rearrange itself: a task keeps its place while its state changes.</p>
      </div>
      <div class="gridActions">
        <button id="grid-refresh" class="btn btn--ghost" type="button">Refresh</button>
      </div>
    </header>
    <nav id="grid-breadcrumb" class="gridCrumbs" aria-label="Project path"></nav>
    <div id="grid-status" class="gridStatus" role="status" aria-live="polite">Loading the map…</div>
    <div class="gridBody">
      <div id="grid-map" class="gridMap__viewport" aria-label="Map of the project"></div>
      <aside id="grid-overview" class="gridOverview" aria-label="Overview"></aside>
    </div>
  </main>
  <script type="module" src="/static/js/grid/main.js"></script>
</body>
</html>
