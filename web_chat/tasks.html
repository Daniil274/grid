<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>Tasks · Grid</title>
  <link rel="stylesheet" href="/static/styles/tokens.css">
  <link rel="stylesheet" href="/static/styles/base.css">
  <link rel="stylesheet" href="/static/styles/tasks.css">
</head>
<body class="tasksPage">
  <main class="tasksShell">
    <header class="tasksHeader">
      <div><a href="/" class="tasksBrand">GRID / TRACKER</a><h1>Tasks</h1><p>The tracker of your workspace: what the chats planned and what stands beside them.</p></div>
      <div class="tasksActions">
        <label><input id="live" type="checkbox" checked> Live · 30s</label>
        <button id="refresh" class="btn btn--ghost">Refresh</button>
        <button id="theme" class="btn btn--ghost">Theme</button>
        <button id="new-task" class="btn btn--primary">New task</button>
      </div>
    </header>
    <form id="filters" class="tasksFilters">
      <label class="tasksSearch">Search<input id="search" type="search" placeholder="Title, id or notes"></label>
      <label>Status<select id="status-filter">
        <option value="" selected>All tasks</option>
        <option value="open">Open</option>
        <option value="in_progress">In progress</option>
        <option value="blocked">Blocked</option>
        <option value="deferred">Deferred</option>
        <option value="closed">Closed</option>
      </select></label>
      <label>Project<select id="project-filter"><option value="" selected>All projects</option></select></label>
      <label>Type<select id="type"><option value="" selected>All types</option></select></label>
      <label>Priority<select id="priority">
        <option value="" selected>All</option>
        <option value="0">P0</option><option value="1">P1</option><option value="2">P2</option>
        <option value="3">P3</option><option value="4">P4</option>
      </select></label>
      <div class="tasksViews" role="tablist" aria-label="View">
        <button id="view-board" class="btn btn--ghost" type="button" role="tab" aria-selected="true">Board</button>
        <button id="view-list" class="btn btn--ghost" type="button" role="tab" aria-selected="false">List</button>
      </div>
    </form>
    <div id="status" role="status" aria-live="polite">Loading tasks…</div>
    <section id="metrics" class="tasksMetrics" aria-label="Task counts"></section>
    <section id="board" class="tasksBoard" aria-label="Tasks by state"></section>
    <section id="list" class="tasksListWrap" hidden aria-label="Tasks as a table">
      <div class="tasksTableScroll"><table class="tasksTable">
        <thead><tr><th>State</th><th>Task</th><th>Type</th><th>Priority</th><th>Assignee</th><th>Depends on</th><th>Updated</th></tr></thead>
        <tbody id="list-rows"></tbody>
      </table></div>
    </section>
  </main>
  <script type="module" src="/static/js/tasks/page.js"></script>
</body>
</html>
